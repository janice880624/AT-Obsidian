<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="45" y="55" class="t">運動員腹股溝痛：先紅旗，再依 Doha 分類</text><rect x="160" y="90" width="880" height="105" rx="16" class="r"/><text x="235" y="132" class="h">創傷無法負重／發燒／夜間進展痛／腹腔泌尿急症／SCFE？</text><text x="410" y="170" class="b">是：停止測試，依急迫性轉介</text><rect x="60" y="245" width="250" height="150" rx="14" class="x"/><text x="105" y="285" class="h">內收肌相關</text><text x="86" y="330" class="b">壓痛＋抗阻熟悉痛</text><text x="86" y="365" class="b">單一擠壓痛不確診</text><rect x="335" y="245" width="250" height="150" rx="14" class="x"/><text x="385" y="285" class="h">髂腰肌相關</text><text x="365" y="330" class="b">抗阻屈髖／伸展痛</text><text x="365" y="365" class="b">彈響可無症狀</text><rect x="610" y="245" width="250" height="150" rx="14" class="x"/><text x="655" y="285" class="h">腹股溝／恥骨相關</text><text x="640" y="330" class="b">咳嗽腹壓與局部壓痛</text><text x="640" y="365" class="b">仍須排除疝氣</text><rect x="885" y="245" width="250" height="150" rx="14" class="x"/><text x="930" y="285" class="h">髖關節／其他原因</text><text x="915" y="330" class="b">ROM、機械症狀與影像</text><text x="915" y="365" class="b">腰椎、神經與內臟</text><rect x="175" y="455" width="850" height="120" rx="16" class="g"/><text x="360" y="497" class="h">允許同時存在兩種以上臨床實體</text><text x="250" y="540" class="b">分類證據＋力量／功能＋隔日反應，才形成處置與回場計畫</text><rect x="225" y="625" width="750" height="55" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="320" y="660" class="b">Doha 分類不是單一組織的影像或確診標籤。</text><text x="65" y="725" class="b">本圖不取代急救、影像、兒科／骨科或腹腔泌尿專科。</text></svg>
