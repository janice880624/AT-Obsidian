<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:29px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="45" y="52" class="t">持續性足痛＋初始 X 光陰性：不要直接回場</text><rect x="100" y="88" width="1000" height="120" rx="16" class="r"/><text x="205" y="132" class="h">無法負重、發燒紅熱、夜間進展痛、開放傷或神經血管異常？</text><text x="310" y="175" class="b">有：停止負荷，依感染、骨傷或神經血管風險轉介</text><rect x="75" y="275" width="320" height="205" rx="14" class="x"/><text x="165" y="320" class="h">骨壓力傷</text><text x="105" y="365" class="b">精確骨性壓痛／推蹬痛</text><text x="105" y="405" class="b">X 光早期可能正常</text><text x="105" y="445" class="b">MRI 常為下一步</text><rect x="440" y="275" width="320" height="205" rx="14" class="x"/><text x="515" y="320" class="h">軟組織／動態</text><text x="470" y="365" class="b">蹠板、肌腱、神經</text><text x="470" y="405" class="b">超音波可動態評估</text><text x="470" y="445" class="b">MRI 可看整體與骨髓</text><rect x="805" y="275" width="320" height="205" rx="14" class="x"/><text x="885" y="320" class="h">僵硬足／聯合</text><text x="835" y="365" class="b">活動受限、反覆扭傷</text><text x="835" y="405" class="b">CT 詳骨；MRI 看非骨性</text><text x="835" y="445" class="b">由專科整合症狀</text><rect x="180" y="555" width="840" height="100" rx="16" class="g"/><text x="345" y="598" class="h">低風險才建立負荷基線、保護疑似組織並限期複評</text><text x="315" y="637" class="b">影像選擇依工作假設；單一陰性或陽性結果都不等於完整診斷。</text><text x="355" y="720" class="b">症狀惡化或不符合預期 → 回到安全分流。</text></svg>
