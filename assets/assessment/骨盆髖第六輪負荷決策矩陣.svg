<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}.a{fill:#eef6ff;stroke:#1769aa;stroke-width:3}</style><text x="42" y="55" class="t">髖穩定與股直肌：負荷進展決策矩陣</text><g transform="translate(55 115)"><rect width="250" height="190" rx="15" class="x"/><text x="60" y="42" class="h">1 安全與基線</text><text x="25" y="90" class="b">排骨傷、感染、脫套傷</text><text x="25" y="130" class="b">步行、ROM、神經與力量</text><text x="25" y="170" class="b">記錄熟悉症狀</text><rect x="275" width="250" height="190" rx="15" class="x"/><text x="335" y="42" class="h">2 中間範圍力量</text><text x="300" y="90" class="b">髖周等長與慢速力量</text><text x="300" y="130" class="b">軀幹與單腳控制</text><text x="300" y="170" class="b">避免被動懸掛末端</text><rect x="550" width="250" height="190" rx="15" class="x"/><text x="610" y="42" class="h">3 速度與方向</text><text x="575" y="90" class="b">跑步、加速、煞停</text><text x="575" y="130" class="b">多方向、長肌長</text><text x="575" y="170" class="b">一次主改一項</text><rect x="825" width="250" height="190" rx="15" class="x"/><text x="890" y="42" class="h">4 專項與末端</text><text x="850" y="90" class="b">踢擊、跳躍、舞蹈</text><text x="850" y="130" class="b">末端角度漸進暴露</text><text x="850" y="170" class="b">連續訓練與共享決策</text></g><rect x="145" y="440" width="910" height="145" rx="16" class="a"/><text x="420" y="482" class="h">共同進階條件</text><text x="205" y="530" class="b">症狀位置與強度穩定｜力量與動作品質改善｜當下任務可控｜24–48 小時回到基線</text><text x="240" y="565" class="b">不穩感、giving-way 或爆裂感增加：退階並重新分流</text><rect x="170" y="625" width="860" height="50" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="245" y="657" class="b">回場是連續決策；疼痛下降、影像或單次測試都不足以單獨放行。</text></svg>
