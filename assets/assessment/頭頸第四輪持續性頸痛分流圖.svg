<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="45" y="55" class="t">持續性頸痛：先辨識神經、血管與系統性紅旗</text><rect x="140" y="90" width="920" height="120" rx="16" class="r"/><text x="235" y="132" class="h">步態／手笨、多肢麻弱、顱神經、雷擊痛、發燒或重大創傷？</text><text x="405" y="178" class="b">依急迫度轉介，不做終末挑釁</text><rect x="150" y="260" width="400" height="195" rx="14" class="x"/><text x="260" y="302" class="h">神經學最小集合</text><text x="190" y="347" class="b">肌節、皮節、反射與周邊神經</text><text x="190" y="385" class="b">Hoffmann、下肢反射、步態</text><text x="190" y="423" class="b">必要時顱神經與神經血管</text><rect x="650" y="260" width="400" height="195" rx="14" class="x"/><text x="760" y="302" class="h">臨床整合</text><text x="690" y="347" class="b">單側／多節段、機械／非機械</text><text x="690" y="385" class="b">創傷、夜間與全身症狀</text><text x="690" y="423" class="b">影像與轉介依情境，不看單一測試</text><rect x="205" y="520" width="790" height="105" rx="16" class="g"/><text x="360" y="565" class="h">無紅旗：建立功能基線與追蹤門檻</text><text x="280" y="602" class="b">有新神經學、全身症狀或治療失敗即重新分流</text><text x="140" y="705" class="b">本圖不取代急救、醫療診斷、影像或神經外科決策。</text></svg>
