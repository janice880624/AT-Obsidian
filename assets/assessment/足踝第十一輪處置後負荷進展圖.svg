<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f8fafc"/><text x="60" y="70" font-size="34" font-family="sans-serif" fill="#0f172a">處置後負荷進展：以醫療限制與隔日反應把關</text><g font-family="sans-serif" font-size="22" text-anchor="middle"><g fill="#e0f2fe" stroke="#0369a1" stroke-width="4"><rect x="65" y="170" width="190" height="120" rx="20"/><rect x="285" y="170" width="190" height="120" rx="20"/><rect x="505" y="170" width="190" height="120" rx="20"/><rect x="725" y="170" width="190" height="120" rx="20"/><rect x="945" y="170" width="190" height="120" rx="20"/></g><text x="160" y="220">保護與活動度</text><text x="160" y="255">傷口／骨癒合</text><text x="380" y="220">無痛步行</text><text x="380" y="255">對稱步態</text><text x="600" y="220">力量與平衡</text><text x="600" y="255">提踵／控制</text><text x="820" y="220">跑走或低跳</text><text x="820" y="255">單一變項增加</text><text x="1040" y="220">專項回場</text><text x="1040" y="255">速度／方向</text><g stroke="#334155" stroke-width="5" fill="none"><path d="M255 230 H285"/><path d="M475 230 H505"/><path d="M695 230 H725"/><path d="M915 230 H945"/></g><rect x="160" y="385" width="880" height="170" rx="24" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="600" y="435">每一階都檢查</text><text x="600" y="480">當下疼痛與步態 ｜ 隔日痛腫 ｜ 傷口／紅熱 ｜ 神經血管</text><text x="600" y="525">反應超標 → 回退一階、重新評估，不用止痛藥硬撐</text></g><text x="60" y="650" font-family="sans-serif" font-size="20" fill="#475569">原創示意圖｜不取代手術、感染或骨折個別負重指示｜CC BY 4.0</text></svg>