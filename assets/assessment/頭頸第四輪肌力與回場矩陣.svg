<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="45" y="55" class="t">頭頸回場：安全、力量、感覺運動與接觸暴露</text><g transform="translate(55 115)"><rect width="250" height="175" rx="15" class="x"/><text x="55" y="42" class="h">1 醫療安全</text><text x="25" y="88" class="b">骨折／不穩／頸髓／血管</text><text x="25" y="125" class="b">神經學正常與專科許可</text><text x="25" y="158" class="b">症狀與活動度基線</text><rect x="275" width="250" height="175" rx="15" class="x"/><text x="332" y="42" class="h">2 基礎控制</text><text x="300" y="88" class="b">中立位多方向等長</text><text x="300" y="125" class="b">位置回復與眼頭協調</text><text x="300" y="158" class="b">肩帶與軀幹整合</text><rect x="550" width="250" height="175" rx="15" class="x"/><text x="608" y="42" class="h">3 運動負荷</text><text x="575" y="88" class="b">速度、疲勞、視覺環境</text><text x="575" y="125" class="b">反應性擾動與決策</text><text x="575" y="158" class="b">非接觸完整訓練</text><rect x="825" width="250" height="175" rx="15" class="x"/><text x="875" y="42" class="h">4 接觸準備</text><text x="850" y="88" class="b">技術、預期再到不可預期</text><text x="850" y="125" class="b">位置與碰撞暴露分級</text><text x="850" y="158" class="b">專科與運動規則整合</text></g><rect x="150" y="395" width="900" height="175" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="470" y="438" class="h">共同通關條件</text><text x="195" y="486" class="b">無神經或血管症狀｜動作品質穩定｜負荷後隔日回基線</text><text x="195" y="530" class="b">測試方法固定｜不只看左右對稱｜接觸個案需專科許可</text><rect x="165" y="625" width="870" height="50" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="235" y="657" class="b">單次等長肌力、無痛活動度或症狀已消失，都不足以獨立決定回場。</text></svg>
