<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="45" y="55" class="t">過頭運動回場：四個面向，不靠單一百分比</text><g transform="translate(55 120)"><rect width="250" height="190" rx="15" class="x"/><text x="65" y="42" class="h">1 症狀與信心</text><text x="28" y="90" class="b">日常、睡眠、投擲階段</text><text x="28" y="130" class="b">恐懼與隔日反應</text><text x="28" y="170" class="b">可接受波動範圍</text><rect x="275" width="250" height="190" rx="15" class="x"/><text x="340" y="42" class="h">2 臨床能力</text><text x="303" y="90" class="b">活動度、肌力、耐力</text><text x="303" y="130" class="b">肩胛與神經血管</text><text x="303" y="170" class="b">個人基線與測量誤差</text><rect x="550" width="250" height="190" rx="15" class="x"/><text x="615" y="42" class="h">3 功能表現</text><text x="578" y="90" class="b">USSPT 等開／閉鏈測試</text><text x="578" y="130" class="b">動作品質與側別</text><text x="578" y="170" class="b">不以對稱率單獨放行</text><rect x="825" width="250" height="190" rx="15" class="x"/><text x="890" y="42" class="h">4 運動暴露</text><text x="853" y="90" class="b">球數、強度、位置</text><text x="853" y="130" class="b">完整訓練與決策壓力</text><text x="853" y="170" class="b">連續日與賽程恢復</text></g><rect x="155" y="420" width="890" height="155" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="415" y="465" class="h">進展規則：一次增加一個主要變因</text><text x="210" y="510" class="b">距離 → 強度 → 次數 → 變化 → 決策／疲勞；每階段查看當下與隔日反應。</text><text x="210" y="550" class="b">若出現脫臼感、後側深痛、無力、麻木或血管徵象，立即停止並重新評估。</text><text x="130" y="660" class="b">回場是共享決策；診斷、影像、運動需求與風險容忍度均需納入。</text></svg>
