<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">慢性單關節膝腫與反覆血腫分流</title><desc id="d">教育示意圖</desc><rect width="1200" height="675" fill="#fff"/><text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700" fill="#132238">慢性單關節膝腫與反覆血腫分流</text><line x1="60" y1="95" x2="1140" y2="95" stroke="#d7dee8" stroke-width="3"/><g font-family="sans-serif"><rect x="100" y="140" width="1000" height="80" rx="18" fill="#e9f0f8"/><text x="145" y="190" font-size="27">慢性單膝腫／反覆積液／無外傷血腫</text><path d="M600 220 V275" stroke="#496987" stroke-width="5"/><rect x="80" y="285" width="480" height="215" rx="22" fill="#fff0f0" stroke="#c94848" stroke-width="3"/><text x="120" y="335" font-size="25" font-weight="700" fill="#8b2424">急迫處理</text><text x="120" y="380" font-size="20">全身不穩、急性熱腫、不能負重</text><text x="120" y="415" font-size="20">快速血腫、循環異常、新麻弱</text><rect x="640" y="285" width="480" height="215" rx="22" fill="#eff8f1" stroke="#3e8b5c" stroke-width="3"/><text x="680" y="335" font-size="25" font-weight="700" fill="#27633f">穩定但需影像／檢驗</text><text x="680" y="380" font-size="20">感染：關節液＋滑膜組織</text><text x="680" y="415" font-size="20">滑膜病灶：MRI／都卜勒／病理</text><text x="150" y="560" font-size="21" fill="#526477">單一積液測試或血性抽吸不能決定病因</text></g><text x="60" y="640" font-family="sans-serif" font-size="18" fill="#526477">教育示意圖｜不取代影像、診斷、病理或專科評估</text></svg>
