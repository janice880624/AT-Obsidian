<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#fff"/><text x="60" y="65" font-family="sans-serif" font-size="34">後肩痛、滑移與無力：先安全再定位</text><g font-family="sans-serif" font-size="22" text-anchor="middle"><rect x="390" y="105" width="420" height="80" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/><text x="600" y="155">未復位／無脈／進展神經缺損／發燒紅熱？</text><path d="M600 185 V235" stroke="#334155" stroke-width="5"/><rect x="390" y="235" width="420" height="80" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="600" y="285">是 → 停止測試、保護並急診或加速專科</text><path d="M600 315 V380 M600 380 H200 V425 M600 380 V425 M600 380 H1000 V425" fill="none" stroke="#334155" stroke-width="5"/><rect x="55" y="425" width="290" height="165" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="200" y="470">投擲後側痛</text><text x="200" y="510">負荷期別＋旋轉弧</text><text x="200" y="545">影像找共病</text><rect x="455" y="425" width="290" height="165" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="600" y="470">推撐滑移</text><text x="600" y="510">方向性檢查＋盂形態</text><text x="600" y="545">先足量復健</text><rect x="855" y="425" width="290" height="165" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="1000" y="470">外旋／三角肌無力</text><text x="1000" y="510">肌萎縮圖譜＋MRI</text><text x="1000" y="545">必要時 EMG</text><text x="600" y="665">任何單一特殊檢查、影像骨化或囊腫，都不是確診工具</text></g><text x="60" y="730" font-family="sans-serif" font-size="19" fill="#475569">原創示意圖｜CC BY 4.0</text></svg>