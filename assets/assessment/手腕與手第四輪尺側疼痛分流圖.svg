<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="45" y="55" class="t">尺側腕痛與卡彈：先排除急症，再建立結構假設</text><rect x="140" y="90" width="920" height="115" rx="16" class="r"/><text x="225" y="135" class="h">變形、開放傷、手冷、進行性麻弱或主動肌腱功能喪失？</text><text x="390" y="175" class="b">停止挑釁，依急迫度影像／手外科</text><rect x="90" y="255" width="315" height="215" rx="14" class="x"/><text x="170" y="297" class="h">尺背側彈跳</text><text x="125" y="345" class="b">ECU 次鞘／肌腱</text><text x="125" y="385" class="b">比較旋前、旋後與對側</text><text x="125" y="425" class="b">動態超音波可協助</text><rect x="445" y="255" width="315" height="215" rx="14" class="x"/><text x="530" y="297" class="h">深部握扭痛</text><text x="480" y="345" class="b">TFCC／DRUJ／尺骨撞擊</text><text x="480" y="385" class="b">特殊檢查不具單一特異性</text><text x="480" y="425" class="b">依情境 X 光與 MRI</text><rect x="800" y="255" width="315" height="215" rx="14" class="x"/><text x="885" y="297" class="h">麻刺或無力</text><text x="835" y="345" class="b">Guyon 管與近端尺神經</text><text x="835" y="385" class="b">感覺、手內在肌與血流</text><text x="835" y="425" class="b">持續缺損需電生理／影像</text><rect x="175" y="545" width="850" height="95" rx="16" class="g"/><text x="345" y="585" class="h">無紅旗：調整負荷、建立可重現基線</text><text x="255" y="620" class="b">若卡彈、不穩、麻弱或功能持續惡化，重新分流</text><text x="185" y="710" class="b">相同測試可刺激多個尺側結構；位置、機轉、功能與影像必須整合。</text></svg>
