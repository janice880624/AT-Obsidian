<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#172033}.t{font-size:26px;font-weight:700}.h{font-size:17px;font-weight:700}.b{font-size:14px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="55" y="55" class="t">PERINEAL, GROIN OR GLUTEAL PAIN — TRIAGE FIRST</text><rect x="110" y="90" width="980" height="115" rx="18" class="r"/><text x="210" y="135" class="h">RED FLAGS: retention, saddle numbness, weakness, shock, tense swelling, fever</text><text x="415" y="180" class="b">STOP LOAD — URGENT REFERRAL</text><rect x="65" y="275" width="330" height="245" rx="18" class="x"/><text x="130" y="325" class="h">NEURAL / SITTING</text><text x="100" y="380" class="b">Pudendal / femoral / sciatic</text><text x="100" y="420" class="b">Criteria guide; not confirmation</text><rect x="435" y="275" width="330" height="245" rx="18" class="x"/><text x="520" y="325" class="h">BLEED / COMPARTMENT</text><text x="475" y="380" class="b">Anticoagulation / pressure / exertion</text><text x="475" y="420" class="b">No massage; do not await all signs</text><rect x="805" y="275" width="330" height="245" rx="18" class="x"/><text x="895" y="325" class="h">PERSISTENT NIGHT PAIN</text><text x="840" y="380" class="b">Bone lesion / infection / mimics</text><text x="840" y="420" class="b">Select radiograph / CT / MRI</text><rect x="180" y="610" width="840" height="85" rx="18" class="g"/><text x="255" y="662" class="h">No single test replaces imaging + specialist judgment</text></svg>
