<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="45" y="55" class="t">運動員胸壁疼痛：先排急症，再做組織與負荷評估</text><rect x="120" y="88" width="960" height="120" rx="16" class="r"/><text x="210" y="132" class="h">壓迫性運動胸痛、暈厥、呼吸困難、低血氧、咳血或重大創傷？</text><text x="390" y="174" class="b">停止運動與挑釁，啟動緊急醫療</text><rect x="75" y="255" width="320" height="220" rx="14" class="x"/><text x="145" y="298" class="h">骨性／創傷型</text><text x="105" y="344" class="b">局部骨痛、撞擊、骨健康風險</text><text x="105" y="384" class="b">影像依臨床情境選擇</text><text x="105" y="424" class="b">正常初始 X 光不一定排除</text><rect x="440" y="255" width="320" height="220" rx="14" class="x"/><text x="505" y="298" class="h">肌肉／肋軟骨型</text><text x="475" y="344" class="b">旋轉、推拉、咳嗽或觸診痛</text><text x="475" y="384" class="b">單一壓痛不能確診</text><text x="475" y="424" class="b">建立可追蹤負荷基線</text><rect x="805" y="255" width="320" height="220" rx="14" class="x"/><text x="865" y="298" class="h">滑動／神經型</text><text x="840" y="344" class="b">下肋緣喀響或帶狀灼痛</text><text x="840" y="384" class="b">Hooking 只作輔助</text><text x="840" y="424" class="b">必要時動態超音波</text><rect x="175" y="545" width="850" height="95" rx="16" class="g"/><text x="340" y="585" class="h">僅低風險者進入呼吸與旋轉負荷階梯</text><text x="270" y="620" class="b">任何症狀性質、生命徵象或功能惡化都要重新分流</text><text x="220" y="710" class="b">胸壁壓痛存在不能獨立排除心臟、肺部、血管或內臟急症。</text></svg>
