<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.box{fill:#fff;stroke:#52677f;stroke-width:3}.warn{fill:#fff1f2;stroke:#be123c;stroke-width:4}.go{fill:#ecfdf5;stroke:#047857;stroke-width:3}.a{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><text x="45" y="55" class="t">Lisfranc／中足創傷：安全分流</text><rect x="320" y="90" width="560" height="100" rx="14" class="box"/><text x="380" y="132" class="h">足固定旋轉、壓砸或蹠屈軸向負荷</text><text x="420" y="167" class="b">檢查足底瘀青、排列與神經血管</text><path d="M600 190v55" class="a"/><rect x="270" y="245" width="660" height="120" rx="14" class="warn"/><text x="350" y="290" class="h">足底瘀青／中足壓痛／無法負重／變形</text><text x="390" y="330" class="b">保護、避免負重、儘速影像與醫療評估</text><path d="M600 365v55" class="a"/><rect x="300" y="420" width="600" height="115" rx="14" class="box"/><text x="370" y="462" class="h">先做足部三方向 X 光</text><text x="325" y="500" class="b">疑 Lisfranc 時：安全可行則考慮負重影像</text><path d="M600 535v55" class="a"/><rect x="285" y="590" width="630" height="105" rx="14" class="go"/><text x="360" y="632" class="h">X 光正常但臨床仍高度懷疑</text><text x="355" y="670" class="b">由醫療端評估 CT／MRI；提供複評安全網</text><text x="45" y="735" class="b">不以能走、單一測試或初次陰性 X 光排除不穩定中足傷。</text></svg>
