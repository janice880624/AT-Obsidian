<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.a{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}.ln{stroke:#52677f;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52677f"/></marker></defs><text x="40" y="55" class="t">兒童急性伸膝失能：髕骨套袖骨折安全分流</text><rect x="120" y="100" width="960" height="120" rx="16" class="r"/><text x="260" y="145" class="h">跳躍／跌倒後髕骨下極痛腫＋伸膝落差或無法負重？</text><text x="320" y="185" class="b">有：停止測試，固定、重查神經血管、同日轉介</text><line x1="600" y1="220" x2="600" y2="285" class="ln"/><rect x="95" y="300" width="310" height="210" rx="14" class="a"/><text x="175" y="345" class="h">不要被 X 光安撫</text><text x="125" y="390" class="b">小骨片或陰性影像</text><text x="125" y="430" class="b">仍可能有大片軟骨套袖</text><text x="125" y="470" class="b">必要時超音波／MRI</text><rect x="445" y="300" width="310" height="210" rx="14" class="a"/><text x="530" y="345" class="h">同步看四件事</text><text x="475" y="390" class="b">積液與髕骨高度</text><text x="475" y="430" class="b">直腿抬高／伸膝落差</text><text x="475" y="470" class="b">負重與神經血管</text><rect x="795" y="300" width="310" height="210" rx="14" class="g"/><text x="855" y="345" class="h">若為漸進負荷痛</text><text x="825" y="390" class="b">再鑑別 SLJ、髕腱</text><text x="825" y="430" class="b">髕股與 OCD</text><text x="825" y="470" class="b">仍需限期複評</text><rect x="190" y="590" width="820" height="90" rx="14" class="r"/><text x="295" y="645" class="h">現場不復位、不反覆直腿抬高、不以能部分伸膝排除</text><text x="350" y="730" class="b">本圖用於教育分流，不取代急診、影像與兒童骨科判斷。</text></svg>
