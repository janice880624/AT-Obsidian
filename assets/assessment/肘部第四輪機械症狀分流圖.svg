<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="45" y="55" class="t">肘部鎖住、卡住與活動受限：先排除急症</text><rect x="140" y="90" width="920" height="120" rx="16" class="r"/><text x="245" y="132" class="h">畸形、發燒紅熱、手冷脈弱、進行性麻弱或真正鎖住？</text><text x="400" y="178" class="b">停止挑釁並依急迫度影像／轉介</text><rect x="120" y="260" width="430" height="210" rx="14" class="x"/><text x="245" y="302" class="h">描述症狀行為</text><text x="160" y="347" class="b">角度、任務、可否自行解鎖</text><text x="160" y="385" class="b">創傷、脫臼、手術、固定與投擲</text><text x="160" y="423" class="b">疼痛、腫脹、不穩與神經症狀</text><rect x="650" y="260" width="430" height="210" rx="14" class="x"/><text x="770" y="302" class="h">固定方法檢查</text><text x="690" y="347" class="b">屈伸、旋轉、終末感</text><text x="690" y="385" class="b">神經血管與骨性壓痛</text><text x="690" y="423" class="b">安全後才做不穩與功能負荷</text><rect x="190" y="535" width="820" height="100" rx="16" class="g"/><text x="350" y="578" class="h">無紅旗：調整負荷、建立活動弧與功能基線</text><text x="275" y="613" class="b">復發鎖住、神經惡化或無進展即重新分流</text><text x="165" y="710" class="b">無痛喀響不必然是病灶；真正鎖住也不能只靠特殊檢查判定。</text></svg>
