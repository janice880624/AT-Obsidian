<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="70" y="58" class="t">持續性非典型肘痛：先排紅旗，再定位</text><rect x="125" y="95" width="950" height="125" rx="20" class="r"/><text x="245" y="143" class="h">快速腫脹／發燒／急性出血／進展麻弱／手冷色變？</text><text x="380" y="185" class="b">立即聯絡適當專科或急診，不做負荷挑釁</text><rect x="80" y="290" width="310" height="245" rx="18" class="x"/><text x="135" y="335" class="h">夜間痛＋僵硬</text><text x="125" y="390" class="b">類骨骨瘤／感染</text><text x="125" y="430" class="b">薄層 CT 可能關鍵</text><rect x="445" y="290" width="310" height="245" rx="18" class="x"/><text x="490" y="335" class="h">腫塊＋積液卡住</text><text x="485" y="390" class="b">TGCT／滑膜病灶</text><text x="485" y="430" class="b">MRI＋專科／病理</text><rect x="810" y="290" width="310" height="245" rx="18" class="x"/><text x="875" y="335" class="h">反覆關節出血</text><text x="855" y="390" class="b">依血友病計畫止血</text><text x="855" y="430" class="b">感染仍須排除</text><rect x="175" y="610" width="850" height="85" rx="18" class="g"/><text x="285" y="662" class="h">單一夜痛、積液、MRI 或誘發測試都不能單獨確診</text></svg>
