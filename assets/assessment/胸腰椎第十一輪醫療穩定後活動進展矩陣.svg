<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#fff"/><style>text{font-family:sans-serif;fill:#172033}.h{font-size:36px;font-weight:700}.t{font-size:22px}.s{font-size:18px}.b{fill:#eef4ff;stroke:#2356a8;stroke-width:3}.g{fill:#eff9f0;stroke:#2f7d45;stroke-width:3}</style><text x="60" y="60" class="h">醫療穩定後活動進展矩陣</text><rect x="70" y="120" rx="18" width="250" height="360" class="b"/><text x="100" y="170" class="t">第 1 階段</text><text x="100" y="215" class="s">呼吸與床上轉位</text><text x="100" y="250" class="s">短時多次坐起</text><text x="100" y="285" class="s">監測神經與全身狀態</text><rect x="345" y="120" rx="18" width="250" height="360" class="b"/><text x="375" y="170" class="t">第 2 階段</text><text x="375" y="215" class="s">坐站與重心轉移</text><text x="375" y="250" class="s">短程步行</text><text x="375" y="285" class="s">固定條件重測</text><rect x="620" y="120" rx="18" width="250" height="360" class="g"/><text x="650" y="170" class="t">第 3 階段</text><text x="650" y="215" class="s">延長步行／降低扶助</text><text x="650" y="250" class="s">低負荷軀幹耐力</text><text x="650" y="285" class="s">24 小時反應穩定</text><rect x="895" y="120" rx="18" width="250" height="360" class="g"/><text x="925" y="170" class="t">第 4 階段</text><text x="925" y="215" class="s">方向變換與外載</text><text x="925" y="250" class="s">工作／運動專項</text><text x="925" y="285" class="s">每次只增加一變項</text><path d="M320 300h25M595 300h25M870 300h25" stroke="#172033" stroke-width="6"/><text x="70" y="550" class="t">退階／停止：發燒或全身惡化、新神經症狀、劇痛、暈厥胸痛、24 小時持續反彈。</text><text x="70" y="630" class="s">原創分期圖｜CC BY 4.0｜只適用於醫療、骨性與神經狀態已確認穩定者</text></svg>
