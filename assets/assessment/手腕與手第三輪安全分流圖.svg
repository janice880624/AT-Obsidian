<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.box{fill:#fff;stroke:#52677f;stroke-width:3}.warn{fill:#fff1f2;stroke:#be123c;stroke-width:4}.go{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="45" y="55" class="t">手腕與手：先安全，再定位組織與負荷</text><rect x="180" y="90" width="840" height="105" rx="14" class="warn"/><text x="265" y="132" class="h">變形／開放傷／缺血／感染／急性肌腱功能喪失？</text><text x="352" y="170" class="b">是：移除戒指、保護、急迫轉介</text><rect x="180" y="230" width="840" height="100" rx="14" class="box"/><text x="300" y="270" class="h">機轉＋時間軸＋症狀圖＋神經血管與肌腱功能</text><text x="355" y="305" class="b">急性骨性壓痛即使初始 X 光陰性仍需追蹤</text><rect x="55" y="375" width="255" height="155" rx="14" class="box"/><text x="95" y="417" class="h">橈側／中央</text><text x="78" y="457" class="b">舟月、舟骨、EPL</text><text x="78" y="492" class="b">第一腱室、橈神經淺支</text><rect x="335" y="375" width="255" height="155" rx="14" class="box"/><text x="390" y="417" class="h">尺側</text><text x="365" y="457" class="b">DRUJ、TFCC、ECU</text><text x="365" y="492" class="b">鉤骨鉤、尺神經</text><rect x="615" y="375" width="255" height="155" rx="14" class="box"/><text x="670" y="417" class="h">手指</text><text x="645" y="457" class="b">滑車、屈伸肌腱</text><text x="645" y="492" class="b">骨折、關節與韌帶</text><rect x="895" y="375" width="255" height="155" rx="14" class="box"/><text x="940" y="417" class="h">功能</text><text x="925" y="457" class="b">握捏、承重、精細</text><text x="925" y="492" class="b">當下與隔日反應</text><rect x="185" y="575" width="830" height="85" rx="14" class="go"/><text x="300" y="612" class="h">整合前測機率、方向性測試、影像與追蹤</text><text x="345" y="645" class="b">單一特殊檢查不作確診或回場通關</text><text x="65" y="720" class="b">本圖不取代急救、影像、手外科決策或機構 SOP。</text></svg>
