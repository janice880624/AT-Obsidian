<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.o{fill:#fff7ed;stroke:#c2410c;stroke-width:4}.p{fill:#f5f3ff;stroke:#7c3aed;stroke-width:4}.g{fill:#ecfdf5;stroke:#047857;stroke-width:4}</style><text x="55" y="55" class="t">Swollen or Rapidly Destructive Shoulder: Safety Triage</text><rect x="100" y="95" width="1000" height="100" rx="18" class="r"/><text x="280" y="140" class="h">Sepsis, acute neurovascular change, threatened skin?</text><text x="430" y="175" class="b">Stop loading and activate urgent care.</text><rect x="55" y="260" width="335" height="300" rx="18" class="o"/><text x="145" y="310" class="h">INFECTION</text><text x="90" y="370" class="b">Fever / procedure / immune risk</text><text x="90" y="415" class="b">Culture before antibiotics if stable</text><text x="90" y="460" class="b">Crystals do not exclude infection</text><rect x="430" y="260" width="335" height="300" rx="18" class="p"/><text x="510" y="310" class="h">SYNOVIAL / CRYSTAL</text><text x="465" y="370" class="b">Locking / recurrent effusion</text><text x="465" y="415" class="b">Imaging + pathology / crystals</text><text x="465" y="460" class="b">Single test is insufficient</text><rect x="805" y="260" width="335" height="300" rx="18" class="g"/><text x="880" y="310" class="h">NEUROPATHIC</text><text x="840" y="370" class="b">Low pain + major destruction</text><text x="840" y="415" class="b">Pain-temperature loss</text><text x="840" y="460" class="b">Shoulder + spinal evaluation</text><text x="180" y="665" class="h">Use serial findings, aspiration, imaging and specialist review together.</text></svg>
