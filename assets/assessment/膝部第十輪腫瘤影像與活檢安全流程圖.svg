<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#fff"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#172033}.t{font-size:27px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:15px}.x{fill:#eff6ff;stroke:#1d4ed8;stroke-width:3}.r{fill:#fff1f2;stroke:#be123c;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="70" y="55" class="t">SAFE WORKFLOW FOR SUSPECTED BONE / SOFT-TISSUE TUMOUR</text><rect x="90" y="100" width="1020" height="110" rx="18" class="r"/><text x="155" y="150" class="h">PERSISTENT BONE PAIN, GROWING MASS, NIGHT PAIN OR NEUROVASCULAR CHANGE</text><text x="390" y="185" class="b">STOP IMPACT AND UNPLANNED PROCEDURES</text><rect x="90" y="285" width="300" height="210" rx="18" class="x"/><text x="175" y="340" class="h">BONE LESION</text><text x="115" y="390" class="b">Two-view radiograph, then MRI / CT</text><text x="105" y="430" class="b">Normal X-ray does not fully exclude</text><rect x="450" y="285" width="300" height="210" rx="18" class="x"/><text x="505" y="340" class="h">SOFT-TISSUE MASS</text><text x="475" y="390" class="b">US / X-ray, then MRI as indicated</text><text x="500" y="430" class="b">MRI does not replace pathology</text><rect x="810" y="285" width="300" height="210" rx="18" class="g"/><text x="865" y="340" class="h">SPECIALIST CENTRE</text><text x="840" y="390" class="b">Plan biopsy tract and MDT decisions</text><text x="845" y="430" class="b">Protect future surgical field</text><rect x="230" y="590" width="740" height="90" rx="18" class="g"/><text x="280" y="645" class="h">NO SINGLE TEST OR IMAGE DETERMINES BENIGN VS MALIGNANT</text></svg>
