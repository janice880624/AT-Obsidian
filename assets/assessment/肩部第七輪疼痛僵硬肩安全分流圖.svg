<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="45" y="55" class="t">疼痛僵硬肩：安全分流先於特殊檢查</text><rect x="105" y="95" width="990" height="125" rx="18" class="r"/><text x="210" y="140" class="h">發燒／紅熱、生命徵象異常、快速惡化、近期注射或菌血症</text><text x="390" y="185" class="b">停止負荷測試，同日急診／骨科評估</text><rect x="65" y="285" width="320" height="225" rx="15" class="x"/><text x="125" y="330" class="h">主被動都劇痛</text><text x="105" y="380" class="b">感染、骨折、結晶或急性關節</text><text x="105" y="420" class="b">最低必要檢查＋轉介</text><rect x="440" y="285" width="320" height="225" rx="15" class="x"/><text x="505" y="330" class="h">全域被動受限</text><text x="480" y="380" class="b">盂肱 OA、黏連性囊炎</text><text x="480" y="420" class="b">症狀＋X 光／病程整合</text><rect x="815" y="285" width="320" height="225" rx="15" class="x"/><text x="870" y="330" class="h">主動較被動差</text><text x="855" y="380" class="b">肌腱、神經、疼痛抑制</text><text x="855" y="420" class="b">力量與神經學檢查</text><rect x="185" y="585" width="830" height="95" rx="16" class="g"/><text x="300" y="625" class="h">單一特殊檢查不能排除感染，也不能確診痛源</text><text x="355" y="660" class="b">記錄生命徵象、風險因子與轉介時間</text></svg>
