<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="55" y="55" class="t">胸腰背痛合併進展神經變化：安全分流</text><rect x="120" y="95" width="960" height="110" rx="18" class="r"/><text x="205" y="140" class="h">新發／進展無力、感覺平面、尿滯留、無法行走或病理性骨折疑慮？</text><text x="400" y="180" class="b">停止負荷、記錄最後正常時間、急迫轉介</text><rect x="75" y="285" width="310" height="230" rx="18" class="x"/><text x="125" y="330" class="h">髓外／神經根</text><text x="105" y="380" class="b">根性痛、節段缺損、脊髓壓迫</text><text x="105" y="425" class="b">MRI 與專科辨別腫瘤類型</text><rect x="445" y="285" width="310" height="230" rx="18" class="x"/><text x="535" y="330" class="h">髓內</text><text x="475" y="380" class="b">感覺平面、長傳導徑、步態</text><text x="475" y="425" class="b">床邊檢查只定位與分流</text><rect x="815" y="285" width="310" height="230" rx="18" class="x"/><text x="890" y="330" class="h">椎體／硬膜外</text><text x="845" y="380" class="b">骨性風險、硬膜外延伸、神經</text><text x="845" y="425" class="b">偶發血管瘤不等於痛源</text><rect x="180" y="600" width="840" height="85" rx="18" class="g"/><text x="265" y="652" class="h">神經穩定後才測功能；MRI、病理與專科確認病因</text></svg>
