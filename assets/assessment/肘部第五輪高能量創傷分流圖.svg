<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="45" y="55" class="t">肘—前臂高能量創傷：不要只看最痛的一點</text><rect x="140" y="90" width="920" height="115" rx="16" class="r"/><text x="250" y="132" class="h">開放傷、變形、手冷脈弱、進行性麻弱或腔室警訊？</text><text x="390" y="172" class="b">立即固定、重查神經血管並急診轉介</text><rect x="100" y="255" width="450" height="220" rx="14" class="x"/><text x="205" y="298" class="h">橈骨頭骨折線索</text><text x="140" y="345" class="b">＋前臂或尺側腕痛／DRUJ 異常</text><text x="140" y="385" class="b">→ 考慮 Essex-Lopresti</text><text x="140" y="430" class="b">影像涵蓋肘、前臂與必要腕部</text><rect x="650" y="255" width="450" height="220" rx="14" class="x"/><text x="770" y="298" class="h">尺骨骨折線索</text><text x="690" y="345" class="b">＋橈骨頭對位或旋轉異常</text><text x="690" y="385" class="b">→ 考慮 Monteggia</text><text x="690" y="430" class="b">核對 radiocapitellar line</text><rect x="200" y="545" width="800" height="100" rx="16" class="g"/><text x="365" y="585" class="h">固定前後重查神經血管</text><text x="300" y="620" class="b">急性高能量傷不做疼痛性軸向或不穩挑釁</text><text x="170" y="710" class="b">正常單點影像或能動肘，不能獨立排除複合前臂傷。</text></svg>
