<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="40" y="55" class="t">運動誘發小腿痛：先排除缺血，再鑑別腔室、骨與神經</text><rect x="120" y="95" width="960" height="120" rx="16" class="r"/><text x="245" y="140" class="h">靜息痛、冰冷／蒼白、持續無脈或快速神經惡化？</text><text x="475" y="180" class="b">停止測試並急診轉介</text><rect x="70" y="290" width="320" height="225" rx="16" class="x"/><text x="130" y="335" class="h">症狀時間特徵</text><text x="105" y="380" class="b">強度閾值、緩解時間、雙側性</text><text x="105" y="425" class="b">冰冷、麻木、無力、皮膚變化</text><rect x="440" y="290" width="320" height="225" rx="16" class="x"/><text x="510" y="335" class="h">靜態＋動態血流</text><text x="475" y="380" class="b">脈搏、毛細回填、運動前後 ABI</text><text x="475" y="425" class="b">動態都卜勒與 CTA／MRA</text><rect x="810" y="290" width="320" height="225" rx="16" class="g"/><text x="865" y="335" class="h">並行鑑別</text><text x="845" y="380" class="b">慢性運動性腔室症候群</text><text x="845" y="425" class="b">脛骨壓力傷、神經與腰椎來源</text><rect x="180" y="590" width="840" height="85" rx="16" class="r"/><text x="260" y="642" class="h">正常靜態脈搏不排除功能型；姿勢性無脈也不能單獨確診</text></svg>
