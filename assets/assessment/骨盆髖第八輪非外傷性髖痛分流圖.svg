<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.o{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="55" y="55" class="t">非外傷性髖痛：骨、感染、腫瘤與 OA 安全分流</text><rect x="130" y="95" width="940" height="110" rx="18" class="r"/><text x="260" y="140" class="h">無法負重、發燒病容、快速惡化或新神經血管異常？</text><text x="455" y="180" class="b">停止測試，急迫轉介</text><rect x="80" y="280" width="500" height="245" rx="18" class="o"/><text x="170" y="330" class="h">新發深部負重痛＋骨健康風險</text><text x="135" y="390" class="b">軟骨下不全骨折／BMES／骨壞死</text><text x="135" y="440" class="b">X 光陰性仍持續時考慮 MRI</text><rect x="630" y="280" width="490" height="245" rx="18" class="g"/><text x="730" y="330" class="h">漸進僵硬或反覆積液</text><text x="685" y="390" class="b">OA、滑膜腫瘤、感染或關節內病灶</text><text x="685" y="440" class="b">以病程、全身徵象與影像整合</text><rect x="190" y="610" width="820" height="80" rx="18" class="g"/><text x="300" y="660" class="h">單一疼痛位置或特殊檢查不能確診</text></svg>
