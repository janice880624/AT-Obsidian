<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:29px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="45" y="52" class="t">足踝第六輪：漏診骨折、骨骺與前足病變分流</text><rect x="100" y="90" width="1000" height="115" rx="16" class="r"/><text x="240" y="132" class="h">不能負重、變形、快速腫脹、紅熱發燒或神經血管異常？</text><text x="335" y="172" class="b">有：保護、停止測試並依急迫性轉介</text><rect x="65" y="270" width="330" height="220" rx="14" class="x"/><text x="125" y="315" class="h">外踝前下深痛</text><text x="95" y="360" class="b">背屈外翻／雪板／軸向負荷</text><text x="95" y="402" class="b">想距骨外側突與距下骨折</text><text x="95" y="444" class="b">X 光不足仍高疑 → CT／MRI</text><rect x="435" y="270" width="330" height="220" rx="14" class="x"/><text x="505" y="315" class="h">青少年外側足痛</text><text x="465" y="360" class="b">漸進負荷：骨骺炎工作假設</text><text x="465" y="402" class="b">急性腫脹：先排骨折</text><text x="465" y="444" class="b">骨骺方向與年齡須整合</text><rect x="805" y="270" width="330" height="220" rx="14" class="x"/><text x="890" y="315" class="h">蹠骨頭痛</text><text x="835" y="360" class="b">Freiberg、壓力傷、蹠板</text><text x="835" y="402" class="b">先 X 光；陰性不等於排除</text><text x="835" y="444" class="b">依骨／關節假設選 MRI／CT</text><rect x="180" y="570" width="840" height="95" rx="16" class="g"/><text x="320" y="610" class="h">低風險才做負荷基線；保護疑似組織並設定限期複評</text><text x="350" y="648" class="b">單一壓痛、特殊檢查或影像所見皆不能確診。</text><text x="375" y="720" class="b">症狀惡化或不符預期 → 回到安全分流。</text></svg>
