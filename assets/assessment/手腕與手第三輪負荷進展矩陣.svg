<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.box{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="45" y="55" class="t">手腕與手負荷進展：從組織安全到真實任務</text><g transform="translate(45 130)"><rect width="230" height="150" rx="14" fill="#fff1f2" stroke="#be123c" stroke-width="3"/><text x="38" y="42" class="h">1 組織安全</text><text x="25" y="80" class="b">紅旗已排除</text><text x="25" y="112" class="b">保護限制已確認</text><rect x="285" width="230" height="150" rx="14" class="box"/><text x="323" y="42" class="h">2 基礎功能</text><text x="310" y="80" class="b">活動度、等長</text><text x="310" y="112" class="b">神經與肌腱功能</text><rect x="570" width="230" height="150" rx="14" class="box"/><text x="608" y="42" class="h">3 容量建立</text><text x="595" y="80" class="b">握捏、旋轉、精細</text><text x="595" y="112" class="b">漸進承重／crimp</text><rect x="855" width="230" height="150" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="3"/><text x="895" y="42" class="h">4 真實任務</text><text x="880" y="80" class="b">速度、疲勞、反應</text><text x="880" y="112" class="b">球拍／攀岩／接觸</text></g><g transform="translate(165 385)"><rect width="870" height="190" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="310" y="42" class="h">每階段共同判準</text><text x="55" y="83" class="b">① 當下疼痛、麻刺、腫脹與動作品質維持可接受</text><text x="55" y="123" class="b">② 24 小時內回到基線，沒有新的卡鎖或神經症狀</text><text x="55" y="163" class="b">③ 指標與個人基線、任務需求及醫療限制一起判讀</text></g><rect x="110" y="625" width="980" height="50" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="198" y="657" class="b">時間與單一測試都不是通關證明；每次進階後保留可回退層級。</text></svg>
