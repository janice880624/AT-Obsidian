<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="45" y="55" class="t">神經性跛行：站走容量與全身負荷進展</text><g transform="translate(55 115)"><rect width="250" height="175" rx="15" class="x"/><text x="45" y="42" class="h">1 安全與基線</text><text x="25" y="88" class="b">神經血管與馬尾已篩檢</text><text x="25" y="125" class="b">首次症狀與停止距離</text><text x="25" y="158" class="b">坐下後恢復時間</text><rect x="275" width="250" height="175" rx="15" class="x"/><text x="330" y="42" class="h">2 累積總量</text><text x="300" y="88" class="b">短步行／單車間歇</text><text x="300" y="125" class="b">坐站、髖腿與軀幹力量</text><text x="300" y="158" class="b">隔日回基線</text><rect x="550" width="250" height="175" rx="15" class="x"/><text x="600" y="42" class="h">3 連續容量</text><text x="575" y="88" class="b">延長連續距離與站立</text><text x="575" y="125" class="b">加入坡度、速度或輕負重</text><text x="575" y="158" class="b">一次只改一個變項</text><rect x="825" width="250" height="175" rx="15" class="x"/><text x="875" y="42" class="h">4 生活與專項</text><text x="850" y="88" class="b">通勤、工作與採買</text><text x="850" y="125" class="b">跑步、單車或球場需求</text><text x="850" y="158" class="b">連續訓練與恢復策略</text></g><rect x="150" y="400" width="900" height="170" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="455" y="442" class="h">共同通關條件</text><text x="190" y="490" class="b">神經血管穩定｜步態可控｜休息後症狀回落｜隔日不持續惡化</text><text x="190" y="530" class="b">量化站走容量，但不把固定距離當成所有人的回場門檻</text><rect x="165" y="625" width="870" height="50" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="215" y="657" class="b">新快速無力、足部缺血、鞍區或括約肌改變：停止測試並立即分流。</text></svg>
