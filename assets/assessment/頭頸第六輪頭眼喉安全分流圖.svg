<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:29px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="40" y="52" class="t">頭／眼／喉創傷：先處理生命與視力威脅</text><rect x="80" y="90" width="1040" height="115" rx="16" class="r"/><text x="195" y="135" class="h">ABC 不穩、GCS 下降、瞳孔／局灶缺損、視力下降或喘鳴？</text><text x="305" y="177" class="b">有：EMS、頸椎保護、連續監測；不延誤急診與專科</text><rect x="70" y="275" width="320" height="230" rx="14" class="x"/><text x="155" y="320" class="h">頭部</text><text x="105" y="365" class="b">GCS 分項與趨勢</text><text x="105" y="405" class="b">瞳孔、四肢、生命徵象</text><text x="105" y="445" class="b">顱底／開放傷徵象</text><rect x="440" y="275" width="320" height="230" rx="14" class="x"/><text x="540" y="320" class="h">眼部</text><text x="475" y="365" class="b">先測每眼視力</text><text x="475" y="405" class="b">疑破裂：眼盾、不壓眼</text><text x="475" y="445" class="b">RAPD 只支持傳入缺損</text><rect x="810" y="275" width="320" height="230" rx="14" class="x"/><text x="910" y="320" class="h">喉部</text><text x="845" y="365" class="b">聲音、呼吸、吞嚥、咳血</text><text x="845" y="405" class="b">不深壓、不飲水測試</text><text x="845" y="445" class="b">正常早期外觀不排除水腫</text><rect x="170" y="570" width="860" height="90" rx="16" class="g"/><text x="315" y="610" class="h">任何高風險工作假設：移除運動、限期再評、清楚交班</text><text x="290" y="645" class="b">單一陰性測試、短暫改善或仍能說話都不能作為回場證明。</text><text x="420" y="720" class="b">教育流程圖，不取代所在地急救規範。</text></svg>
