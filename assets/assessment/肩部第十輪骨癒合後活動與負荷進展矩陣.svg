<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:Noto Sans CJK TC,sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.a{fill:#dbeafe;stroke:#2563eb;stroke-width:4}.g{fill:#dcfce7;stroke:#16a34a;stroke-width:4}.o{fill:#ffedd5;stroke:#ea580c;stroke-width:4}</style><text x="55" y="55" class="t">骨科與影像確認可活動後：肩胛帶恢復順序</text><rect x="70" y="120" width="320" height="410" rx="20" class="a"/><text x="145" y="175" class="h">保護與活動</text><text x="110" y="245" class="b">遠端活動與呼吸</text><text x="110" y="295" class="b">被動／主動輔助</text><text x="110" y="345" class="b">序列影像與神經血管</text><rect x="440" y="120" width="320" height="410" rx="20" class="g"/><text x="515" y="175" class="h">控制與力量</text><text x="480" y="245" class="b">主動活動與等長</text><text x="480" y="295" class="b">旋轉肌袖／肩胛負荷</text><text x="480" y="345" class="b">SPADI＋客觀功能趨勢</text><rect x="810" y="120" width="320" height="410" rx="20" class="o"/><text x="885" y="175" class="h">負重與專項</text><text x="850" y="245" class="b">閉鏈、提舉與速度</text><text x="850" y="295" class="b">過頭與接觸暴露</text><text x="850" y="345" class="b">跌倒風險需專科許可</text><text x="155" y="635" class="h">骨性痛、肩帶變形、胸痛呼吸或神經血管變化：停止並重新評估</text></svg>
