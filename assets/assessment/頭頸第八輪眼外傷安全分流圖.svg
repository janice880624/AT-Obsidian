<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:29px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:15px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="40" y="55" class="t">閉合性眼外傷：先排除立即威脅視力的情況</text><rect x="90" y="90" width="1020" height="120" rx="16" class="r"/><text x="185" y="135" class="h">視力下降、瞳孔異常、眼球突出緊繃、前房血液、高速穿透或閃光幕簾？</text><text x="300" y="180" class="b">有：停止測試、硬式眼罩保護、立即 EMS／急診與眼科</text><rect x="70" y="280" width="320" height="230" rx="14" class="x"/><text x="130" y="325" class="h">眼表／角膜線索</text><text x="105" y="370" class="b">異物感、流淚、畏光</text><text x="105" y="410" class="b">排除破裂後才考慮染色</text><text x="105" y="450" class="b">高速異物不可場邊拔除</text><rect x="440" y="280" width="320" height="230" rx="14" class="x"/><text x="500" y="325" class="h">眼眶／前房線索</text><text x="475" y="370" class="b">突出、緊繃、複視、積血</text><text x="475" y="410" class="b">不要按壓眼球</text><text x="475" y="450" class="b">高疑腔室症候群不等影像</text><rect x="810" y="280" width="320" height="230" rx="14" class="x"/><text x="865" y="325" class="h">視網膜／後節線索</text><text x="845" y="370" class="b">閃光、飛蚊、暗點、幕簾</text><text x="845" y="410" class="b">正常外觀也可能有裂孔</text><text x="845" y="450" class="b">需要散瞳眼底／OCT</text><rect x="150" y="575" width="900" height="90" rx="16" class="g"/><text x="280" y="615" class="h">逐眼視力是基本生命徵象，但正常結果不等於眼球安全</text><text x="335" y="652" class="b">紀錄機轉、左右眼、瞳孔、運動、視野症狀與時間趨勢。</text><text x="410" y="720" class="b">教育流程圖，不取代眼科急診評估。</text></svg>
