<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.x{fill:#fff;stroke:#52677f;stroke-width:3}.a{fill:#eff6ff;stroke:#2563eb;stroke-width:3}.p{fill:#fff7ed;stroke:#ea580c;stroke-width:3}</style><text x="40" y="55" class="t">足踝第七輪負荷進展：PCFD 與踝關節骨關節炎</text><rect x="75" y="105" width="500" height="210" rx="16" class="a"/><text x="245" y="150" class="h">PCFD</text><text x="110" y="195" class="b">鞋具／矯具＋內翻、提踵與步行容量</text><text x="110" y="235" class="b">追蹤足弓、後足、皮膚與隔日反應</text><rect x="625" y="105" width="500" height="210" rx="16" class="p"/><text x="800" y="150" class="h">踝關節骨關節炎</text><text x="660" y="195" class="b">教育＋活動度、力量、平衡與有氧</text><text x="660" y="235" class="b">以功能與目標為主，不追求影像正常</text><g transform="translate(80 400)"><rect width="240" height="120" rx="14" class="x"/><text x="55" y="45" class="h">1 日常可耐受</text><text x="28" y="85" class="b">症狀與隔日回復</text><rect x="270" width="240" height="120" rx="14" class="x"/><text x="325" y="45" class="h">2 力量與控制</text><text x="300" y="85" class="b">雙腳至單腳任務</text><rect x="540" width="240" height="120" rx="14" class="x"/><text x="605" y="45" class="h">3 容量與平衡</text><text x="575" y="85" class="b">步行、階梯與 SEBT</text><rect x="810" width="240" height="120" rx="14" class="x"/><text x="865" y="45" class="h">4 運動專項</text><text x="842" y="85" class="b">速度、地面與密度</text></g><text x="245" y="620" class="b">一次主要增加一項：時間｜範圍｜阻力｜速度｜地面；追蹤 24–48 小時。</text><text x="260" y="670" class="b">快速塌陷、紅熱腫、皮膚破損或突然不能負重時停止並轉介。</text></svg>
