<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#fff"/><text x="55" y="62" font-family="sans-serif" font-size="33">胸腰椎疼痛：先分辨三條安全路徑</text><g font-family="sans-serif" font-size="21" text-anchor="middle"><rect x="325" y="105" width="550" height="105" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/><text x="600" y="150">馬尾／進展神經、雷擊性頭痛、深色尿少尿、</text><text x="600" y="183">發燒或無法自理？ 是 → 停止並急診</text><path d="M600 210 V300 M600 300 H185 V360 M600 300 V360 M600 300 H1015 V360" fill="none" stroke="#334155" stroke-width="5"/><rect x="45" y="360" width="280" height="220" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="185" y="405">成長期局部腰痛／腿痛</text><text x="185" y="445">停止誘發負荷</text><text x="185" y="485">MRI 看活動傷與神經</text><text x="185" y="525">CT 看骨片／裂隙</text><rect x="460" y="360" width="280" height="220" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="600" y="405">劇烈運動後板狀腰痛</text><text x="600" y="445">查 CK、腎功能、尿液</text><text x="600" y="485">補液監測</text><text x="600" y="525">必要室壓與外科評估</text><rect x="875" y="360" width="280" height="220" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="1015" y="405">站立頭痛、平躺改善</text><text x="1015" y="445">先排雷擊與神經急症</text><text x="1015" y="485">腦部增強 MRI</text><text x="1015" y="525">＋全脊椎 MRI</text><text x="600" y="655">特殊檢查、單次 CK 或單張影像，都不能單獨完成診斷</text></g><text x="55" y="725" font-family="sans-serif" font-size="18" fill="#475569">原創示意圖｜CC BY 4.0</text></svg>