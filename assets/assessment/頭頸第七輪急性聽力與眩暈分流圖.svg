<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:29px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="42" y="55" class="t">急性聽力改變與眩暈：先辨識時間、觸發與紅旗</text><rect x="95" y="90" width="1010" height="115" rx="16" class="r"/><text x="220" y="135" class="h">局灶神經、無法站走、新劇烈頭頸痛、新單側聽損或顱底徵象？</text><text x="300" y="178" class="b">有：停止場邊測試，立即 EMS／急診與耳鼻喉／神經評估</text><rect x="70" y="275" width="320" height="230" rx="14" class="x"/><text x="130" y="320" class="h">短暫、位置觸發</text><text x="105" y="365" class="b">頸椎安全後看典型眼震</text><text x="105" y="405" class="b">Dix-Hallpike／滾轉</text><text x="105" y="445" class="b">陰性不排除 BPPV</text><rect x="440" y="275" width="320" height="230" rx="14" class="x"/><text x="510" y="320" class="h">持續急性眩暈</text><text x="475" y="365" class="b">眼震、顱神經、協調、步態</text><text x="475" y="405" class="b">HINTS 僅受訓者＋正確族群</text><text x="475" y="445" class="b">不可用單一陰性測試排除中風</text><rect x="810" y="275" width="320" height="230" rx="14" class="x"/><text x="870" y="320" class="h">突然聽力下降</text><text x="845" y="365" class="b">耳鏡＋Rinne／Weber 僅初篩</text><text x="845" y="405" class="b">儘速正式純音聽力</text><text x="845" y="445" class="b">緊急耳鼻喉評估</text><rect x="165" y="570" width="870" height="90" rx="16" class="g"/><text x="290" y="610" class="h">病因釐清前：防跌、禁駕駛／水域／碰撞，不讓個案獨處</text><text x="295" y="646" class="b">位置性、周邊性或「耳石」都不是靠主觀暈感單獨確定。</text><text x="430" y="720" class="b">教育流程圖，不取代急診或專科判斷。</text></svg>
