<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">急性手腕與手創傷分流流程</title>
  <desc id="desc">從移除戒指、紅旗、神經血管與肌腱檢查，到影像與再評估的流程。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect width="1200" height="780" fill="#f8fafc"/>
  <text x="60" y="58" font-family="sans-serif" font-size="34" font-weight="700" fill="#0f172a">急性手腕與手創傷分流</text>
  <g font-family="sans-serif" font-size="22" text-anchor="middle">
    <rect x="390" y="90" width="420" height="72" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="600" y="134">安全、整體創傷、立即移除戒指</text>
    <rect x="330" y="220" width="540" height="92" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="600" y="255">開放傷／灌流下降／皮膚受壓／進行性麻木？</text><text x="600" y="286">有 → 固定、急診／手外科；勿延誤</text>
    <rect x="90" y="390" width="430" height="108" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="305" y="428">記錄神經血管與每指屈伸功能</text><text x="305" y="460">觀察變形、旋轉、傷口與骨性壓痛</text>
    <rect x="680" y="390" width="430" height="108" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="895" y="428">疑骨折／脫位 → X 光與合適固定</text><text x="895" y="460">高度懷疑但陰性 → 重拍或進階影像</text>
    <rect x="330" y="585" width="540" height="108" rx="20" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/><text x="600" y="624">處置後重測神經血管；記錄限制與轉介</text><text x="600" y="658">沒有單一場邊測試可保證安全回場</text>
  </g>
  <g stroke="#475569" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M600 162 V215"/><path d="M520 312 L360 385"/><path d="M680 312 L840 385"/><path d="M305 498 L500 580"/><path d="M895 498 L700 580"/></g>
  <text x="60" y="748" font-family="sans-serif" font-size="18" fill="#475569">教學用原創流程圖；不取代急救、影像、專科判斷或機構 SOP。</text>
</svg>

