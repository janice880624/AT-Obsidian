<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="42" y="55" class="t">足部骨痛與青少年足跟痛：安全分流</text><rect x="100" y="90" width="1000" height="115" rx="16" class="r"/><text x="180" y="135" class="h">無法負重、足底瘀青、發燒紅熱、夜間進展痛或神經血管異常？</text><text x="330" y="175" class="b">有：停止衝擊，依急迫度立即／同日醫療轉介</text><rect x="55" y="265" width="335" height="210" rx="14" class="x"/><text x="110" y="310" class="h">舟狀骨背側骨性痛</text><text x="88" y="355" class="b">高風險骨壓力傷假設</text><text x="88" y="400" class="b">負片不能排除早期傷</text><rect x="432" y="265" width="335" height="210" rx="14" class="x"/><text x="500" y="310" class="h">成長期後足跟痛</text><text x="470" y="355" class="b">典型負荷型態可支持骨骺炎</text><text x="470" y="400" class="b">不典型表現需排除感染／骨傷</text><rect x="810" y="265" width="335" height="210" rx="14" class="x"/><text x="865" y="310" class="h">內側足舟骨突出痛</text><text x="845" y="355" class="b">副舟骨與脛後肌腱假設</text><text x="845" y="400" class="b">影像變異不等於症狀來源</text><rect x="150" y="545" width="900" height="115" rx="16" class="g"/><text x="330" y="590" class="h">低風險才建立走路、力量與低衝擊基線</text><text x="235" y="630" class="b">同步檢查訓練負荷、恢復、能量可用性、月經／內分泌與既往骨傷</text><text x="235" y="720" class="b">不要以可單腳跳、短暫止痛或早期正常 X 光宣告安全。</text></svg>
