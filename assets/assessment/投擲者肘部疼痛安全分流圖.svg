<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:18px}.box{fill:#fff;stroke:#52677f;stroke-width:3}.warn{fill:#fff1f2;stroke:#be123c;stroke-width:4}.go{fill:#ecfdf5;stroke:#047857;stroke-width:3}.a{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><text x="45" y="55" class="t">投擲者肘痛：安全分流與年齡優先順序</text><rect x="220" y="90" width="760" height="105" rx="14" class="warn"/><text x="315" y="132" class="h">變形／缺血／急性撕脫／進行性神經缺損？</text><text x="365" y="170" class="b">是：停止投擲，保護並依急迫性轉介</text><path d="M600 195v48" class="a"/><rect x="220" y="245" width="760" height="105" rx="14" class="box"/><text x="330" y="287" class="h">先確認骨骼成熟度、投擲量、休息與疼痛期相</text><text x="325" y="324" class="b">卡鎖／伸直缺損／麻刺與速度下降分開記錄</text><path d="M600 350v45" class="a"/><rect x="80" y="398" width="310" height="160" rx="14" class="box"/><text x="130" y="438" class="h">內側疼痛</text><text x="108" y="477" class="b">青少年：骨骺／撕脫</text><text x="108" y="512" class="b">成人：UCL／屈肌／尺神經</text><rect x="445" y="398" width="310" height="160" rx="14" class="box"/><text x="495" y="438" class="h">外側疼痛</text><text x="474" y="477" class="b">青少年：肱骨小頭 OCD</text><text x="474" y="512" class="b">橈骨頭／皺襞／神經鑑別</text><rect x="810" y="398" width="310" height="160" rx="14" class="box"/><text x="850" y="438" class="h">後內側疼痛</text><text x="842" y="477" class="b">VEOS／鷹嘴應力傷</text><text x="842" y="512" class="b">卡鎖需找游離體</text><path d="M235 558v45M600 558v45M965 558v45" class="a"/><rect x="200" y="605" width="800" height="90" rx="14" class="go"/><text x="330" y="642" class="h">病灶分流 → 負荷修正 → 動力鏈 → 階段投擲</text><text x="330" y="675" class="b">帶痛投擲或單一特殊檢查皆不能取代完整評估</text><text x="55" y="738" class="b">本圖不取代影像、骨科決策、聯盟投球規則或急救 SOP。</text></svg>
