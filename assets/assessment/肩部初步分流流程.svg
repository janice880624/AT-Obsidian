<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" font-size="36" font-family="sans-serif" fill="#17324d">肩部初步分流流程</text><g font-family="sans-serif" text-anchor="middle"><rect x="390" y="90" width="420" height="80" rx="16" fill="#dbeafe"/><text x="600" y="140" font-size="25">肩痛／肩部創傷</text><rect x="390" y="225" width="420" height="105" rx="16" fill="#fee2e2"/><text x="600" y="267" font-size="23">生命威脅、畸形、骨折／脫臼、</text><text x="600" y="300" font-size="23">神經血管、感染或心肺警訊？</text><rect x="70" y="415" width="400" height="110" rx="16" fill="#fecaca"/><text x="270" y="460" font-size="24">是：停止一般測試</text><text x="270" y="495" font-size="24">固定／急救／緊急轉介</text><rect x="730" y="415" width="400" height="110" rx="16" fill="#dcfce7"/><text x="930" y="460" font-size="24">否：系統性檢查</text><text x="930" y="495" font-size="24">活動度、力量、功能</text><rect x="730" y="625" width="400" height="110" rx="16" fill="#fef3c7"/><text x="930" y="670" font-size="24">依假設選擇少量測試</text><text x="930" y="705" font-size="24">追蹤反應或適當轉介</text></g><g stroke="#64748b" stroke-width="5" fill="none"><line x1="600" y1="170" x2="600" y2="225"/><path d="M390 278 H270 V415"/><path d="M810 278 H930 V415"/><line x1="930" y1="525" x2="930" y2="625"/></g><text x="250" y="385" font-size="22" font-family="sans-serif" fill="#991b1b">有</text><text x="930" y="385" font-size="22" font-family="sans-serif" fill="#166534">無</text><text x="600" y="790" text-anchor="middle" font-size="19" font-family="sans-serif" fill="#475569">教學流程，不取代當地緊急處置 SOP</text></svg>
