<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="45" y="55" class="t">手腕與手第五輪：感染、骨壞死與負荷病變安全分流</text><rect x="130" y="90" width="940" height="115" rx="16" class="r"/><text x="220" y="132" class="h">傷口／咬傷、快速紅腫、手冷、進行性麻弱或變形？</text><text x="380" y="172" class="b">停止挑釁，依急迫度同日急診或手外科</text><rect x="85" y="255" width="320" height="220" rx="14" class="x"/><text x="160" y="297" class="h">手指沿腱鞘痛</text><text x="120" y="345" class="b">記錄 Kanavel signs</text><text x="120" y="385" class="b">發燒缺席不排除感染</text><text x="120" y="425" class="b">合理疑慮即同日轉介</text><rect x="440" y="255" width="320" height="220" rx="14" class="x"/><text x="515" y="297" class="h">背中央腕持續痛</text><text x="475" y="345" class="b">X 光正常仍可有早期病變</text><text x="475" y="385" class="b">依 ACR 情境考慮 MRI</text><text x="475" y="425" class="b">由手外科整合分期</text><rect x="795" y="255" width="320" height="220" rx="14" class="x"/><text x="865" y="297" class="h">位置明確的負荷痛</text><text x="830" y="345" class="b">交叉區／CMC／A1 滑車</text><text x="830" y="385" class="b">先排骨傷、感染與神經</text><text x="830" y="425" class="b">建立基線與追蹤時點</text><rect x="175" y="545" width="850" height="95" rx="16" class="g"/><text x="345" y="585" class="h">低風險才進入漸進握捏與任務負荷</text><text x="270" y="620" class="b">症狀、皮膚、神經血管或功能惡化即重新分流</text><text x="165" y="710" class="b">單一特殊檢查、單次無痛或正常初始影像，都不能獨立決定診斷與回場。</text></svg>
