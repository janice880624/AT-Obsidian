<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="55" y="55" class="t">胸腰椎疼痛：重大病因先分流</text><rect x="105" y="90" width="990" height="110" rx="16" class="r"/><text x="205" y="132" class="h">突發最大痛／休克・敗血症・進行性神經缺損／膀胱腸道？</text><text x="395" y="172" class="b">停止測試，立即啟動緊急醫療</text><rect x="70" y="255" width="320" height="230" rx="15" class="x"/><text x="145" y="298" class="h">感染路徑</text><text x="105" y="345" class="b">持續背痛、發燒可能缺席</text><text x="105" y="385" class="b">菌血症、注射、免疫風險</text><text x="105" y="425" class="b">神經改變 → 緊急 MRI</text><rect x="440" y="255" width="320" height="230" rx="15" class="x"/><text x="505" y="298" class="h">腫瘤／壓迫路徑</text><text x="475" y="345" class="b">癌症史、新夜間或持續痛</text><text x="475" y="385" class="b">步態、感覺平面、反射</text><text x="475" y="425" class="b">壓迫徵象 → 急症轉介</text><rect x="810" y="255" width="320" height="230" rx="15" class="x"/><text x="875" y="298" class="h">血管／內臟路徑</text><text x="845" y="345" class="b">突發嚴重胸背或腹痛</text><text x="845" y="385" class="b">脈搏／血壓差、暈厥</text><text x="845" y="425" class="b">不得先做手法或負荷測試</text><rect x="185" y="555" width="830" height="100" rx="16" class="g"/><text x="345" y="595" class="h">只有低風險且神經、生命徵象穩定者</text><text x="330" y="633" class="b">才進入肌骨評估、分級活動與明確複評</text><text x="180" y="720" class="b">紅旗通常需組合判讀；但時間敏感徵象不應等待典型三聯徵或完整測試。</text></svg>
