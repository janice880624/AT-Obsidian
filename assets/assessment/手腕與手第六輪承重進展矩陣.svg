<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="45" y="55" class="t">體操腕部承重：角度 × 重量 × 次數 × 連續日</text><g transform="translate(55 115)"><rect width="250" height="180" rx="15" class="x"/><text x="62" y="42" class="h">1 牆面／斜面</text><text x="24" y="88" class="b">低腕伸、低體重比例</text><text x="24" y="128" class="b">建立神經肌肉控制</text><rect x="275" width="250" height="180" rx="15" class="x"/><text x="338" y="42" class="h">2 四足／平板</text><text x="300" y="88" class="b">逐增角度與接觸時間</text><text x="300" y="128" class="b">保持壓力均勻</text><rect x="550" width="250" height="180" rx="15" class="x"/><text x="610" y="42" class="h">3 動態支撐</text><text x="575" y="88" class="b">肩觸碰、低次兔跳</text><text x="575" y="128" class="b">先控制再加速度</text><rect x="825" width="250" height="180" rx="15" class="x"/><text x="875" y="42" class="h">4 專項器械</text><text x="850" y="88" class="b">倒立、翻騰、器械</text><text x="850" y="128" class="b">教練與醫療端協調</text></g><rect x="150" y="405" width="900" height="170" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="450" y="447" class="h">每階段固定記錄</text><text x="205" y="495" class="b">腕伸角度｜體重比例｜接觸次數／時間｜當下症狀｜隔日骨性壓痛</text><text x="290" y="535" class="b">一次主要增加一個變項；沒有疼痛不等於生長板已準備好</text><rect x="170" y="625" width="860" height="50" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="230" y="657" class="b">休息痛、遠端橈骨壓痛增加、腫脹或神經血管變化時停止。</text></svg>
