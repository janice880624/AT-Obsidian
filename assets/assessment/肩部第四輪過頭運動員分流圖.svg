<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="45" y="55" class="t">過頭運動員肩痛：旋轉活動度必須放回負荷脈絡</text><rect x="140" y="90" width="920" height="120" rx="16" class="r"/><text x="255" y="132" class="h">骨骺壓痛、畸形、急性無力、神經血管或全身紅旗？</text><text x="405" y="178" class="b">停止高負荷並依急迫度轉介</text><rect x="120" y="260" width="430" height="210" rx="14" class="x"/><text x="250" y="302" class="h">量測與背景</text><text x="160" y="347" class="b">內旋、外旋、總旋轉弧與症狀</text><text x="160" y="385" class="b">固定肩胛、姿勢、工具與熱身</text><text x="160" y="423" class="b">年齡、成熟度、投球量與隔日反應</text><rect x="650" y="260" width="430" height="210" rx="14" class="x"/><text x="780" y="302" class="h">臨床整合</text><text x="690" y="347" class="b">骨性適應 ≠ 病理</text><text x="690" y="385" class="b">單一內旋差 ≠ 確診或回場門檻</text><text x="690" y="423" class="b">力量、功能與負荷趨勢共同判讀</text><rect x="190" y="535" width="820" height="100" rx="16" class="g"/><text x="335" y="578" class="h">無紅旗：調整負荷、建立基線、固定方法複評</text><text x="310" y="613" class="b">功能進展要看當下與隔日反應，不只看左右差</text><text x="170" y="710" class="b">本圖不取代醫療診斷、影像或青少年骨骺傷轉介。</text></svg>
