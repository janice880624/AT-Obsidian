<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:Noto Sans CJK TC,sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.o{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="55" y="55" class="t">高位頸椎創傷：先保護，再影像與專科分流</text><rect x="115" y="95" width="970" height="120" rx="18" class="r"/><text x="250" y="140" class="h">高能量軸向／牽張＋中線痛或神經紅旗？</text><text x="355" y="184" class="b">中立穩定、ABC、立即 EMS；不做 ROM 或牽引</text><rect x="80" y="285" width="500" height="245" rx="18" class="o"/><text x="190" y="335" class="h">場邊最小安全檢查</text><text x="120" y="395" class="b">GCS、呼吸、IX–XII、四肢神經與灌流</text><text x="120" y="445" class="b">任何單一正常項目都不能清除</text><rect x="630" y="285" width="490" height="245" rx="18" class="g"/><text x="755" y="335" class="h">創傷中心評估</text><text x="680" y="395" class="b">CT 骨折與對位；MRI 韌帶／脊髓</text><text x="680" y="445" class="b">必要時 CTA；由脊椎團隊定穩定性</text><rect x="180" y="615" width="840" height="80" rx="18" class="g"/><text x="290" y="665" class="h">寰枕分離疑慮禁止牽引；小面脫臼不場邊復位</text></svg>
