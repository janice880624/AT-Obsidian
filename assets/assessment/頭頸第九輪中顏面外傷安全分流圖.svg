<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.o{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="55" y="55" class="t">中顏面高能量外傷：生命與視力優先分流</text><rect x="120" y="95" width="960" height="115" rx="18" class="r"/><text x="235" y="140" class="h">氣道、持續大出血、GCS／頸椎或逐眼視力危險？</text><text x="420" y="182" class="b">立即創傷中心轉送；不延誤生命／視力處置</text><rect x="80" y="285" width="500" height="250" rx="18" class="o"/><text x="170" y="335" class="h">眼球、眼眶與顱底</text><text x="120" y="395" class="b">視力、瞳孔、眼位／運動、CSF 漏</text><text x="120" y="445" class="b">不壓眼球、不擤鼻、不盲目鼻腔置管</text><rect x="630" y="285" width="490" height="250" rx="18" class="g"/><text x="745" y="335" class="h">骨折與功能</text><text x="680" y="395" class="b">臉形、咬合、V1–V3、牙齒與張口</text><text x="680" y="445" class="b">CT 與顎面／眼科整合；不場邊整復</text><rect x="180" y="615" width="840" height="80" rx="18" class="g"/><text x="270" y="665" class="h">單一正常外觀、觸診或咬合檢查都不能排除深部傷</text></svg>
