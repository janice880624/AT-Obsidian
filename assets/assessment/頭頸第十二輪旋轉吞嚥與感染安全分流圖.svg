<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#fff"/><text x="60" y="65" font-family="sans-serif" font-size="34">轉頭、吞嚥痛與急性上頸痛：安全分流</text><g font-family="sans-serif" font-size="22" text-anchor="middle"><rect x="390" y="105" width="420" height="80" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/><text x="600" y="155">先查意識、氣道、神經缺損、敗血、創傷</text><path d="M600 185 V235" stroke="#334155" stroke-width="5"/><rect x="390" y="235" width="420" height="85" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/><text x="600" y="275">任何紅旗 → 中立保護＋急診／中風路徑</text><path d="M600 320 V375 M600 375 H200 V420 M600 375 V420 M600 375 H1000 V420" fill="none" stroke="#334155" stroke-width="5"/><rect x="55" y="420" width="290" height="170" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="200" y="465">轉頭誘發神經症狀</text><text x="200" y="505">避免重複誘發</text><text x="200" y="540">血管影像／動態評估</text><rect x="455" y="420" width="290" height="170" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="600" y="465">咽耳痛／異物感</text><text x="600" y="505">牙科、耳鼻喉與莖突</text><text x="600" y="540">有血管症狀先急症</text><rect x="855" y="420" width="290" height="170" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="1000" y="465">急性僵頸／吞嚥痛</text><text x="1000" y="505">CT 定位鈣化與骨</text><text x="1000" y="540">MRI 查感染／脊髓</text><text x="600" y="665">單一床邊測試、正常 CRP 或止痛反應都不能取代鑑別</text></g><text x="60" y="730" font-family="sans-serif" font-size="19" fill="#475569">原創示意圖｜CC BY 4.0</text></svg>