<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#fff"/><text x="60" y="65" font-family="sans-serif" font-size="34">急性手腕與手傷：先辨識不能等待的狀況</text><g font-family="sans-serif" font-size="22" text-anchor="middle"><rect x="340" y="105" width="520" height="90" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/><text x="600" y="145">開放傷／咬傷／無脈冰冷／進展麻弱／感染？</text><text x="600" y="177">是 → 移除戒指、保護並同日急診／手外科</text><path d="M600 195 V285 M600 285 H170 V350 M600 285 V350 M600 285 H1030 V350" fill="none" stroke="#334155" stroke-width="5"/><rect x="35" y="350" width="270" height="200" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="170" y="395">拇指基底／尺側腕傷</text><text x="170" y="435">X 光＋必要 CT</text><text x="170" y="475">骨折對位與 DRUJ</text><text x="170" y="515">避免反覆挑釁</text><rect x="465" y="350" width="270" height="200" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="600" y="395">腕傷後麻木進展</text><text x="600" y="435">系列感覺與拇外展</text><text x="600" y="475">不等待 EMG</text><text x="600" y="515">急性神經減壓評估</text><rect x="895" y="350" width="270" height="200" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="1030" y="395">MCP 背側小傷口</text><text x="1030" y="435">直接問拳頭碰牙</text><text x="1030" y="475">不可盲探或縫合</text><text x="1030" y="515">清創培養抗菌處置</text><text x="600" y="640">單一特殊檢查、傷口大小或正常早期 X 光，都不能排除深部危險</text></g><text x="60" y="730" font-family="sans-serif" font-size="19" fill="#475569">原創示意圖｜CC BY 4.0</text></svg>