<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#172033}.t{font-size:25px;font-weight:700}.h{font-size:17px;font-weight:700}.a{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.b{fill:#ecfdf5;stroke:#047857;stroke-width:3}.c{fill:#fff7ed;stroke:#c2410c;stroke-width:3}</style><text x="60" y="55" class="t">AGE + DIAGNOSIS + MEDICAL CLEARANCE DEFINE LOAD PROGRESSION</text><rect x="80" y="120" width="300" height="420" rx="22" class="a"/><text x="145" y="175" class="h">CHILD NAVICULAR</text><text x="125" y="235" class="h">Protect symptoms</text><text x="125" y="290" class="h">Restore normal gait</text><text x="125" y="345" class="h">Play before sport</text><rect x="450" y="120" width="300" height="420" rx="22" class="b"/><text x="505" y="175" class="h">ADULT COLLAPSE</text><text x="495" y="235" class="h">Footwear collaboration</text><text x="495" y="290" class="h">Walking capacity</text><text x="495" y="345" class="h">No forced correction</text><rect x="820" y="120" width="300" height="420" rx="22" class="c"/><text x="855" y="175" class="h">POST-PROCEDURE</text><text x="865" y="235" class="h">Wound / bone limits</text><text x="865" y="290" class="h">Strength + balance</text><text x="865" y="345" class="h">Run / hop last</text><text x="175" y="625" class="h">Progress one variable at a time; stop for night pain, rapid swelling, systemic or neurovascular change</text></svg>
