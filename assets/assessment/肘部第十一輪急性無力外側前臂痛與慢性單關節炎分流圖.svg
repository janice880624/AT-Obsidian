<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.a{fill:#eff6ff;stroke:#2563eb;stroke-width:4}.g{fill:#ecfdf5;stroke:#047857;stroke-width:4}.o{fill:#fff7ed;stroke:#c2410c;stroke-width:4}</style><text x="55" y="55" class="t">Elbow Weakness, Lateral Forearm Pain or Monoarthritis</text><rect x="95" y="95" width="1010" height="105" rx="18" class="r"/><text x="225" y="140" class="h">Sepsis, open injury, neurovascular change or progressive motor deficit?</text><text x="410" y="178" class="b">Stop testing and activate urgent referral.</text><rect x="55" y="270" width="335" height="290" rx="18" class="a"/><text x="125" y="320" class="h">ACUTE TENDON</text><text x="90" y="375" class="b">Pop / bruising / weakness</text><text x="90" y="420" class="b">Low-load exam + imaging</text><text x="90" y="465" class="b">Early specialist pathway</text><rect x="430" y="270" width="335" height="290" rx="18" class="g"/><text x="505" y="320" class="h">RADIAL TUNNEL / PIN</text><text x="465" y="375" class="b">Pain only vs motor deficit</text><text x="465" y="420" class="b">Map finger / thumb extension</text><text x="465" y="465" class="b">EDX + imaging if indicated</text><rect x="805" y="270" width="335" height="290" rx="18" class="o"/><text x="875" y="320" class="h">CHRONIC INFECTION</text><text x="840" y="375" class="b">Weeks to months</text><text x="840" y="420" class="b">Culture / NAAT / pathology</text><text x="840" y="465" class="b">Imaging is not confirmation</text><text x="185" y="665" class="h">Combine timeline, function, motor mapping, imaging and microbiology.</text></svg>
