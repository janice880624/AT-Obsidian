<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:18px}.box{fill:#fff;stroke:#52677f;stroke-width:3}.blue{fill:#eef6ff;stroke:#1769aa;stroke-width:3}.orange{fill:#fff7ed;stroke:#c2410c;stroke-width:3}</style><text x="45" y="55" class="t">頭頸第三輪：臨床推理矩陣</text><rect x="65" y="100" width="325" height="180" rx="14" class="blue"/><text x="120" y="142" class="h">局部機械性頸痛</text><text x="95" y="180" class="b">主動＋被動＋等長阻力</text><text x="95" y="215" class="b">建立組織假設，不做確診</text><text x="95" y="250" class="b">追蹤症狀與功能反應</text><rect x="438" y="100" width="325" height="180" rx="14" class="blue"/><text x="490" y="142" class="h">上頸椎／頭痛</text><text x="468" y="180" class="b">先排除創傷、血管與不穩</text><text x="468" y="215" class="b">FRT 僅支持 C1–C2 假設</text><text x="468" y="250" class="b">Sharp-Purser 證據有限</text><rect x="810" y="100" width="325" height="180" rx="14" class="orange"/><text x="860" y="142" class="h">頸髓／多肢警訊</text><text x="840" y="180" class="b">手部笨拙＋步態＋反射</text><text x="840" y="215" class="b">Hoffmann 不單獨判讀</text><text x="840" y="250" class="b">進行性症狀快速轉介</text><rect x="160" y="365" width="390" height="155" rx="14" class="box"/><text x="245" y="408" class="h">運動員 stinger</text><text x="195" y="448" class="b">單／雙側、持續時間、客觀無力</text><text x="195" y="486" class="b">未完全恢復不得回場</text><rect x="650" y="365" width="390" height="155" rx="14" class="box"/><text x="740" y="408" class="h">運動控制與耐力</text><text x="690" y="448" class="b">CCFT＋耐力測試建立個人基準</text><text x="690" y="486" class="b">單一分數不代表安全回場</text><rect x="80" y="590" width="1040" height="60" rx="12" fill="#e8eef7"/><text x="145" y="627" class="b">排序原則：時間敏感紅旗 → 神經定位 → 機械性假設 → 功能與負荷進展。</text></svg>
