<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:18px}.box{fill:#fff;stroke:#52677f;stroke-width:3}.blue{fill:#eef6ff;stroke:#1769aa;stroke-width:3}.orange{fill:#fff7ed;stroke:#c2410c;stroke-width:3}</style><text x="45" y="55" class="t">足踝第二輪：問題導向評估矩陣</text><rect x="65" y="100" width="325" height="170" rx="14" class="blue"/><text x="110" y="142" class="h">高位踝／聯合疑慮</text><text x="95" y="180" class="b">機轉＋聯合壓痛</text><text x="95" y="213" class="b">外旋壓力（較敏感）</text><text x="95" y="246" class="b">Squeeze（較特異）</text><rect x="438" y="100" width="325" height="170" rx="14" class="blue"/><text x="490" y="142" class="h">中足／骨性疑慮</text><text x="468" y="180" class="b">足底瘀青＋骨性壓痛</text><text x="468" y="213" class="b">承重能力＋影像決策</text><text x="468" y="246" class="b">不先做跳躍或強力扭轉</text><rect x="810" y="100" width="325" height="170" rx="14" class="blue"/><text x="875" y="142" class="h">足底跟痛疑慮</text><text x="840" y="180" class="b">第一步疼痛＋局部觸診</text><text x="840" y="213" class="b">Windlass：陽性較有用</text><text x="840" y="246" class="b">陰性不能排除</text><rect x="130" y="345" width="420" height="170" rx="14" class="box"/><text x="225" y="390" class="h">功能基準（安全後）</text><text x="180" y="430" class="b">膝觸牆背屈＋單腳跟提</text><text x="180" y="468" class="b">記錄症狀、品質與隔日反應</text><rect x="650" y="345" width="420" height="170" rx="14" class="orange"/><text x="747" y="390" class="h">立即停止／轉介</text><text x="700" y="430" class="b">變形、開放傷、神經血管改變</text><text x="700" y="468" class="b">疼痛不相稱或無法安全負重</text><rect x="80" y="585" width="1040" height="58" rx="12" fill="#e8eef7"/><text x="125" y="621" class="b">每個測試只改變疾病機率；最終判讀需整合病史、檢查、影像與追蹤。</text></svg>
