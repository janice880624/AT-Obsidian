<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.o{fill:#fff7ed;stroke:#c2410c;stroke-width:4}.p{fill:#f5f3ff;stroke:#7c3aed;stroke-width:4}.g{fill:#ecfdf5;stroke:#047857;stroke-width:4}</style><text x="55" y="55" class="t">Acute Head / Neck Pain: Safety Triage</text><rect x="115" y="95" width="970" height="110" rx="18" class="r"/><text x="275" y="140" class="h">New severe pain + neurologic or systemic red flags?</text><text x="430" y="180" class="b">Stop testing. Activate emergency pathway.</text><rect x="55" y="270" width="335" height="270" rx="18" class="o"/><text x="135" y="320" class="h">VASCULAR</text><text x="90" y="375" class="b">Horner / focal deficit</text><text x="90" y="420" class="b">Diplopia / dysarthria</text><text x="90" y="465" class="b">CTA / MRA pathway</text><rect x="430" y="270" width="335" height="270" rx="18" class="p"/><text x="520" y="320" class="h">INFECTION</text><text x="465" y="375" class="b">Fever / night pain</text><text x="465" y="420" class="b">Bacteremia / immune risk</text><text x="465" y="465" class="b">Labs + urgent MRI</text><rect x="805" y="270" width="335" height="270" rx="18" class="g"/><text x="890" y="320" class="h">HEMORRHAGE</text><text x="840" y="375" class="b">Sudden pain then weakness</text><text x="840" y="420" class="b">Anticoagulation risk</text><text x="840" y="465" class="b">Stroke + spine pathway</text><text x="175" y="665" class="h">A normal single test does not clear dissection, abscess, or hematoma.</text></svg>
