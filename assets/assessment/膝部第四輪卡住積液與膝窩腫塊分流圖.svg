<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="42" y="55" class="t">膝部卡住、積液與膝窩腫塊：安全分流</text><rect x="100" y="90" width="1000" height="115" rx="16" class="r"/><text x="175" y="135" class="h">呼吸胸痛、暈厥、足冷脈弱、發燒紅熱、真性鎖住或高能量創傷？</text><text x="350" y="175" class="b">有：停止挑釁，依急迫度立即／同日醫療轉介</text><rect x="55" y="265" width="335" height="200" rx="14" class="x"/><text x="120" y="310" class="h">快速關節內腫脹</text><text x="88" y="355" class="b">積血、ACL／骨軟骨／骨折假設</text><text x="88" y="398" class="b">查神經血管、負重與伸直</text><rect x="432" y="265" width="335" height="200" rx="14" class="x"/><text x="500" y="310" class="h">卡住或伸直缺損</text><text x="468" y="355" class="b">半月板、骨片、游離體假設</text><text x="468" y="398" class="b">不要反覆強迫解鎖</text><rect x="810" y="265" width="335" height="200" rx="14" class="x"/><text x="880" y="310" class="h">膝窩／小腿腫痛</text><text x="845" y="355" class="b">DVT、囊腫破裂、血管或感染</text><text x="845" y="398" class="b">疑血栓不按摩、不做 Homan</text><rect x="160" y="545" width="880" height="110" rx="16" class="g"/><text x="355" y="590" class="h">低風險才建立活動、力量與功能基線</text><text x="245" y="630" class="b">症狀換型、反覆積液或未依預期改善時，回到最上層重新分流</text><text x="220" y="715" class="b">單一特殊檢查、正常脈搏或可走路，都不能獨立排除重大病灶。</text></svg>
