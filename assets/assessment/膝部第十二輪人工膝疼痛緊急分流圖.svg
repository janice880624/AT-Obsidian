<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#fff"/><text x="55" y="65" font-family="sans-serif" font-size="34">人工膝疼痛：先排不能等待的狀況</text><g font-family="sans-serif" font-size="21" text-anchor="middle"><rect x="220" y="105" width="760" height="110" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="5"/><text x="600" y="150">變形／不能負重／敗血／持續滲液／完全伸膝失能</text><text x="600" y="185">或神經血管異常？是 → 停止測試、保持原位、急診</text><rect x="45" y="310" width="345" height="220" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="217" y="360">創傷或突然失能</text><text x="217" y="405">全長 X 光；必要時 CT</text><text x="217" y="450">骨折／伸膝機轉／組件</text><rect x="427" y="310" width="345" height="220" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="600" y="360">熱腫、積液或滲液</text><text x="600" y="405">ESR／CRP＋關節液</text><text x="600" y="450">依認可感染條件組合</text><rect x="810" y="310" width="345" height="220" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="982" y="360">負重痛／打軟腿</text><text x="982" y="405">站立與連續影像</text><text x="982" y="450">感染排除後評估鬆動／不穩</text><text x="600" y="625">單一特殊檢查或影像發現都不能獨立確診</text></g></svg>