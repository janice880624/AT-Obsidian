<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="55" y="55" class="t">幼兒拒用上肢：先安全分流，再考慮牽拉肘</text><rect x="155" y="95" width="890" height="120" rx="18" class="r"/><text x="255" y="140" class="h">發燒／腫脹瘀青變形／骨性壓痛／手冷麻弱／病史不一致？</text><text x="420" y="180" class="b">停止復位嘗試，影像與急迫醫療評估</text><rect x="80" y="285" width="450" height="250" rx="18" class="x"/><text x="165" y="330" class="h">典型牽拉情境</text><text x="125" y="385" class="b">1–4 歲＋縱向牽拉＋無腫脹骨痛</text><text x="125" y="430" class="b">由合格醫療人員評估與復位</text><text x="125" y="475" class="b">合理時間內應恢復自發使用</text><rect x="670" y="285" width="450" height="250" rx="18" class="x"/><text x="760" y="330" class="h">不典型或仍拒用</text><text x="715" y="385" class="b">骨折／骨骺分離／脫臼／感染</text><text x="715" y="430" class="b">全上肢複查＋神經血管＋影像</text><text x="715" y="475" class="b">必要時兒童骨科與保護流程</text><rect x="225" y="610" width="750" height="85" rx="16" class="g"/><text x="305" y="662" class="h">「復位失敗」不是反覆操作的理由，而是重新分流的訊號</text></svg>
