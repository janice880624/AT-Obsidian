<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#fff"/><text x="55" y="65" font-family="sans-serif" font-size="34">人工髖疼痛：先排不能等待的狀況</text><g font-family="sans-serif" font-size="22" text-anchor="middle"><rect x="280" y="110" width="640" height="100" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="5"/><text x="600" y="153">變形／不能負重／敗血／持續滲液／神經血管異常？</text><text x="600" y="187">是 → 保持原位、停止測試、急診</text><rect x="55" y="310" width="320" height="220" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="215" y="360">創傷與變形</text><text x="215" y="405">骨盆＋全股骨 X 光</text><text x="215" y="450">骨折／脫臼／柄穩定</text><rect x="440" y="310" width="320" height="220" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="600" y="360">發燒、滲液、持續痛</text><text x="600" y="405">ESR／CRP＋影像導引關節液</text><text x="600" y="450">感染共識條件組合</text><rect x="825" y="310" width="320" height="220" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="985" y="360">慢性腹股溝痛／腫塊無力</text><text x="985" y="405">CT／超音波／MARS-MRI</text><text x="985" y="450">髂腰肌、磨屑、鬆動</text><text x="600" y="620">單一測試、單次血液值或影像發現都不能獨立確診</text></g></svg>