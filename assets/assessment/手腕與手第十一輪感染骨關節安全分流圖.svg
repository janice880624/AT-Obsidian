<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.a{fill:#eff6ff;stroke:#2563eb;stroke-width:4}.g{fill:#ecfdf5;stroke:#047857;stroke-width:4}.o{fill:#fff7ed;stroke:#c2410c;stroke-width:4}</style><text x="55" y="55" class="t">Hand / Wrist Infection: Bone and Joint Triage</text><rect x="95" y="95" width="1010" height="105" rx="18" class="r"/><text x="260" y="140" class="h">Sepsis, necrosis, spreading erythema or perfusion change?</text><text x="420" y="178" class="b">Stop testing and activate urgent referral.</text><rect x="55" y="270" width="335" height="290" rx="18" class="a"/><text x="135" y="320" class="h">EXPOSURE</text><text x="90" y="375" class="b">Puncture / bite / surgery</text><text x="90" y="420" class="b">Open fracture / injection</text><text x="90" y="465" class="b">Antibiotics already used?</text><rect x="430" y="270" width="335" height="290" rx="18" class="g"/><text x="515" y="320" class="h">LOCALIZE</text><text x="465" y="375" class="b">Skin / sheath / joint / bone</text><text x="465" y="420" class="b">ROM + wound + perfusion</text><text x="465" y="465" class="b">No courtside aspiration</text><rect x="805" y="270" width="335" height="290" rx="18" class="o"/><text x="880" y="320" class="h">CONFIRM</text><text x="840" y="375" class="b">Imaging + deep samples</text><text x="840" y="420" class="b">Culture / pathology</text><text x="840" y="465" class="b">Hand + infection teams</text><text x="235" y="665" class="h">No fever or normal early radiograph does not exclude deep infection.</text></svg>
