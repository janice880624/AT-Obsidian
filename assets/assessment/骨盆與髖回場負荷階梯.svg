<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">骨盆與髖回場負荷階梯</title>
  <desc id="desc">由醫療許可、基礎功能至專項對抗的漸進負荷階梯</desc>
  <rect width="1400" height="800" fill="#f8fafc"/>
  <text x="700" y="70" text-anchor="middle" font-size="38" font-family="sans-serif" font-weight="700" fill="#0f172a">骨盆與髖：回場負荷階梯</text>
  <g font-family="sans-serif">
    <rect x="90" y="610" width="235" height="105" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="208" y="652" text-anchor="middle" font-size="24" font-weight="700" fill="#1e3a8a">1 醫療許可</text><text x="208" y="686" text-anchor="middle" font-size="19" fill="#172554">癒合・紅旗清除</text>
    <rect x="325" y="500" width="235" height="215" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
    <text x="443" y="545" text-anchor="middle" font-size="24" font-weight="700" fill="#0c4a6e">2 基礎功能</text><text x="443" y="580" text-anchor="middle" font-size="19" fill="#0c4a6e">步行・活動度</text><text x="443" y="612" text-anchor="middle" font-size="19" fill="#0c4a6e">力量・單腳控制</text>
    <rect x="560" y="390" width="235" height="325" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="678" y="435" text-anchor="middle" font-size="24" font-weight="700" fill="#14532d">3 跑跳耐受</text><text x="678" y="470" text-anchor="middle" font-size="19" fill="#14532d">慢跑→加速</text><text x="678" y="502" text-anchor="middle" font-size="19" fill="#14532d">雙腳→單腳落地</text>
    <rect x="795" y="280" width="235" height="435" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <text x="913" y="325" text-anchor="middle" font-size="24" font-weight="700" fill="#78350f">4 多方向</text><text x="913" y="360" text-anchor="middle" font-size="19" fill="#78350f">減速・側移・變向</text><text x="913" y="392" text-anchor="middle" font-size="19" fill="#78350f">計畫→反應式</text>
    <rect x="1030" y="170" width="280" height="545" rx="16" fill="#fae8ff" stroke="#a21caf" stroke-width="4"/>
    <text x="1170" y="215" text-anchor="middle" font-size="24" font-weight="700" fill="#701a75">5 專項與完整參與</text><text x="1170" y="250" text-anchor="middle" font-size="19" fill="#701a75">疲勞・接觸・決策</text><text x="1170" y="282" text-anchor="middle" font-size="19" fill="#701a75">訓練→比賽暴露</text>
    <path d="M165 140 H1235" stroke="#dc2626" stroke-width="5" stroke-dasharray="12 10"/>
    <text x="700" y="125" text-anchor="middle" font-size="22" font-weight="700" fill="#991b1b">每一階：監測當下與 24 小時反應；若疼痛、跛行或信心惡化則降階</text>
  </g>
  <text x="55" y="765" font-size="18" font-family="sans-serif" fill="#64748b">原創流程圖・CC BY 4.0・不是固定通關值；須結合傷害癒合、個人基線、專項需求與共享決策</text>
</svg>

