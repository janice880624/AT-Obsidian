<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:17px}.a{fill:#dbeafe;stroke:#2563eb;stroke-width:4}.g{fill:#dcfce7;stroke:#16a34a;stroke-width:4}.o{fill:#ffedd5;stroke:#ea580c;stroke-width:4}</style><text x="55" y="55" class="t">Wrist / Hand Activity After Medical Stabilization</text><rect x="70" y="120" width="320" height="400" rx="20" class="a"/><text x="145" y="175" class="h">STAGE 1: PROTECT</text><text x="110" y="245" class="b">Wound / bone restrictions</text><text x="110" y="295" class="b">Supported range</text><text x="110" y="345" class="b">No provocative load</text><rect x="440" y="120" width="320" height="400" rx="20" class="g"/><text x="525" y="175" class="h">STAGE 2: RESTORE</text><text x="480" y="245" class="b">Tendon glide / active ROM</text><text x="480" y="295" class="b">Low-load grip</text><text x="480" y="345" class="b">24-hour response</text><rect x="810" y="120" width="320" height="400" rx="20" class="o"/><text x="895" y="175" class="h">STAGE 3: LOAD</text><text x="850" y="245" class="b">Grip / rotate / support</text><text x="850" y="295" class="b">Speed and contact last</text><text x="850" y="345" class="b">One variable at a time</text><text x="165" y="635" class="h">Fever, wound change, new swelling, bone pain or weakness: STOP.</text></svg>
