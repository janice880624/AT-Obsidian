<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="45" y="55" class="t">胸腰椎第三輪：症狀、風險與負荷決策</text><g transform="translate(65 115)"><rect width="320" height="180" rx="14" class="x"/><text x="62" y="42" class="h">胸背＋神經長徑</text><text x="35" y="82" class="b">感覺平面、反射亢進</text><text x="35" y="116" class="b">雙腿僵硬與步態異常</text><text x="35" y="150" class="b">→ 優先 MRI／專科</text><rect x="375" width="320" height="180" rx="14" class="x"/><text x="438" y="42" class="h">青少年局部背痛</text><text x="410" y="82" class="b">生長、骨應力、滑脫</text><text x="410" y="116" class="b">固定後凸與訓練變化</text><text x="410" y="150" class="b">→ 病灶與負荷分流</text><rect x="750" width="320" height="180" rx="14" class="x"/><text x="815" y="42" class="h">非特異性下背痛</text><text x="785" y="82" class="b">先排除嚴重特定病因</text><text x="785" y="116" class="b">功能、睡眠、心理社會</text><text x="785" y="150" class="b">→ 維持活動與自我管理</text></g><g transform="translate(155 380)"><rect width="890" height="190" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="330" y="42" class="h">共同回場判準</text><text x="55" y="85" class="b">① 無進行性神經、系統或骨性紅旗，病灶限制已確認</text><text x="55" y="125" class="b">② 日常活動、方向性負荷、力量與隔日反應穩定</text><text x="55" y="165" class="b">③ 完成真實運動的速度、疲勞、伸展旋轉、負重或接觸進展</text></g><rect x="110" y="625" width="980" height="50" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="185" y="657" class="b">單一影像、姿勢或特殊檢查都不能獨立決定疼痛來源與回場。</text></svg>
