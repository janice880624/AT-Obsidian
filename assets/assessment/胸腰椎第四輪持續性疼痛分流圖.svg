<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="42" y="55" class="t">持續性胸腰痛：每次型態改變都要重新分流</text><rect x="120" y="90" width="960" height="120" rx="16" class="r"/><text x="205" y="135" class="h">生命徵象、創傷、感染／腫瘤、血管／內臟、脊髓／馬尾警訊？</text><text x="365" y="175" class="b">有：停止挑釁，依急迫度轉送或醫療評估</text><rect x="80" y="270" width="320" height="205" rx="14" class="x"/><text x="140" y="315" class="h">站走誘發腿症狀</text><text x="115" y="360" class="b">神經與血管都要檢查</text><text x="115" y="400" class="b">量首次症狀與停止距離</text><text x="115" y="440" class="b">影像需與臨床一致</text><rect x="440" y="270" width="320" height="205" rx="14" class="x"/><text x="495" y="315" class="h">局部機械性疼痛</text><text x="475" y="360" class="b">多方向動作與功能基線</text><text x="475" y="400" class="b">不由單一測試指定痛源</text><text x="475" y="440" class="b">設定再評期限</text><rect x="800" y="270" width="320" height="205" rx="14" class="x"/><text x="865" y="315" class="h">系統性或夜間變化</text><text x="835" y="360" class="b">風險史、發燒、體重與癌症</text><text x="835" y="400" class="b">無發燒不排除感染</text><text x="835" y="440" class="b">依風險安排檢驗與影像</text><rect x="165" y="545" width="870" height="100" rx="16" class="g"/><text x="330" y="585" class="h">低風險：教育、負荷調整、維持活動與追蹤</text><text x="260" y="625" class="b">未改善、功能下降或症狀換型態時，回到最上層重新分流</text><text x="255" y="710" class="b">紅旗是機率與急迫度工具，不是單一問題的確診規則。</text></svg>
