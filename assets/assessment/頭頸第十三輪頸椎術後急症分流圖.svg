<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#fff"/><text x="55" y="65" font-family="sans-serif" font-size="34">頸椎術後：先排不能等待的併發症</text><g font-family="sans-serif" font-size="21" text-anchor="middle"><rect x="180" y="105" width="840" height="115" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="5"/><text x="600" y="150">呼吸困難／快速頸腫／敗血／進展神經缺損？</text><text x="600" y="190">是 → 停止測試、急救與手術團隊、必要時緊急減壓</text><rect x="45" y="320" width="345" height="210" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="217" y="370">氣道／血腫</text><text x="217" y="415">臨床急症，不等影像</text><text x="217" y="460">困難氣道＋減壓準備</text><rect x="427" y="320" width="345" height="210" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="600" y="370">傷口／感染</text><text x="600" y="415">檢驗趨勢＋影像＋深部培養</text><text x="600" y="460">同日手術團隊</text><rect x="810" y="320" width="345" height="210" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="982" y="370">C5／融合／鄰節</text><text x="982" y="415">完整神經檢查＋適時影像</text><text x="982" y="460">單一測試不確診</text><text x="600" y="625">紅旗排除且醫療穩定後，才進入功能評估</text></g></svg>