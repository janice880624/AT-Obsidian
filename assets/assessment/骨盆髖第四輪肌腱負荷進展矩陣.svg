<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="42" y="55" class="t">外側與後側髖肌腱：由可控負荷走向專項速度</text><g transform="translate(55 115)"><rect width="250" height="185" rx="15" class="x"/><text x="52" y="42" class="h">1 降低過度壓縮</text><text x="24" y="90" class="b">調整側躺、久坐與深髖屈</text><text x="24" y="130" class="b">不必完全休息</text><text x="24" y="168" class="b">建立低負荷等長基線</text><rect x="275" width="250" height="185" rx="15" class="x"/><text x="340" y="42" class="h">2 慢速力量</text><text x="300" y="90" class="b">雙腳到單腳、短槓桿到長槓桿</text><text x="300" y="130" class="b">臀外展與腿後肌分別進展</text><text x="300" y="168" class="b">記錄隔日反應</text><rect x="550" width="250" height="185" rx="15" class="x"/><text x="610" y="42" class="h">3 角度與彈性</text><text x="575" y="90" class="b">增加髖內收或髖屈位耐受</text><text x="575" y="130" class="b">加入階梯、跳躍與快速伸髖</text><text x="575" y="168" class="b">一次主改一項</text><rect x="825" width="250" height="185" rx="15" class="x"/><text x="895" y="42" class="h">4 專項負荷</text><text x="850" y="90" class="b">跑量、坡度、加速與最大速度</text><text x="850" y="130" class="b">連續訓練與比賽情境</text><text x="850" y="168" class="b">共享決策回場</text></g><rect x="150" y="420" width="900" height="155" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="450" y="463" class="h">共同監測四項</text><text x="210" y="510" class="b">症狀位置與熟悉度｜動作品質｜當下反應｜24–48 小時回復</text><text x="205" y="550" class="b">影像外觀不直接決定負荷階段；功能與時間序列共同決策</text><rect x="165" y="625" width="870" height="50" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="215" y="657" class="b">新爆裂感、瘀青、快速無力或疑骨傷：停止進階並重新分流。</text></svg>
