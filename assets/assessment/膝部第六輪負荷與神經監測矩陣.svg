<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}.r{fill:#fff1f2;stroke:#be123c;stroke-width:3}</style><text x="40" y="55" class="t">膝部第六輪：負荷與神經監測矩陣</text><rect x="65" y="110" width="340" height="230" rx="14" class="g"/><text x="150" y="155" class="h">SLJ：症狀導向</text><text x="95" y="205" class="b">低負荷力量 → 蹲踏步</text><text x="95" y="245" class="b">雙腳跳 → 單腳／減速</text><text x="95" y="285" class="b">以 24 小時反應調整</text><rect x="430" y="110" width="340" height="230" rx="14" class="x"/><text x="500" y="155" class="h">OCD：醫療條件導向</text><text x="460" y="205" class="b">穩定性與負重限制先行</text><text x="460" y="245" class="b">積液、卡住、影像共同追蹤</text><text x="460" y="285" class="b">疼痛下降 ≠ 病灶癒合</text><rect x="795" y="110" width="340" height="230" rx="14" class="r"/><text x="850" y="155" class="h">腓總神經：功能導向</text><text x="825" y="205" class="b">背屈、趾伸、外翻、感覺</text><text x="825" y="245" class="b">步態與跌倒風險</text><text x="825" y="285" class="b">進展性足下垂立即轉介</text><rect x="120" y="420" width="960" height="180" rx="16" class="x"/><text x="425" y="465" class="h">共同進展條件</text><text x="180" y="515" class="b">無新紅旗｜活動度可控｜力量與功能趨勢改善｜訓練後 24–48 小時回基線</text><text x="180" y="560" class="b">一次只主增一個變項：角度、重量、速度、跑量、跳量或方向改變</text><text x="240" y="675" class="b">鎖膝、大積液、伸膝失能、神經惡化或無法負重：停止並重新分流。</text></svg>
