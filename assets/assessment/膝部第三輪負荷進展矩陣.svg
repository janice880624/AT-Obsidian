<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="45" y="55" class="t">膝伸肌：從組織保護到跑跳回場</text><g transform="translate(60 115)"><rect width="245" height="170" rx="15" class="x"/><text x="55" y="42" class="h">1 醫療與負重限制</text><text x="28" y="86" class="b">骨折／修補／骨骺狀態</text><text x="28" y="122" class="b">伸膝 lag、腫脹、ROM</text><text x="28" y="154" class="b">神經血管與腔室安全</text><rect x="275" width="245" height="170" rx="15" class="x"/><text x="340" y="42" class="h">2 基礎力量</text><text x="307" y="86" class="b">等長、膝伸、雙腳蹲</text><text x="307" y="122" class="b">負荷與角度逐項增加</text><text x="307" y="154" class="b">24 小時關節反應</text><rect x="550" width="245" height="170" rx="15" class="x"/><text x="615" y="42" class="h">3 單腳與速度</text><text x="582" y="86" class="b">坐站、階梯、分腿蹲</text><text x="582" y="122" class="b">快速出力與離心控制</text><text x="582" y="154" class="b">健側偏移與信心</text><rect x="825" width="245" height="170" rx="15" class="x"/><text x="890" y="42" class="h">4 跑跳與專項</text><text x="857" y="86" class="b">跑速、落地、減速</text><text x="857" y="122" class="b">變向、疲勞、決策</text><text x="857" y="154" class="b">全量訓練與隔日反應</text></g><rect x="155" y="385" width="890" height="180" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="470" y="430" class="h">共同通關條件</text><text x="205" y="480" class="b">疼痛與腫脹可接受｜動作品質穩定｜負荷後 24 小時回基線</text><text x="205" y="525" class="b">沒有新神經血管／骨性警訊｜符合醫療限制｜一次只增一個主要變項</text><rect x="180" y="625" width="840" height="50" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="260" y="657" class="b">力量對稱、單次無痛或單一測試都不足以獨立決定回場。</text></svg>
