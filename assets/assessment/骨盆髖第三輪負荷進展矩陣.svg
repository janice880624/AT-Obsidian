<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="45" y="55" class="t">骨盆與髖第三輪：從安全分流到專項負荷</text><g transform="translate(70 115)"><rect width="235" height="170" rx="15" class="x"/><text x="62" y="42" class="h">1 安全分流</text><text x="30" y="85" class="b">負重、骨骺、感染</text><text x="30" y="120" class="b">骨壞死、神經血管</text><text x="30" y="150" class="b">腹腔與泌尿急症</text><rect x="275" width="235" height="170" rx="15" class="x"/><text x="337" y="42" class="h">2 臨床分類</text><text x="305" y="85" class="b">Doha 可多重實體</text><text x="305" y="120" class="b">髖／腰／薦髂鑑別</text><text x="305" y="150" class="b">不以單一測試確診</text><rect x="550" width="235" height="170" rx="15" class="x"/><text x="612" y="42" class="h">3 容量建立</text><text x="580" y="85" class="b">活動度、等長力量</text><text x="580" y="120" class="b">單腳與內收肌負荷</text><text x="580" y="150" class="b">記錄 24 小時反應</text><rect x="825" width="235" height="170" rx="15" class="x"/><text x="887" y="42" class="h">4 專項回場</text><text x="855" y="85" class="b">跑速、踢擊、變向</text><text x="855" y="120" class="b">疲勞、接觸、全訓練</text><text x="855" y="150" class="b">醫療限制與信心</text></g><g transform="translate(130 380)"><rect width="940" height="180" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="355" y="45" class="h">每階段共同通關</text><text x="60" y="90" class="b">症狀沒有逐組升高　｜　動作品質可維持　｜　隔日回到可接受基線</text><text x="60" y="130" class="b">沒有新紅旗或神經血管改變　｜　下一階段只提高一個主要負荷變項</text></g><rect x="170" y="625" width="860" height="50" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="245" y="657" class="b">疼痛下降、影像或力量單項達標，都不足以單獨決定回場。</text></svg>
