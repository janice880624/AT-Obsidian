<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="55" y="55" class="t">深部腹股溝、恥骨或青少年髖痛：先做安全分流</text><rect x="105" y="90" width="990" height="120" rx="18" class="r"/><text x="185" y="140" class="h">發燒、低血壓、無法負重、快速惡化、病理性骨折或全身症狀？</text><text x="405" y="180" class="b">停止負荷並急迫醫療轉介</text><rect x="70" y="285" width="320" height="225" rx="18" class="x"/><text x="135" y="330" class="h">感染可能</text><text x="105" y="380" class="b">培養、發炎指標、MRI／CT</text><text x="105" y="420" class="b">特殊檢查不能排除深部感染</text><rect x="440" y="285" width="320" height="225" rx="18" class="x"/><text x="505" y="330" class="h">骨性病灶</text><text x="475" y="380" class="b">X 光起始，MRI／CT 評估範圍</text><text x="475" y="420" class="b">活檢交由骨腫瘤專科規劃</text><rect x="810" y="285" width="320" height="225" rx="18" class="x"/><text x="875" y="330" class="h">機械性前髖痛</text><text x="845" y="380" class="b">AIIS、FAI、盂唇與肌腱整合</text><text x="845" y="420" class="b">形態或單一測試不等於確診</text><rect x="180" y="610" width="840" height="85" rx="18" class="g"/><text x="255" y="662" class="h">只有醫療穩定後才進入功能測試與漸進負荷</text></svg>
