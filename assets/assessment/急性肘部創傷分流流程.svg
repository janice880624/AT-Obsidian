<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">急性肘部創傷分流流程</title>
  <desc id="desc">由主調查、紅旗、保護和神經血管紀錄、影像到複查的急性肘傷流程。</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <text x="600" y="48" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#0f172a">急性肘部創傷：先保肢體，再找結構</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="355" y="80" width="490" height="78" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="600" y="127" font-size="24" fill="#1e3a8a">主調查：生命徵象、頭頸胸、多重創傷</text>
    <path d="M600 158 V200" stroke="#475569" stroke-width="4" marker-end="url(#a)"/>
    <rect x="300" y="205" width="600" height="105" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
    <text x="600" y="245" font-size="23" fill="#991b1b">開放傷／皮膚受壓／明顯變形</text>
    <text x="600" y="280" font-size="23" fill="#991b1b">脈搏或回填異常／進行性神經缺損</text>
    <path d="M600 310 V352" stroke="#475569" stroke-width="4" marker-end="url(#a)"/>
    <rect x="330" y="357" width="540" height="95" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <text x="600" y="395" font-size="23" fill="#92400e">支托最舒適位置；禁止場邊復位</text>
    <text x="600" y="429" font-size="22" fill="#92400e">記錄固定／復位前神經血管狀態</text>
    <path d="M600 452 V494" stroke="#475569" stroke-width="4" marker-end="url(#a)"/>
    <rect x="325" y="499" width="550" height="98" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="600" y="538" font-size="24" fill="#166534">正交 X 光為常見起點</text>
    <text x="600" y="571" font-size="21" fill="#166534">高度懷疑且陰性／不確定 → 依組織選 CT、MRI、超音波或追蹤</text>
    <path d="M600 597 V636" stroke="#475569" stroke-width="4" marker-end="url(#a)"/>
    <rect x="345" y="641" width="510" height="66" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="4"/>
    <text x="600" y="682" font-size="24" fill="#3730a3">復位／固定後再次神經血管檢查</text>
  </g>
  <text x="70" y="738" font-family="sans-serif" font-size="18" fill="#475569">教學流程，不取代急救、影像判讀與所在地 SOP。</text>
</svg>

