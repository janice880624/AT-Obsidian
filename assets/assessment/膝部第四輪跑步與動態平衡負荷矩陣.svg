<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="42" y="55" class="t">膝部功能進展：力量、動態平衡與跑步負荷</text><g transform="translate(50 115)"><rect width="255" height="190" rx="15" class="x"/><text x="65" y="42" class="h">1 日常與積液</text><text x="25" y="90" class="b">走路、樓梯、完整伸直</text><text x="25" y="130" class="b">腫脹與隔日反應穩定</text><text x="25" y="168" class="b">紅旗已排除</text><rect x="280" width="255" height="190" rx="15" class="x"/><text x="345" y="42" class="h">2 慢速力量</text><text x="305" y="90" class="b">蹲、分腿、階梯、提踵</text><text x="305" y="130" class="b">由雙腳進至單腳</text><text x="305" y="168" class="b">增加負重或角度之一</text><rect x="560" width="255" height="190" rx="15" class="x"/><text x="615" y="42" class="h">3 動態平衡</text><text x="585" y="90" class="b">Y-Balance 三方向</text><text x="585" y="130" class="b">追蹤品質、側差與症狀</text><text x="585" y="168" class="b">不用單一門檻裁決</text><rect x="840" width="255" height="190" rx="15" class="x"/><text x="905" y="42" class="h">4 跑跳轉向</text><text x="865" y="90" class="b">先時間，再速度或坡度</text><text x="865" y="130" class="b">加入減速、跳躍與切入</text><text x="865" y="168" class="b">連續訓練後再回場</text></g><rect x="145" y="430" width="910" height="150" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="455" y="470" class="h">每一階段共同監測</text><text x="205" y="520" class="b">症狀與熟悉度｜積液與活動｜動作品質｜當下及 24 小時反應</text><text x="205" y="558" class="b">一次主調一項負荷；影像或單一測試不直接等於回場許可</text><rect x="160" y="625" width="880" height="50" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="225" y="657" class="b">新鎖住、大積液、無法負重、紅熱發燒或神經血管變化：停止進階。</text></svg>
