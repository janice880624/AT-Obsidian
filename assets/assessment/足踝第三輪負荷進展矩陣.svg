<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="45" y="55" class="t">足踝回場：由醫療限制走向反應性方向變換</text><g transform="translate(55 115)"><rect width="250" height="175" rx="15" class="x"/><text x="42" y="42" class="h">1 安全與組織保護</text><text x="25" y="88" class="b">骨折／皮膚／神經血管</text><text x="25" y="125" class="b">負重與活動度限制</text><text x="25" y="158" class="b">疼痛、腫脹、24 小時反應</text><rect x="275" width="250" height="175" rx="15" class="x"/><text x="332" y="42" class="h">2 基礎容量</text><text x="300" y="88" class="b">背屈、跟提、內外翻力量</text><text x="300" y="125" class="b">單腳站與足弓控制</text><text x="300" y="158" class="b">走路與慢跑反應</text><rect x="550" width="250" height="175" rx="15" class="x"/><text x="605" y="42" class="h">3 跳躍與減速</text><text x="575" y="88" class="b">單腳落地、Side Hop</text><text x="575" y="125" class="b">多方向與速度</text><text x="575" y="158" class="b">錯誤、信心與疲勞</text><rect x="825" width="250" height="175" rx="15" class="x"/><text x="875" y="42" class="h">4 運動與決策</text><text x="850" y="88" class="b">反應性切入與專項</text><text x="850" y="125" class="b">全量訓練暴露</text><text x="850" y="158" class="b">PAASS 多領域整合</text></g><rect x="150" y="395" width="900" height="175" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="472" y="438" class="h">共同通關條件</text><text x="198" y="486" class="b">症狀與腫脹可接受｜動作品質穩定｜負荷後隔日回基線</text><text x="198" y="530" class="b">沒有新骨性／神經血管警訊｜一次只增加一個主要負荷變項</text><rect x="170" y="625" width="860" height="50" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="240" y="657" class="b">單次 Side Hop、左右對稱或貼紮後無痛，都不足以獨立決定回場。</text></svg>
