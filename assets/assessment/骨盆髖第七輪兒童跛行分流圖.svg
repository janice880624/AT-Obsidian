<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="40" y="55" class="t">兒童跛行：先排除感染、骨折與成長期髖病</text><rect x="120" y="95" width="960" height="115" rx="16" class="r"/><text x="215" y="140" class="h">發燒／全身不適、無法負重、夜痛、創傷或快速惡化？</text><text x="475" y="180" class="b">同日或急迫轉介</text><rect x="85" y="290" width="300" height="220" rx="16" class="x"/><text x="145" y="330" class="h">問診與年齡</text><text x="120" y="375" class="b">感染、創傷、成長、夜痛</text><text x="120" y="420" class="b">髖痛可轉移到膝</text><rect x="450" y="290" width="300" height="220" rx="16" class="x"/><text x="520" y="330" class="h">低挑釁檢查</text><text x="490" y="375" class="b">負重、步態、髖活動</text><text x="490" y="420" class="b">膝、脊柱與神經血管</text><rect x="815" y="290" width="300" height="220" rx="16" class="x"/><text x="875" y="330" class="h">影像與追蹤</text><text x="850" y="375" class="b">正常 X 光不排除早期病灶</text><text x="850" y="420" class="b">設定惡化門檻與複評</text><rect x="190" y="590" width="820" height="80" rx="16" class="g"/><text x="260" y="640" class="h">Kocher/Caird 因子輔助機率，不是單獨確診工具</text></svg>
