<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="55" y="55" class="t">背痛合併神經變化：先看發作速度，再做急迫分流</text><rect x="110" y="95" width="980" height="105" rx="18" class="r"/><text x="220" y="140" class="h">新發／進行性雙腿麻弱、感覺平面或括約肌變化？</text><text x="430" y="177" class="b">停止負荷、建立時間戳、急迫轉介</text><rect x="80" y="285" width="480" height="240" rx="18" class="x"/><text x="190" y="330" class="h">分鐘至小時達峰</text><text x="135" y="385" class="b">急性壓迫、脊髓缺血、主動脈急症</text><text x="135" y="430" class="b">急診 MRI／血管與感染評估</text><rect x="640" y="285" width="480" height="240" rx="18" class="x"/><text x="760" y="330" class="h">數週至數年進展</text><text x="695" y="385" class="b">靜脈鬱血、蛛網膜網、腫瘤或退化</text><text x="695" y="430" class="b">神經專科、MRI；疑瘻管再做血管攝影</text><rect x="175" y="600" width="850" height="85" rx="18" class="g"/><text x="260" y="652" class="h">時間型態協助分流，不能單獨確診病因</text></svg>
