<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="45" y="55" class="t">高能量足踝傷：皮膚、灌流、神經與腔室優先</text><rect x="145" y="90" width="910" height="115" rx="16" class="r"/><text x="225" y="132" class="h">開放傷／皮膚頂白／無脈冷白／進行性麻痺／腔室警訊？</text><text x="395" y="175" class="b">立即急診創傷與骨科流程</text><rect x="155" y="255" width="390" height="185" rx="14" class="x"/><text x="260" y="297" class="h">序列檢查</text><text x="195" y="340" class="b">足背與後脛脈、回填、溫色</text><text x="195" y="378" class="b">足背／足底感覺與足趾運動</text><text x="195" y="416" class="b">固定前後記錄時間與變化</text><rect x="655" y="255" width="390" height="185" rx="14" class="x"/><text x="760" y="297" class="h">不要遺漏</text><text x="695" y="340" class="b">後跟皮膚、足底瘀斑、開放傷</text><text x="695" y="378" class="b">近端腓骨、脊柱／骨盆、對側足</text><text x="695" y="416" class="b">有脈搏仍不能排除腔室症候群</text><rect x="210" y="510" width="780" height="110" rx="16" class="g"/><text x="355" y="555" class="h">原位舒適固定＋快速轉運＋反覆記錄</text><text x="310" y="595" class="b">未排除骨折脫臼前，不負重、不做韌帶挑釁</text><text x="145" y="700" class="b">本圖不取代急救權限、院方創傷流程、影像或外科決策。</text></svg>
