<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="45" y="55" class="t">顳顎與顏面傷後功能：四個面向一起看</text><g transform="translate(55 115)"><rect width="250" height="190" rx="15" class="x"/><text x="60" y="42" class="h">1 結構安全</text><text x="25" y="88" class="b">骨折／牙齒／眼球已處理</text><text x="25" y="126" class="b">咬合與傷口穩定</text><text x="25" y="164" class="b">專科限制明確</text><rect x="275" width="250" height="190" rx="15" class="x"/><text x="335" y="42" class="h">2 自陳功能</text><text x="300" y="88" class="b">JFLS 固定版本追蹤</text><text x="300" y="126" class="b">咀嚼、張口、表達</text><text x="300" y="164" class="b">營養與避免行為</text><rect x="550" width="250" height="190" rx="15" class="x"/><text x="610" y="42" class="h">3 客觀功能</text><text x="575" y="88" class="b">張口路徑、咬合、感覺</text><text x="575" y="126" class="b">說話吞嚥與視覺</text><text x="575" y="164" class="b">疼痛與隔日反應</text><rect x="825" width="250" height="190" rx="15" class="x"/><text x="880" y="42" class="h">4 運動暴露</text><text x="850" y="88" class="b">非接觸完整訓練</text><text x="850" y="126" class="b">護齒／面罩／耳護</text><text x="850" y="164" class="b">碰撞分級與專科許可</text></g><rect x="150" y="405" width="900" height="175" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="425" y="450" class="h">不是單一數字的回場決策</text><text x="205" y="500" class="b">JFLS、張口或疼痛改善均不能取代影像癒合、牙齒穩定與眼科／顏面外科許可。</text><text x="205" y="540" class="b">接觸回場同時確認護具適配、視覺、氣道、營養與再受傷風險。</text><text x="165" y="660" class="b">若出現新咬合改變、複視、視力下降、麻木、吞嚥或氣道症狀，立即停止並重新轉介。</text></svg>
