<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#fff"/><text x="55" y="65" font-family="sans-serif" font-size="34">人工肩疼痛：先排不能等待的狀況</text><g font-family="sans-serif" font-size="21" text-anchor="middle"><rect x="180" y="105" width="840" height="115" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="5"/><text x="600" y="150">變形／急性失能／敗血／持續滲液／神經血管異常？</text><text x="600" y="190">是 → 保持原位、停止測試、急診／置換團隊</text><rect x="45" y="320" width="345" height="210" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="217" y="370">外傷、變形、急性失能</text><text x="217" y="415">骨折／脫臼／神經血管</text><text x="217" y="460">X 光；必要時 CT</text><rect x="427" y="320" width="345" height="210" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="600" y="370">熱腫滲液或隱匿僵硬</text><text x="600" y="415">肩部感染專屬診斷路徑</text><text x="600" y="460">單一正常檢驗不排除</text><rect x="810" y="320" width="345" height="210" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="982" y="370">負荷痛／肩頂局部痛</text><text x="982" y="415">鬆動或肩峰應力骨折</text><text x="982" y="460">連續影像＋專科判讀</text><text x="600" y="625">原生肩特殊檢查不可直接當人工肩確診工具</text></g></svg>