<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#fff"/><style>text{font-family:sans-serif;fill:#172033}.h{font-size:36px;font-weight:700}.t{font-size:23px}.s{font-size:18px}.q{fill:#eef4ff;stroke:#2356a8;stroke-width:3}.a{fill:#fff0ee;stroke:#b63a2b;stroke-width:3}.c{fill:#eff9f0;stroke:#2f7d45;stroke-width:3}</style><text x="60" y="60" class="h">代謝、發炎與感染性胸腰痛安全分流</text><rect x="390" y="95" rx="18" width="420" height="90" class="q"/><text x="430" y="135" class="t">新發／惡化胸腰痛</text><text x="430" y="168" class="s">先查生命徵象、神經與括約肌</text><path d="M600 185v60" stroke="#172033" stroke-width="4"/><rect x="80" y="245" rx="18" width="310" height="230" class="a"/><text x="110" y="290" class="t">立即急診</text><text x="110" y="335" class="s">敗血症／生命徵象異常</text><text x="110" y="370" class="s">新無力、感覺平面</text><text x="110" y="405" class="s">馬尾症狀或快速惡化</text><rect x="445" y="245" rx="18" width="310" height="230" class="q"/><text x="475" y="290" class="t">快速醫療評估</text><text x="475" y="335" class="s">感染／免疫／侵入處置風險</text><text x="475" y="370" class="s">痛風、腎病或非機械性痛</text><text x="475" y="405" class="s">考慮 MRI、培養或採樣</text><rect x="810" y="245" rx="18" width="310" height="230" class="c"/><text x="840" y="290" class="t">低風險監測</text><text x="840" y="335" class="s">神經與生命徵象穩定</text><text x="840" y="370" class="s">活動建議＋明確安全網</text><text x="840" y="405" class="s">設定再評估時點</text><path d="M600 185L235 245M600 185v60M600 185l365 60" stroke="#172033" stroke-width="4" fill="none"/><text x="60" y="555" class="t">重要：正常體溫或正常血尿酸，均不能單獨排除感染或軸性痛風。</text><text x="60" y="635" class="s">原創流程圖｜CC BY 4.0｜教育用途，不取代急診與專科判斷</text></svg>
