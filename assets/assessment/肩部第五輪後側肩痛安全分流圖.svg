<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="45" y="55" class="t">後側肩痛：先排除時間敏感神經血管問題</text><rect x="135" y="90" width="930" height="120" rx="16" class="r"/><text x="235" y="135" class="h">肢體冰冷蒼白／脈搏改變、呼吸困難、快速進展無力</text><text x="405" y="177" class="b">任一項：停止負荷並急迫轉介</text><rect x="80" y="270" width="310" height="235" rx="15" class="x"/><text x="145" y="315" class="h">先劇痛，後多灶無力</text><text x="120" y="365" class="b">考慮神經痛性肌萎縮</text><text x="120" y="405" class="b">畫出肌力、感覺、反射</text><text x="120" y="445" class="b">神經科／電生理時程</text><rect x="445" y="270" width="310" height="235" rx="15" class="x"/><text x="500" y="315" class="h">外展外旋熟悉後側痛</text><text x="485" y="365" class="b">整合投擲階段與負荷</text><text x="485" y="405" class="b">活動度、肩胛、肌力</text><text x="485" y="445" class="b">不能靠單一測試確診</text><rect x="810" y="270" width="310" height="235" rx="15" class="x"/><text x="865" y="315" class="h">位置性神經／血管症狀</text><text x="850" y="365" class="b">完整腋神經與灌流檢查</text><text x="850" y="405" class="b">排除頸源與肩內病變</text><text x="850" y="445" class="b">避免反覆長時間挑釁</text><rect x="185" y="565" width="830" height="105" rx="16" class="g"/><text x="365" y="610" class="h">安全後：建立負荷假說並追蹤時間序列</text><text x="300" y="650" class="b">症狀、力量、動作、投擲與隔日反應共同決策</text><text x="120" y="725" class="b">本圖用於教育與分流，不取代神經科、血管外科、運動醫學或影像診斷。</text></svg>
