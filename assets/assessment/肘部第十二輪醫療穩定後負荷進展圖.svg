<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><rect width="1200" height="700" fill="#f8fafc"/><text x="60" y="65" font-family="sans-serif" font-size="34">肘部發炎、骨軟骨與骨骺病灶：醫療穩定後進展</text><g font-family="sans-serif" font-size="21" text-anchor="middle"><g fill="#e0f2fe" stroke="#0369a1" stroke-width="4"><rect x="55" y="155" width="210" height="125" rx="18"/><rect x="285" y="155" width="210" height="125" rx="18"/><rect x="515" y="155" width="210" height="125" rx="18"/><rect x="745" y="155" width="210" height="125" rx="18"/><rect x="975" y="155" width="170" height="125" rx="18"/></g><text x="160" y="205">紅旗解除</text><text x="160" y="240">骨／感染穩定</text><text x="390" y="205">舒適活動</text><text x="390" y="240">前臂手腕</text><text x="620" y="205">低強度等長</text><text x="620" y="240">握力與旋轉</text><text x="850" y="205">推拉與閉鎖鏈</text><text x="850" y="240">控制 24 小時反應</text><text x="1060" y="205">投擲／工作</text><text x="1060" y="240">專科允許</text><path d="M265 220 H285 M495 220 H515 M725 220 H745 M955 220 H975" stroke="#334155" stroke-width="5"/><rect x="145" y="385" width="910" height="170" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="600" y="435">每階監測</text><text x="600" y="480">紅熱滲液 ｜ 新出血 ｜ 鎖住 ｜ 神經功能 ｜ 隔日腫痛</text><text x="600" y="525">任何紅旗 → 停止、回退並重新醫療評估</text></g><text x="60" y="655" font-family="sans-serif" font-size="19" fill="#475569">原創示意圖｜不取代抗菌、降尿酸、骨癒合或血管專科限制｜CC BY 4.0</text></svg>