<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.o{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="55" y="55" class="t">神經病變足熱紅腫：Charcot、感染與缺血分流</text><rect x="110" y="95" width="980" height="115" rx="18" class="r"/><text x="220" y="140" class="h">病容、缺血、壞死、膿液或深部傷口？</text><text x="430" y="183" class="b">固定卸載並立即急診</text><rect x="80" y="285" width="500" height="250" rx="18" class="o"/><text x="165" y="335" class="h">完整皮膚＋神經病變＋熱紅腫</text><text x="125" y="395" class="b">高度考慮活動性 Charcot</text><text x="125" y="445" class="b">立即膝高固定卸載；X 光正常仍可需 MRI</text><rect x="630" y="285" width="490" height="250" rx="18" class="g"/><text x="760" y="335" class="h">傷口或感染線索</text><text x="680" y="395" class="b">依感染指引採樣、影像與醫療治療</text><text x="680" y="445" class="b">Charcot 與感染可以共存</text><rect x="180" y="615" width="840" height="80" rx="18" class="g"/><text x="285" y="665" class="h">疼痛輕、單一溫差或正常初始 X 光都不能安全排除</text></svg>
