<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#172033}.t{font-size:25px;font-weight:700}.h{font-size:18px;font-weight:700}.b{font-size:14px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="55" y="55" class="t">PERSISTENT NIGHT PAIN / MASS / PLANTAR SWELLING — SAFE TRIAGE</text><rect x="110" y="95" width="980" height="115" rx="18" class="r"/><text x="230" y="140" class="h">EMERGENCY: chest pain, dyspnea, syncope, ischemia, systemic illness</text><text x="480" y="180" class="b">STOP ACTIVITY — URGENT CARE</text><rect x="65" y="280" width="330" height="250" rx="18" class="x"/><text x="145" y="330" class="h">BONE / NIGHT PAIN</text><text x="105" y="385" class="b">Radiograph by scenario</text><text x="105" y="425" class="b">CT for a small nidus</text><rect x="435" y="280" width="330" height="250" rx="18" class="x"/><text x="515" y="330" class="h">UNKNOWN MASS</text><text x="485" y="385" class="b">Image before biopsy</text><text x="485" y="425" class="b">Plan with tumor center</text><rect x="805" y="280" width="330" height="250" rx="18" class="x"/><text x="865" y="330" class="h">PLANTAR SWELLING</text><text x="850" y="385" class="b">Consider plantar vein</text><text x="850" y="425" class="b">No deep massage</text><rect x="185" y="610" width="830" height="85" rx="18" class="g"/><text x="290" y="662" class="h">One negative test never closes a persistent red-flag pathway</text></svg>
