<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="40" y="55" class="t">急性非創傷性膝痛：先辨識不能繼續測試的情況</text><rect x="100" y="90" width="1000" height="125" rx="16" class="r"/><text x="175" y="138" class="h">無法負重、發燒紅熱腫、夜間進展痛、急性小腿腫痛或神經血管異常？</text><text x="285" y="180" class="b">有：停止負荷，依感染、DVT、動脈／腔室、骨或腫瘤風險轉介</text><rect x="80" y="285" width="300" height="205" rx="14" class="x"/><text x="155" y="330" class="h">骨／SIFK</text><text x="110" y="375" class="b">突然負重痛、夜間痛</text><text x="110" y="415" class="b">早期 X 光可能正常</text><text x="110" y="455" class="b">疑病灶：不跑跳挑釁</text><rect x="450" y="285" width="300" height="205" rx="14" class="x"/><text x="525" y="330" class="h">關節／滑膜</text><text x="480" y="375" class="b">積液、卡住、紅熱</text><text x="480" y="415" class="b">感染與晶體先分流</text><text x="480" y="455" class="b">積液檢查不指出病因</text><rect x="820" y="285" width="300" height="205" rx="14" class="x"/><text x="900" y="330" class="h">膕窩／小腿</text><text x="850" y="375" class="b">Baker 囊腫可像 DVT</text><text x="850" y="415" class="b">Homan sign 不能排除</text><text x="850" y="455" class="b">超音波依臨床風險</text><rect x="190" y="565" width="820" height="105" rx="16" class="g"/><text x="345" y="608" class="h">低風險：建立負重與功能基線、調整負荷、限期複評</text><text x="305" y="647" class="b">若症狀快速改變或未依預期改善，回到上層重新分流</text><text x="320" y="725" class="b">單一特殊檢查或影像所見均不能取代急迫度判斷。</text></svg>
