<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.box{fill:#fff;stroke:#4b6078;stroke-width:3}.warn{fill:#fff1f2;stroke:#be123c;stroke-width:4}.go{fill:#ecfdf5;stroke:#047857;stroke-width:3}.a{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><text x="50" y="55" class="t">急性髕骨脫位／疑骨軟骨傷：初步分流</text><rect x="380" y="90" width="440" height="90" rx="14" class="box"/><text x="425" y="128" class="h">變形、自行復位史或快速積液</text><text x="448" y="158" class="b">停止活動，檢查神經血管</text><path d="M600 180v60" class="a"/><rect x="330" y="240" width="540" height="115" rx="14" class="warn"/><text x="375" y="282" class="h">無法負重／鎖住／伸膝機轉失效</text><text x="385" y="318" class="b">急症或當日醫療評估；不反覆推髕骨</text><path d="M600 355v60" class="a"/><rect x="295" y="415" width="610" height="110" rx="14" class="box"/><text x="350" y="456" class="h">第一次脫位：依醫療端安排影像</text><text x="330" y="493" class="b">X 光與 MRI／MRI alone；排除骨軟骨病灶</text><path d="M600 525v60" class="a"/><rect x="300" y="585" width="600" height="105" rx="14" class="go"/><text x="345" y="627" class="h">限制解除後才進行個別化復健</text><text x="360" y="664" class="b">活動度 → 力量 → 跑跳 → 變向 → 回場</text><text x="45" y="730" class="b">本圖不取代急救、復位、影像或骨科決策。</text></svg>
