<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="45" y="55" class="t">隱匿性肩不穩定：先安全，再判方向與合併病灶</text><rect x="130" y="90" width="940" height="120" rx="16" class="r"/><text x="220" y="135" class="h">固定變形／無法活動、神經血管異常、高能量創傷</text><text x="410" y="178" class="b">停止挑釁，急迫轉介</text><rect x="70" y="270" width="320" height="230" rx="15" class="x"/><text x="135" y="315" class="h">方向與機轉</text><text x="110" y="365" class="b">後向：屈曲＋內收軸向負荷</text><text x="110" y="405" class="b">前向：外展＋外旋創傷</text><text x="110" y="445" class="b">多向：症狀＋鬆弛整合</text><rect x="440" y="270" width="320" height="230" rx="15" class="x"/><text x="505" y="315" class="h">合併病灶</text><text x="480" y="365" class="b">骨缺損、盂唇、HAGL</text><text x="480" y="405" class="b">滑車、肩胛下肌、神經</text><text x="480" y="445" class="b">影像需回答臨床問題</text><rect x="810" y="270" width="320" height="230" rx="15" class="x"/><text x="875" y="315" class="h">能力與需求</text><text x="850" y="365" class="b">活動、力量、本體覺</text><text x="850" y="405" class="b">推拉、投擲、接觸</text><text x="850" y="445" class="b">信心與隔日反應</text><rect x="170" y="565" width="860" height="105" rx="16" class="g"/><text x="360" y="610" class="h">任何單一測試都不能決定診斷或回場</text><text x="275" y="650" class="b">以方向性假說、測試組、影像適應症與分級暴露共同決策</text></svg>
