<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}.w{fill:#fff1f2;stroke:#be123c;stroke-width:4}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="45" y="55" class="t">青少年運動員背痛：先安全，再看生長與負荷</text><rect x="180" y="90" width="840" height="110" rx="15" class="w"/><text x="260" y="132" class="h">創傷／發燒／夜間痛／神經／括約肌／快速畸形？</text><text x="380" y="170" class="b">是：停止負荷，依急迫性轉介</text><rect x="180" y="235" width="840" height="105" rx="15" class="x"/><text x="320" y="275" class="h">成熟度＋近 4–8 週訓練＋睡眠／營養＋症狀行為</text><text x="352" y="310" class="b">單腳過伸與姿勢外觀都不是確診工具</text><rect x="80" y="385" width="310" height="145" rx="14" class="x"/><text x="145" y="425" class="h">局部伸展旋轉痛</text><text x="112" y="465" class="b">椎弓應力／滑脫、關節、肌肉</text><text x="112" y="498" class="b">持續則醫療與影像分流</text><rect x="445" y="385" width="310" height="145" rx="14" class="x"/><text x="520" y="425" class="h">固定後凸／外觀變化</text><text x="478" y="465" class="b">Scheuermann、側彎、骨折</text><text x="478" y="498" class="b">成長與曲線進展需追蹤</text><rect x="810" y="385" width="310" height="145" rx="14" class="x"/><text x="885" y="425" class="h">非特異性負荷型疼痛</text><text x="845" y="465" class="b">保留活動、分階段恢復</text><text x="845" y="498" class="b">記錄當下與隔日反應</text><rect x="190" y="585" width="820" height="85" rx="14" class="g"/><text x="325" y="620" class="h">病灶分流 → 負荷調整 → 容量 → 專項回場</text><text x="355" y="653" class="b">無痛一天不代表已具完整回場容量</text><text x="65" y="725" class="b">本圖不取代急救、兒科／脊柱專科、影像或機構 SOP。</text></svg>
