<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:29px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:15px}.x{fill:#fff;stroke:#52677f;stroke-width:3}.r{fill:#fff1f2;stroke:#be123c;stroke-width:3}</style><text x="40" y="52" class="t">頭部外傷：連續神經監測比單一總分重要</text><g transform="translate(55 105)"><rect width="210" height="360" class="x"/><text x="60" y="42" class="h">時間戳記</text><text x="25" y="90" class="b">受傷／初評／再評</text><text x="25" y="130" class="b">轉送／交班</text><rect x="220" width="210" height="360" class="x"/><text x="275" y="42" class="h">GCS 分項</text><text x="250" y="90" class="b">眼 E｜言語 V｜動作 M</text><text x="250" y="130" class="b">記錄原因與干擾</text><rect x="440" width="210" height="360" class="x"/><text x="500" y="42" class="h">瞳孔</text><text x="470" y="90" class="b">左右大小 mm</text><text x="470" y="130" class="b">反應與新變化</text><rect x="660" width="210" height="360" class="x"/><text x="710" y="42" class="h">四肢／症狀</text><text x="690" y="90" class="b">對稱動作與感覺</text><text x="690" y="130" class="b">頭痛、嘔吐、癲癇</text><rect x="880" width="210" height="360" class="x"/><text x="930" y="42" class="h">生命徵象</text><text x="910" y="90" class="b">呼吸、血壓、脈搏</text><text x="910" y="130" class="b">血氧、體溫、血糖</text></g><rect x="115" y="530" width="970" height="100" rx="15" class="r"/><text x="240" y="570" class="h">任何 GCS 下降、瞳孔新變化、局灶缺損或生命徵象惡化</text><text x="330" y="610" class="b">立即升級 EMS／急診；正常初始紀錄不排除進展性顱內出血。</text><text x="420" y="685" class="b">原創教育表；依所在地醫療系統與專業範圍執行。</text></svg>
