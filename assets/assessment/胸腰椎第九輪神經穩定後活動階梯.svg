<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><rect width="1200" height="700" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:15px}.s1{fill:#dbeafe}.s2{fill:#bfdbfe}.s3{fill:#93c5fd}.s4{fill:#60a5fa}</style><text x="60" y="55" class="t">神經病灶處置後：一次只增加一項活動負荷</text><rect x="80" y="500" width="240" height="110" class="s1"/><rect x="320" y="380" width="240" height="230" class="s2"/><rect x="560" y="245" width="240" height="365" class="s3"/><rect x="800" y="95" width="300" height="515" class="s4"/><text x="125" y="555" class="h">坐姿／轉位</text><text x="375" y="435" class="h">站立／重心轉移</text><text x="620" y="305" class="h">步行／轉身</text><text x="865" y="155" class="h">距離、速度、地面、專項</text><text x="160" y="660" class="h">每階監測：麻弱、平衡、感覺、括約肌、隔日反應；變差即退階與轉介</text></svg>
