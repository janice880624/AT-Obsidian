<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="42" y="55" class="t">足踝回跑、跳躍與末端蹠屈負荷進展</text><g transform="translate(45 115)"><rect width="255" height="190" rx="15" class="x"/><text x="60" y="42" class="h">1 走路與力量</text><text x="25" y="90" class="b">無跛行、無骨性壓痛</text><text x="25" y="130" class="b">提踵與足趾控制</text><text x="25" y="168" class="b">隔日反應穩定</text><rect x="280" width="255" height="190" rx="15" class="x"/><text x="345" y="42" class="h">2 走跑間歇</text><text x="305" y="90" class="b">先平地與總時間</text><text x="305" y="130" class="b">速度、坡度分開調整</text><text x="305" y="168" class="b">保留恢復日</text><rect x="560" width="255" height="190" rx="15" class="x"/><text x="615" y="42" class="h">3 跳躍與轉向</text><text x="585" y="90" class="b">雙腳至單腳</text><text x="585" y="130" class="b">直線至 Figure-of-8</text><text x="585" y="168" class="b">追蹤品質與畏懼</text><rect x="840" width="255" height="190" rx="15" class="x"/><text x="895" y="42" class="h">4 專項與連續日</text><text x="865" y="90" class="b">踢擊／舞蹈／切入</text><text x="865" y="130" class="b">連續訓練後再回場</text><text x="865" y="168" class="b">共享決策</text></g><rect x="145" y="430" width="910" height="150" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="455" y="470" class="h">每階段共同監測</text><text x="205" y="520" class="b">熟悉症狀｜局部骨性壓痛｜步態與動作品質｜當下及 24 小時反應</text><text x="205" y="558" class="b">一次主調一項負荷；單一功能測試或側對稱不等於回場許可</text><rect x="155" y="625" width="890" height="50" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="205" y="657" class="b">骨痛回來、跛行、休息／夜痛、腫脹或神經血管變化：停止並重新分流。</text></svg>
