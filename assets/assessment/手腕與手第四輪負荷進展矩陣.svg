<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="45" y="55" class="t">手腕與手負荷進展：從安全到握持、承重與專項</text><g transform="translate(55 115)"><rect width="250" height="175" rx="15" class="x"/><text x="58" y="42" class="h">1 安全與對位</text><text x="25" y="88" class="b">骨折／脫位／肌腱已排除</text><text x="25" y="125" class="b">神經血管穩定</text><text x="25" y="158" class="b">活動與症狀基線</text><rect x="275" width="250" height="175" rx="15" class="x"/><text x="335" y="42" class="h">2 局部容量</text><text x="300" y="88" class="b">腕屈伸、偏移、旋轉</text><text x="300" y="125" class="b">握捏與手內在肌</text><text x="300" y="158" class="b">隔日反應穩定</text><rect x="550" width="250" height="175" rx="15" class="x"/><text x="610" y="42" class="h">3 功能耐力</text><text x="575" y="88" class="b">不同握徑、持續握</text><text x="575" y="125" class="b">精細任務與低負荷承重</text><text x="575" y="158" class="b">速度與疲勞控制</text><rect x="825" width="250" height="175" rx="15" class="x"/><text x="875" y="42" class="h">4 專項回場</text><text x="850" y="88" class="b">球拍、把手、攀爬或碰撞</text><text x="850" y="125" class="b">時長、速度與連續訓練</text><text x="850" y="158" class="b">共享決策與負荷監測</text></g><rect x="150" y="395" width="900" height="175" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="470" y="438" class="h">共同通關條件</text><text x="190" y="486" class="b">症狀可控｜動作品質穩定｜隔日回基線｜神經血管無惡化</text><text x="190" y="530" class="b">整合個人基線、組織癒合、任務需求與心理準備</text><rect x="165" y="625" width="870" height="50" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="245" y="657" class="b">左右對稱、單次特殊檢查或無痛握力，都不足以獨立決定回場。</text></svg>
