<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="50" y="55" class="t">手腕與手隱匿骨折／開放傷：先停、護、查、轉</text><rect x="110" y="100" width="980" height="120" rx="18" class="r"/><text x="190" y="145" class="h">甲根出血／骨性壓痛／關節階差／手冷麻弱／高能量或反覆承重？</text><text x="330" y="187" class="b">停止挑釁，移除戒指，乾淨覆蓋與原位支托</text><rect x="90" y="295" width="460" height="250" rx="18" class="x"/><text x="190" y="340" class="h">急性創傷或開放傷</text><text x="135" y="395" class="b">神經血管＋傷口／甲板＋旋轉與對位</text><text x="135" y="440" class="b">正斜側位影像；必要時 CT／專科</text><text x="135" y="485" class="b">不拔甲、不復位、不用握力證明安全</text><rect x="650" y="295" width="460" height="250" rx="18" class="x"/><text x="750" y="340" class="h">漸進負荷相關骨痛</text><text x="695" y="395" class="b">量化週負荷、增幅與骨健康風險</text><text x="695" y="440" class="b">初始 X 光正常仍不能排除</text><text x="695" y="485" class="b">停止承重並安排 MRI／CT 醫療判斷</text><rect x="225" y="610" width="750" height="85" rx="16" class="g"/><text x="335" y="662" class="h">能活動、傷口小或影像初看正常，都不等於安全</text></svg>
