<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="42" y="55" class="t">前骨盆／腹股溝痛：先排急症，再建立多重假設</text><rect x="100" y="90" width="1000" height="115" rx="16" class="r"/><text x="185" y="135" class="h">無法負重、發燒、急腹、痛性腫塊、睪丸急痛、骨高風險或運動無力？</text><text x="340" y="175" class="b">有：停止挑釁，依急迫度轉送、影像、檢驗或專科</text><rect x="55" y="270" width="255" height="210" rx="14" class="x"/><text x="95" y="315" class="h">骨／恥骨</text><text x="80" y="360" class="b">走路痛、跑量增加</text><text x="80" y="400" class="b">能量與骨健康</text><text x="80" y="440" class="b">疑骨傷不跳測</text><rect x="335" y="270" width="255" height="210" rx="14" class="x"/><text x="375" y="315" class="h">腹壁／腹股溝</text><text x="360" y="360" class="b">跑踢、腹壓與腫塊</text><text x="360" y="400" class="b">真正疝先鑑別</text><text x="360" y="440" class="b">術語不等於確診</text><rect x="615" y="270" width="255" height="210" rx="14" class="x"/><text x="675" y="315" class="h">髖／肌腱</text><text x="640" y="360" class="b">Doha 可多重分類</text><text x="640" y="400" class="b">觸診＋阻力＋髖 ROM</text><text x="640" y="440" class="b">單一擠壓不確診</text><rect x="895" y="270" width="255" height="210" rx="14" class="x"/><text x="955" y="315" class="h">感覺神經</text><text x="920" y="360" class="b">前外側大腿純感覺</text><text x="920" y="400" class="b">有無力需改定位</text><text x="920" y="440" class="b">腰椎與股神經鑑別</text><rect x="170" y="555" width="860" height="105" rx="16" class="g"/><text x="325" y="598" class="h">低風險：建立功能基線、調整負荷、限期複評</text><text x="255" y="638" class="b">症狀換區、負重惡化或未依預期改善時，回到最上層重新分流</text><text x="230" y="720" class="b">特殊檢查與影像只調整機率，不取代病史、急迫度與追蹤。</text></svg>
