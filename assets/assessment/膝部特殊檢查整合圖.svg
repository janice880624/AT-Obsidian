<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" rx="32" fill="#f8fafc"/><text x="60" y="64" font-size="34" font-family="sans-serif" font-weight="700" fill="#17324d">膝部特殊檢查：測試組合改變機率，不單獨確診</text>
<g font-family="sans-serif"><rect x="60" y="115" width="500" height="175" rx="22" fill="#e8f1f7" stroke="#3b6d8c" stroke-width="4"/><text x="90" y="160" font-size="28" font-weight="700" fill="#17324d">ACL 假設</text><text x="90" y="205" font-size="23" fill="#17324d">機轉、啪聲、快速積血、膝軟</text><text x="90" y="245" font-size="23" fill="#17324d">Lachman＋其他適當測試＋必要影像</text>
<rect x="640" y="115" width="500" height="175" rx="22" fill="#f1e9fb" stroke="#7e57c2" stroke-width="4"/><text x="670" y="160" font-size="28" font-weight="700" fill="#4d2b78">半月板假設</text><text x="670" y="205" font-size="23" fill="#4d2b78">扭轉、關節線痛、積液、卡住</text><text x="670" y="245" font-size="23" fill="#4d2b78">McMurray／Thessaly＋活動度＋必要影像</text>
<path d="M310 290V375H600" stroke="#3b6d8c" stroke-width="5" fill="none"/><path d="M890 290V375H600" stroke="#7e57c2" stroke-width="5" fill="none"/><rect x="330" y="375" width="540" height="150" rx="24" fill="#fff1cc" stroke="#d4a72c" stroke-width="4"/><text x="600" y="425" text-anchor="middle" font-size="27" font-weight="700" fill="#704f00">整合判讀</text><text x="600" y="468" text-anchor="middle" font-size="23" fill="#704f00">病史＋基礎檢查＋測試品質＋研究族群</text><text x="600" y="505" text-anchor="middle" font-size="23" fill="#704f00">陽性／陰性皆需考慮限制與替代診斷</text>
<path d="M600 525V590" stroke="#d4a72c" stroke-width="5"/><rect x="255" y="590" width="690" height="100" rx="22" fill="#e7f4e4" stroke="#4f8b4a" stroke-width="4"/><text x="600" y="632" text-anchor="middle" font-size="25" fill="#245c26">決策：再評估、保護與復健、醫師轉介或影像</text><text x="600" y="670" text-anchor="middle" font-size="21" fill="#245c26">依紅旗、機械性卡住、功能與個案目標決定</text></g></svg>