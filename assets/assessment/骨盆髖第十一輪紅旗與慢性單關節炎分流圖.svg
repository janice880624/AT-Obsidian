<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">骨盆痛與慢性單關節髖炎安全分流</title><desc id="d"><g font-family="sans-serif"><rect x="80" y="140" width="1040" height="90" rx="20" fill="#eaf0f8"/><text x="120" y="195" font-size="27" fill="#183153">持續／夜間骨盆痛、腫塊，或數週至數月單關節髖炎</text><path d="M600 230 V285" stroke="#496987" stroke-width="5"/><polygon points="590,280 610,280 600,300" fill="#496987"/><rect x="80" y="300" width="480" height="190" rx="20" fill="#fff0f0" stroke="#c94848" stroke-width="3"/><text x="115" y="345" font-size="25" font-weight="700" fill="#8b2424">立即／急迫轉介</text><text x="115" y="390" font-size="21" fill="#4a2525">病理性骨折、無法負重、新麻弱</text><text x="115" y="425" font-size="21" fill="#4a2525">全身不穩、快速惡化、急性感染疑慮</text><rect x="640" y="300" width="480" height="190" rx="20" fill="#eff8f1" stroke="#3e8b5c" stroke-width="3"/><text x="675" y="345" font-size="25" font-weight="700" fill="#27633f">穩定但非典型</text><text x="675" y="390" font-size="21" fill="#234">停止高負荷與侵入性處置</text><text x="675" y="425" font-size="21" fill="#234">影像＋專科；感染需組織／關節液檢驗</text><text x="155" y="555" font-size="22" fill="#526477">單一紅旗、誘發測試或陰性檢驗都不能獨立確診或排除</text></g></desc>
<rect width="1200" height="675" fill="#ffffff"/><text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700" fill="#132238">骨盆痛與慢性單關節髖炎安全分流</text>
<line x1="60" y1="95" x2="1140" y2="95" stroke="#d7dee8" stroke-width="3"/>
<g font-family="sans-serif"><rect x="80" y="140" width="1040" height="90" rx="20" fill="#eaf0f8"/><text x="120" y="195" font-size="27" fill="#183153">持續／夜間骨盆痛、腫塊，或數週至數月單關節髖炎</text><path d="M600 230 V285" stroke="#496987" stroke-width="5"/><polygon points="590,280 610,280 600,300" fill="#496987"/><rect x="80" y="300" width="480" height="190" rx="20" fill="#fff0f0" stroke="#c94848" stroke-width="3"/><text x="115" y="345" font-size="25" font-weight="700" fill="#8b2424">立即／急迫轉介</text><text x="115" y="390" font-size="21" fill="#4a2525">病理性骨折、無法負重、新麻弱</text><text x="115" y="425" font-size="21" fill="#4a2525">全身不穩、快速惡化、急性感染疑慮</text><rect x="640" y="300" width="480" height="190" rx="20" fill="#eff8f1" stroke="#3e8b5c" stroke-width="3"/><text x="675" y="345" font-size="25" font-weight="700" fill="#27633f">穩定但非典型</text><text x="675" y="390" font-size="21" fill="#234">停止高負荷與侵入性處置</text><text x="675" y="425" font-size="21" fill="#234">影像＋專科；感染需組織／關節液檢驗</text><text x="155" y="555" font-size="22" fill="#526477">單一紅旗、誘發測試或陰性檢驗都不能獨立確診或排除</text></g>
<text x="60" y="640" font-family="sans-serif" font-size="18" fill="#526477">教育示意圖｜不取代影像、診斷或專科評估</text></svg>
