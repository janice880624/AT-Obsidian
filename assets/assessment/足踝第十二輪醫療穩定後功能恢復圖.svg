<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650"><rect width="1200" height="650" fill="#f8fafc"/><text x="55" y="65" font-family="sans-serif" font-size="34">人工踝醫療穩定後功能恢復</text><g font-family="sans-serif" font-size="22" text-anchor="middle"><rect x="55" y="170" width="245" height="120" rx="18" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/><rect x="340" y="170" width="245" height="120" rx="18" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/><rect x="625" y="170" width="245" height="120" rx="18" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/><rect x="910" y="170" width="245" height="120" rx="18" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/><text x="177" y="220">感染／骨／組件</text><text x="177" y="255">傷口均穩定</text><text x="462" y="220">活動與步態</text><text x="462" y="255">低負荷肌力</text><text x="747" y="220">提踵、階梯</text><text x="747" y="255">平衡與耐力</text><text x="1032" y="220">騎游跑或工作</text><text x="1032" y="255">個別化回場</text><path d="M300 230 H340 M585 230 H625 M870 230 H910" stroke="#334155" stroke-width="5"/><rect x="170" y="390" width="860" height="130" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="600" y="440">監測：發燒滲液｜新發變形／卡住／打軟｜麻弱｜隔日負重反應</text><text x="600" y="485">任何紅旗 → 停止並回足踝置換專科</text></g></svg>