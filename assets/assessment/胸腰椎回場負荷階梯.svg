<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">胸腰椎回場負荷階梯</title><desc id="desc">由安全與基準，進展至搬舉、單側負重及項目特異訓練的回場階梯。</desc>
  <rect width="1200" height="760" fill="#f8fafc"/><text x="55" y="58" font-family="sans-serif" font-size="34" font-weight="700">胸腰椎回場負荷階梯</text>
  <g font-family="sans-serif" font-size="22"><rect x="90" y="560" width="240" height="110" rx="18" fill="#fee2e2"/><text x="120" y="600" font-weight="700">1 安全與基準</text><text x="120" y="634">紅旗、神經、限制</text>
  <rect x="300" y="440" width="260" height="110" rx="18" fill="#ffedd5"/><text x="330" y="480" font-weight="700">2 動作控制</text><text x="330" y="514">呼吸、髖膝、低負荷</text>
  <rect x="530" y="320" width="260" height="110" rx="18" fill="#fef9c3"/><text x="560" y="360" font-weight="700">3 任務耐受</text><text x="560" y="394">重複彎腰與搬舉</text>
  <rect x="760" y="200" width="270" height="110" rx="18" fill="#dcfce7"/><text x="790" y="240" font-weight="700">4 多方向負荷</text><text x="790" y="274">單側提重、走跑旋轉</text>
  <rect x="910" y="80" width="250" height="110" rx="18" fill="#dbeafe"/><text x="940" y="120" font-weight="700">5 項目暴露</text><text x="940" y="154">速度、體積、碰撞</text></g>
  <path d="M130 700 C420 630 650 420 1080 185" fill="none" stroke="#4f46e5" stroke-width="8" stroke-dasharray="18 12"/>
  <text x="600" y="724" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#312e81">每階段觀察當下與 24 小時反應；沒有單一通關值</text>
</svg>

