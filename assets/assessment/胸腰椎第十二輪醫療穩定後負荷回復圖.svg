<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><rect width="1200" height="700" fill="#f8fafc"/><text x="55" y="62" font-family="sans-serif" font-size="33">胸腰椎醫療穩定後：一次只增加一種負荷</text><g font-family="sans-serif" font-size="21" text-anchor="middle"><g fill="#e0f2fe" stroke="#0369a1" stroke-width="4"><rect x="55" y="150" width="205" height="120" rx="18"/><rect x="280" y="150" width="205" height="120" rx="18"/><rect x="505" y="150" width="205" height="120" rx="18"/><rect x="730" y="150" width="205" height="120" rx="18"/><rect x="955" y="150" width="190" height="120" rx="18"/></g><text x="158" y="198">症狀與檢驗</text><text x="158" y="235">神經均穩定</text><text x="382" y="198">無痛活動</text><text x="382" y="235">步行與呼吸</text><text x="608" y="198">抗屈伸旋轉</text><text x="608" y="235">低負荷耐力</text><text x="832" y="198">軸向負荷</text><text x="832" y="235">跑跳舉重</text><text x="1050" y="198">碰撞／專項</text><text x="1050" y="235">完整回場</text><path d="M260 210 H280 M485 210 H505 M710 210 H730 M935 210 H955" stroke="#334155" stroke-width="5"/><rect x="135" y="370" width="930" height="175" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="600" y="420">每階監測</text><text x="600" y="465">腿痛麻弱 ｜ 姿勢性頭痛 ｜ 深色尿／少尿 ｜ 夜間痛 ｜ 隔日反應</text><text x="600" y="510">紅旗或症狀反彈 → 停止、回退並重新醫療評估</text></g><text x="55" y="655" font-family="sans-serif" font-size="18" fill="#475569">原創示意圖｜不取代骨傷、神經、腎臟或硬膜治療限制｜CC BY 4.0</text></svg>