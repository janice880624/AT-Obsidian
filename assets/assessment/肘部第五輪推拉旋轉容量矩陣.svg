<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="45" y="55" class="t">肘部推拉旋轉容量：由局部控制到專項速度</text><g transform="translate(55 115)"><rect width="250" height="180" rx="15" class="x"/><text x="70" y="42" class="h">1 安全基線</text><text x="25" y="88" class="b">紅旗與結構癒合已處理</text><text x="25" y="128" class="b">活動與神經血管穩定</text><rect x="275" width="250" height="180" rx="15" class="x"/><text x="335" y="42" class="h">2 局部容量</text><text x="300" y="88" class="b">腕屈伸、旋轉、握力</text><text x="300" y="128" class="b">角度與隔日反應可控</text><rect x="550" width="250" height="180" rx="15" class="x"/><text x="615" y="42" class="h">3 複合任務</text><text x="575" y="88" class="b">水平推拉、搬運、承重</text><text x="575" y="128" class="b">肩胛與軀幹協調</text><rect x="825" width="250" height="180" rx="15" class="x"/><text x="880" y="42" class="h">4 專項速度</text><text x="850" y="88" class="b">投擲／球拍／工具任務</text><text x="850" y="128" class="b">總量與連續暴露進展</text></g><rect x="150" y="405" width="900" height="170" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="475" y="447" class="h">每一階段都記錄</text><text x="210" y="495" class="b">負荷｜次數或時間｜角度｜熟悉症狀｜動作品質｜隔日反應</text><text x="255" y="535" class="b">一次主要增加一個變項，避免重量、速度與總量同時上升</text><rect x="165" y="625" width="870" height="50" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="255" y="657" class="b">左右對稱、單次無痛或單一特殊檢查，皆不足以獨立決定回場。</text></svg>
