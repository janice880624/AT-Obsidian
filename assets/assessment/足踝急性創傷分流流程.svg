<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">足踝急性創傷分流流程</title>
  <desc id="desc">由紅旗與神經血管、骨折影像條件、肌腱與韌帶鑑別到追蹤的流程</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#49657a"/></marker></defs>
  <rect width="1100" height="620" fill="#f8fbfd"/>
  <text x="45" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#18364a">足踝急性創傷：先安全，再分類</text>
  <g font-family="sans-serif" font-size="20" text-anchor="middle">
    <rect x="370" y="82" width="360" height="68" rx="14" fill="#dceef7" stroke="#527f98" stroke-width="2"/>
    <text x="550" y="112">急性足踝創傷</text><text x="550" y="137">機轉、外觀、皮膚、神經血管</text>
    <rect x="55" y="205" width="295" height="95" rx="14" fill="#fde7e7" stroke="#b64a4a" stroke-width="2"/>
    <text x="202" y="236">紅旗／變形／開放傷</text><text x="202" y="263">循環或進行性神經異常</text><text x="202" y="288">→ 緊急轉介</text>
    <rect x="402" y="205" width="295" height="95" rx="14" fill="#fff1d6" stroke="#c58a27" stroke-width="2"/>
    <text x="550" y="236">無立即紅旗</text><text x="550" y="263">評估 Ottawa 適用性</text><text x="550" y="288">及全足骨性壓痛</text>
    <rect x="750" y="205" width="295" height="95" rx="14" fill="#e8f3e8" stroke="#4d8d57" stroke-width="2"/>
    <text x="897" y="236">跟腱輪廓／休息位</text><text x="897" y="263">Simmonds-Thompson</text><text x="897" y="288">疑斷裂 → 保護與轉介</text>
    <rect x="245" y="380" width="275" height="90" rx="14" fill="#fff1d6" stroke="#c58a27" stroke-width="2"/>
    <text x="382" y="412">Ottawa 陽性或</text><text x="382" y="440">未涵蓋骨傷可疑 → 影像</text>
    <rect x="580" y="380" width="275" height="90" rx="14" fill="#e5eff8" stroke="#527f98" stroke-width="2"/>
    <text x="717" y="412">骨折風險降低後</text><text x="717" y="440">再做韌帶、肌腱與功能評估</text>
    <rect x="402" y="520" width="295" height="65" rx="14" fill="#ece7f7" stroke="#705a9b" stroke-width="2"/>
    <text x="550" y="548">症狀與恢復不符預期</text><text x="550" y="574">→ 再評估／進一步影像</text>
  </g>
  <g stroke="#49657a" stroke-width="3" fill="none" marker-end="url(#a)">
    <path d="M550 150 L202 205"/><path d="M550 150 L550 205"/><path d="M550 150 L897 205"/>
    <path d="M500 300 L405 380"/><path d="M600 300 L695 380"/><path d="M382 470 L510 520"/><path d="M717 470 L590 520"/>
  </g>
  <text x="45" y="602" font-family="sans-serif" font-size="17" fill="#5d6d7e">此圖不取代急救、復位、影像或機構 SOP；Ottawa 規則不是全足踝排除工具。</text>
</svg>
