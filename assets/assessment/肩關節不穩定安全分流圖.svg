<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:18px}.box{fill:#fff;stroke:#52677f;stroke-width:3}.warn{fill:#fff1f2;stroke:#be123c;stroke-width:4}.go{fill:#ecfdf5;stroke:#047857;stroke-width:3}.a{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><text x="45" y="55" class="t">肩關節不穩定：安全分流與方向判讀</text><rect x="245" y="90" width="710" height="105" rx="14" class="warn"/><text x="318" y="132" class="h">變形／疑骨折／缺血／進行性神經缺損？</text><text x="385" y="170" class="b">是：停止測試，保護並依急症流程轉介</text><path d="M600 195v48" class="a"/><rect x="245" y="245" width="710" height="105" rx="14" class="box"/><text x="350" y="287" class="h">確認事件、方向、復位、復發與症狀</text><text x="337" y="324" class="b">疼痛、滑脫感、恐懼、麻木與無力分開記錄</text><path d="M600 350v48" class="a"/><rect x="170" y="400" width="360" height="145" rx="14" class="box"/><text x="250" y="440" class="h">被動鬆弛</text><text x="207" y="478" class="b">位移大但無熟悉症狀</text><text x="205" y="515" class="b">可為正常／全身性鬆弛</text><rect x="670" y="400" width="360" height="145" rx="14" class="box"/><text x="748" y="440" class="h">症狀性不穩定</text><text x="710" y="478" class="b">方向特定失控或恐懼</text><text x="700" y="515" class="b">整合骨缺損、神經與功能</text><path d="M350 545v55M850 545v55" class="a"/><rect x="225" y="600" width="750" height="95" rx="14" class="go"/><text x="338" y="640" class="h">建立基線 → 動態控制 → 漸進運動暴露</text><text x="330" y="676" class="b">單一 sulcus sign 或固定週數不能決定診斷／回場</text><text x="55" y="738" class="b">本圖不取代復位、影像、骨科決策或機構急救 SOP。</text></svg>
