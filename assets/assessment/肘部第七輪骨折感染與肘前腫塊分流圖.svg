<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="45" y="55" class="t">急性肘痛：先辨識骨折、感染與肘前腫塊紅旗</text><rect x="140" y="90" width="920" height="110" rx="16" class="r"/><text x="230" y="132" class="h">開放傷／變形／手冷脈弱／進行性麻弱／敗血症？</text><text x="425" y="170" class="b">停止挑釁並立即轉介</text><rect x="55" y="255" width="330" height="245" rx="15" class="x"/><text x="125" y="298" class="h">創傷與骨性痛</text><text x="90" y="350" class="b">支托＋神經血管</text><text x="90" y="390" class="b">X 光起始；必要時 CT</text><text x="90" y="430" class="b">兒少搜尋骨骺與合併傷</text><rect x="435" y="255" width="330" height="245" rx="15" class="x"/><text x="505" y="298" class="h">紅熱腫脹</text><text x="470" y="350" class="b">無發燒不能排除感染</text><text x="470" y="390" class="b">同日醫療端抽液／培養</text><text x="470" y="430" class="b">不按摩、不自行注射</text><rect x="815" y="255" width="330" height="245" rx="15" class="x"/><text x="885" y="298" class="h">肘前腫塊／旋轉痛</text><text x="850" y="350" class="b">滑囊？肌腱？神經？血管？</text><text x="850" y="390" class="b">先排紅旗，再選超音波／MRI</text><text x="850" y="430" class="b">特殊檢查不等於病因確認</text><rect x="175" y="570" width="850" height="105" rx="16" class="g"/><text x="300" y="612" class="h">記錄時間、神經血管、影像／抽液適應症與追蹤</text><text x="305" y="650" class="b">疼痛下降不是已排除骨折、感染或腫塊病因</text></svg>
