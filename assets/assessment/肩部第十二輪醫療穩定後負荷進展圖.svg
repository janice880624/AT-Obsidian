<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><rect width="1200" height="700" fill="#f8fafc"/><text x="60" y="65" font-family="sans-serif" font-size="34">肩部周邊神經與局部關節：醫療穩定後負荷進展</text><g font-family="sans-serif" font-size="21" text-anchor="middle"><g fill="#e0f2fe" stroke="#0369a1" stroke-width="4"><rect x="60" y="155" width="200" height="125" rx="18"/><rect x="285" y="155" width="200" height="125" rx="18"/><rect x="510" y="155" width="200" height="125" rx="18"/><rect x="735" y="155" width="200" height="125" rx="18"/><rect x="960" y="155" width="180" height="125" rx="18"/></g><text x="160" y="205">關節／骨安全</text><text x="160" y="240">神經趨勢穩定</text><text x="385" y="205">輔助活動</text><text x="385" y="240">低強度等長</text><text x="610" y="205">外旋與抬舉</text><text x="610" y="240">肩胛控制</text><text x="835" y="205">牆面到地面</text><text x="835" y="240">推撐負荷</text><text x="1050" y="205">過頭／投擲</text><text x="1050" y="240">工作回場</text><path d="M260 220 H285 M485 220 H510 M710 220 H735 M935 220 H960" stroke="#334155" stroke-width="5"/><rect x="145" y="385" width="910" height="170" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="600" y="435">每階同步監測</text><text x="600" y="480">肌萎縮／力量 ｜ 麻木 ｜ 滑移 ｜ 肩頂壓縮痛 ｜ 24 小時反應</text><text x="600" y="525">進展無力、無脈冰冷或重新脫臼 → 立即停止並評估</text></g><text x="60" y="655" font-family="sans-serif" font-size="19" fill="#475569">原創示意圖｜不取代復位、手術或神經專科限制｜CC BY 4.0</text></svg>