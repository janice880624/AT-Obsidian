<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="620" viewBox="0 0 1050 620" role="img" aria-labelledby="title desc">
  <title id="title">頭頸重大紅旗圖</title>
  <desc id="desc">顱內、頸椎脊髓與頸部血管三類重大紅旗的分流提醒</desc>
  <rect width="1050" height="620" fill="#f8fbfd"/>
  <text x="40" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#18364a">頭頸創傷：三條不能漏掉的紅旗路徑</text>
  <g font-family="sans-serif">
    <rect x="55" y="105" width="295" height="385" rx="20" fill="#fde9e9" stroke="#b64a4a" stroke-width="3"/>
    <text x="202" y="148" font-size="24" font-weight="700" text-anchor="middle" fill="#8d3333">顱內／顱骨</text>
    <g font-size="20" fill="#4b2b2b"><text x="85" y="195">• 意識下降或 GCS 惡化</text><text x="85" y="235">• 反覆嘔吐、加劇頭痛</text><text x="85" y="275">• 抽搐、瞳孔不等大</text><text x="85" y="315">• 局部神經缺損</text><text x="85" y="355">• 顱底／凹陷骨折徵象</text></g>
    <rect x="377" y="105" width="295" height="385" rx="20" fill="#fff2dc" stroke="#c58a27" stroke-width="3"/>
    <text x="524" y="148" font-size="24" font-weight="700" text-anchor="middle" fill="#8b621f">頸椎／脊髓</text>
    <g font-size="20" fill="#4b3a20"><text x="407" y="195">• 高風險機轉或變形</text><text x="407" y="235">• 後正中壓痛</text><text x="407" y="275">• 雙側肢體症狀</text><text x="407" y="315">• 無力、感覺或步態異常</text><text x="407" y="355">• 呼吸或自主神經改變</text></g>
    <rect x="700" y="105" width="295" height="385" rx="20" fill="#e9edf8" stroke="#6e63a5" stroke-width="3"/>
    <text x="847" y="148" font-size="24" font-weight="700" text-anchor="middle" fill="#514582">頸動脈／椎動脈</text>
    <g font-size="20" fill="#332d55"><text x="730" y="195">• 異常或突發頭頸痛</text><text x="730" y="235">• 複視、說話／吞嚥困難</text><text x="730" y="275">• 顏面／肢體缺損</text><text x="730" y="315">• Horner 或共濟失調</text><text x="730" y="355">• 症狀可延遲出現</text></g>
    <rect x="150" y="525" width="750" height="58" rx="14" fill="#18364a"/>
    <text x="525" y="561" font-size="23" font-weight="700" text-anchor="middle" fill="white">任一路徑可疑：停止一般測試／手法，保護並緊急轉介</text>
  </g>
  <g stroke="#596e7c" stroke-width="3"><line x1="202" y1="490" x2="390" y2="525"/><line x1="524" y1="490" x2="524" y2="525"/><line x1="847" y1="490" x2="660" y2="525"/></g>
  <text x="40" y="608" font-family="sans-serif" font-size="17" fill="#5d6d7e">紅旗清單不能單獨排除傷害；應結合機轉、序列神經檢查與醫院影像。</text>
</svg>
