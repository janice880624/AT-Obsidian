<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="40" y="55" class="t">胸腰椎神經症狀：先辨識進行性脊髓／馬尾風險</text><rect x="120" y="95" width="960" height="115" rx="16" class="r"/><text x="205" y="140" class="h">進行性無力、步態惡化、鞍區麻木或括約肌改變？</text><text x="475" y="180" class="b">停止測試並急迫轉介</text><rect x="85" y="290" width="300" height="220" rx="16" class="x"/><text x="125" y="330" class="h">神經定位</text><text x="120" y="375" class="b">肌力、反射、感覺平面</text><text x="120" y="420" class="b">病理反射、步態、平衡</text><rect x="450" y="290" width="300" height="220" rx="16" class="x"/><text x="510" y="330" class="h">病因風險</text><text x="495" y="375" class="b">創傷、感染、腫瘤</text><text x="495" y="420" class="b">類固醇、代謝、僵直脊柱</text><rect x="815" y="290" width="300" height="220" rx="16" class="x"/><text x="870" y="330" class="h">醫療端確認</text><text x="850" y="375" class="b">MRI／CT 依假設選擇</text><text x="850" y="420" class="b">影像須與症狀整合</text><rect x="190" y="590" width="820" height="80" rx="16" class="g"/><text x="285" y="640" class="h">單一特殊檢查或疼痛程度不能排除神經壓迫</text></svg>
