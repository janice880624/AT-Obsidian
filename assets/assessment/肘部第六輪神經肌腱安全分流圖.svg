<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="45" y="55" class="t">肘部神經—肌腱症狀：先安全，再定位功能問題</text><rect x="145" y="90" width="910" height="110" rx="16" class="r"/><text x="240" y="132" class="h">進行性無力／萎縮、手冷脈弱、急性創傷、紅熱發燒？</text><text x="420" y="170" class="b">停止挑釁並急迫轉介</text><rect x="65" y="255" width="320" height="245" rx="15" class="x"/><text x="135" y="298" class="h">內側彈響</text><text x="100" y="350" class="b">尺神經？肱三頭肌？</text><text x="100" y="390" class="b">前臂皮神經？UCL？</text><text x="100" y="435" class="b">動態超音波可協助</text><rect x="440" y="255" width="320" height="245" rx="15" class="x"/><text x="510" y="298" class="h">肘前抓拉痛</text><text x="475" y="350" class="b">部分撕裂？肌腱病？</text><text x="475" y="390" class="b">完全斷裂？滑囊？</text><text x="475" y="435" class="b">測試組＋必要影像</text><rect x="815" y="255" width="320" height="245" rx="15" class="x"/><text x="885" y="298" class="h">純運動捏力差</text><text x="850" y="350" class="b">AIN？肌腱斷裂？</text><text x="850" y="390" class="b">近端正中／頸／中樞？</text><text x="850" y="435" class="b">完整神經與肌腱檢查</text><rect x="165" y="570" width="870" height="105" rx="16" class="g"/><text x="330" y="612" class="h">結構移位與特殊檢查都不是單獨診斷</text><text x="275" y="650" class="b">症狀時間、功能缺損、全鏈檢查、影像適應症與追蹤共同判讀</text></svg>
