<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="55" y="55" class="t">胸腰背痛合併神經變化：病灶層級安全分流</text><rect x="115" y="90" width="970" height="105" rx="18" class="r"/><text x="245" y="135" class="h">新發／進展無力、感覺平面、尿滯留或會陰麻木？</text><text x="425" y="175" class="b">停止負荷、記錄時間、急迫轉介</text><rect x="65" y="270" width="330" height="250" rx="18" class="x"/><text x="135" y="315" class="h">胸髓長傳導徑</text><text x="100" y="370" class="b">痙攣、病理反射、感覺平面</text><text x="100" y="410" class="b">硬膜、蛛網膜或髓內病灶</text><rect x="435" y="270" width="330" height="250" rx="18" class="x"/><text x="520" y="315" class="h">圓錐／馬尾</text><text x="470" y="370" class="b">鞍區、括約肌、多根症狀</text><text x="470" y="410" class="b">牽繫或急性壓迫需區分</text><rect x="805" y="270" width="330" height="250" rx="18" class="x"/><text x="880" y="315" class="h">薦神經根袖</text><text x="840" y="370" class="b">薦皮節痛與泌尿症狀</text><text x="840" y="410" class="b">囊腫影像不等於症狀來源</text><rect x="180" y="600" width="840" height="85" rx="18" class="g"/><text x="270" y="652" class="h">床邊檢查定位與分流；MRI 與專科確認病因</text></svg>
