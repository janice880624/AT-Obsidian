<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="40" y="55" class="t">手腕創傷：初始 X 光陰性仍需安全分流</text><rect x="135" y="95" width="930" height="105" rx="16" class="r"/><text x="225" y="138" class="h">開放傷／變形／手冷脈弱／進行性麻弱／高能量？</text><text x="465" y="175" class="b">立即轉介</text><rect x="80" y="270" width="300" height="220" rx="16" class="x"/><text x="135" y="310" class="h">局部骨性痛＋相符機轉</text><text x="120" y="360" class="b">保護、支托、停止承重</text><text x="120" y="405" class="b">記錄精確痛區與神經血管</text><rect x="450" y="270" width="300" height="220" rx="16" class="x"/><text x="520" y="310" class="h">X 光陰性／不確定</text><text x="490" y="360" class="b">不能以單一測試排除</text><text x="490" y="405" class="b">依疑似骨選重複片、CT 或 MRI</text><rect x="820" y="270" width="300" height="220" rx="16" class="x"/><text x="890" y="310" class="h">明確複評計畫</text><text x="860" y="360" class="b">影像、專科與癒合追蹤</text><text x="860" y="405" class="b">再進展握力與承重</text><rect x="175" y="575" width="850" height="95" rx="16" class="g"/><text x="285" y="620" class="h">第一次影像正常，不等於已排除腕骨骨折</text><text x="355" y="653" class="b">疼痛下降也不能取代骨癒合判定</text></svg>
