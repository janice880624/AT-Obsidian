<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.box{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="45" y="55" class="t">肘部第三輪：症狀、檢查與負荷決策矩陣</text><g transform="translate(65 110)"><rect width="315" height="190" rx="14" class="box"/><text x="62" y="42" class="h">麻刺／精細動作下降</text><text x="35" y="82" class="b">尺側：尺神經於肘部</text><text x="35" y="116" class="b">無感覺＋OK sign 無力：AIN</text><text x="35" y="150" class="b">進行性萎縮 → 快速轉介</text><rect x="375" width="315" height="190" rx="14" class="box"/><text x="445" y="42" class="h">後肘爆裂／伸肘無力</text><text x="405" y="82" class="b">肱三頭肌腱＋鷹嘴骨折</text><text x="405" y="116" class="b">能伸直仍不排除部分撕裂</text><text x="405" y="150" class="b">避免反覆最大阻力測試</text><rect x="750" width="315" height="190" rx="14" class="box"/><text x="825" y="42" class="h">卡鎖／伸直缺損</text><text x="785" y="82" class="b">OCD、游離體、VEOS</text><text x="785" y="116" class="b">持續機械症狀 → 影像</text><text x="785" y="150" class="b">單一測試不能確診</text></g><g transform="translate(155 380)"><rect width="890" height="185" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="315" y="42" class="h">負荷進展的共同條件</text><text x="55" y="85" class="b">① 無紅旗、無進行性神經缺損，病灶與骨骼成熟度已適當分流</text><text x="55" y="123" class="b">② 活動度、力量、動作品質及隔日反應維持可接受</text><text x="55" y="161" class="b">③ 從局部負荷整合肩帶、軀幹、下肢，再回到真實投擲／推撐需求</text></g><rect x="80" y="620" width="1040" height="55" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="155" y="654" class="b">青少年帶痛投擲、機械卡鎖或進行性無力：先停止負荷並轉介。</text></svg>
