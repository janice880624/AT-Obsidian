<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">手腕與手初步分流流程</title>
  <desc id="desc">由神經血管紅旗、骨折脫位、肌腱功能到系統性檢查的教學流程。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
  <rect width="1200" height="900" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#0f172a">手腕與手初步分流流程</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="360" y="95" width="480" height="85" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="600" y="145" font-size="24" fill="#1e3a8a">停止活動、移除戒指、確認受傷機轉</text>
    <line x1="600" y1="180" x2="600" y2="225" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="330" y="235" width="540" height="100" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
    <text x="600" y="275" font-size="23" font-weight="700" fill="#991b1b">開放傷、畸形、血流異常、進行性麻木？</text>
    <text x="600" y="310" font-size="19" fill="#991b1b">或高壓注射、壓砸、筋膜室症候群疑慮</text>
    <line x1="330" y1="285" x2="180" y2="285" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="255" y="267" font-size="20" fill="#334155">是</text>
    <rect x="40" y="235" width="140" height="100" rx="20" fill="#fecaca" stroke="#b91c1c" stroke-width="4"/>
    <text x="110" y="275" font-size="21" font-weight="700" fill="#7f1d1d">緊急保護</text><text x="110" y="307" font-size="21" font-weight="700" fill="#7f1d1d">與轉介</text>
    <line x1="600" y1="335" x2="600" y2="390" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="625" y="370" font-size="20" fill="#334155">否</text>
    <rect x="330" y="400" width="540" height="100" rx="22" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
    <text x="600" y="440" font-size="23" font-weight="700" fill="#9a3412">骨性壓痛、旋轉變形、無法主動屈伸？</text>
    <text x="600" y="475" font-size="19" fill="#9a3412">鼻煙窩、橈骨遠端、關節線或肌腱功能缺失</text>
    <line x1="870" y1="450" x2="1030" y2="450" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="950" y="432" font-size="20" fill="#334155">是</text>
    <rect x="1030" y="400" width="135" height="100" rx="20" fill="#fed7aa" stroke="#c2410c" stroke-width="4"/>
    <text x="1098" y="440" font-size="20" font-weight="700" fill="#7c2d12">固定保護</text><text x="1098" y="472" font-size="20" font-weight="700" fill="#7c2d12">影像評估</text>
    <line x1="600" y1="500" x2="600" y2="555" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="625" y="540" font-size="20" fill="#334155">否</text>
    <rect x="300" y="565" width="600" height="100" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="600" y="605" font-size="23" font-weight="700" fill="#166534">系統性檢查：看、摸、動、力量、神經</text>
    <text x="600" y="640" font-size="19" fill="#166534">依橈側／中央／尺側／手指疼痛地圖選擇測試</text>
    <line x1="600" y1="665" x2="600" y2="720" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="300" y="730" width="600" height="100" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/>
    <text x="600" y="770" font-size="23" font-weight="700" fill="#5b21b6">建立鑑別、調整負荷、設定追蹤與轉介門檻</text>
    <text x="600" y="805" font-size="19" fill="#5b21b6">陰性特殊檢查不能排除隱匿性骨折</text>
  </g>
  <text x="600" y="875" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#64748b">教學流程，不取代急救 SOP、影像、醫師診斷或手外科評估</text>
</svg>

