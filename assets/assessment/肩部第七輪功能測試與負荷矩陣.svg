<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="45" y="55" class="t">肩部功能與負荷：從安全活動到專項表現</text><g transform="translate(55 120)"><rect width="250" height="210" rx="15" class="x"/><text x="55" y="45" class="h">1 安全與症狀</text><text x="30" y="95" class="b">無感染／骨折紅旗</text><text x="30" y="135" class="b">活動後隔日回基線</text><text x="30" y="175" class="b">可說明自我監測</text><rect x="275" width="250" height="210" rx="15" class="x"/><text x="335" y="45" class="h">2 基礎能力</text><text x="305" y="95" class="b">主被動活動與力量</text><text x="305" y="135" class="b">肩胛／神經控制</text><text x="305" y="175" class="b">日常推拉與舉物</text><rect x="550" width="250" height="210" rx="15" class="x"/><text x="605" y="45" class="h">3 表現測試</text><text x="580" y="95" class="b">ULRT 或適用測試</text><text x="580" y="135" class="b">左右與個人基線</text><text x="580" y="175" class="b">動作品質＋症狀</text><rect x="825" width="250" height="210" rx="15" class="x"/><text x="880" y="45" class="h">4 專項暴露</text><text x="855" y="95" class="b">速度、力量、疲勞</text><text x="855" y="135" class="b">完整訓練與連續日</text><text x="855" y="175" class="b">共享決策</text></g><rect x="170" y="430" width="860" height="145" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="365" y="475" class="h">進展原則：一次改一個主要變因</text><text x="250" y="520" class="b">範圍 → 阻力 → 次數 → 速度 → 不確定性；每階段都追蹤當下與隔日反應。</text><text x="160" y="650" class="b">功能測試是能力資料，不是確診工具或唯一回場門檻；不同版本不得直接混用。</text></svg>
