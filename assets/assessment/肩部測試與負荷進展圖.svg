<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.box{fill:#fff;stroke:#52677f;stroke-width:3}.a{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><text x="45" y="55" class="t">肩部第三輪：從安全檢查到運動負荷</text><g transform="translate(55 105)"><rect width="210" height="145" rx="14" class="box"/><text x="45" y="42" class="h">1 安全與問診</text><text x="25" y="80" class="b">創傷／神經血管</text><text x="25" y="112" class="b">方向／負荷／24 小時</text><path d="M210 72h48" class="a"/><rect x="265" width="210" height="145" rx="14" class="box"/><text x="315" y="42" class="h">2 STTT</text><text x="288" y="80" class="b">主動／被動／等長</text><text x="288" y="112" class="b">只建立組織假設</text><path d="M475 72h48" class="a"/><rect x="530" width="210" height="145" rx="14" class="box"/><text x="570" y="42" class="h">3 定量基線</text><text x="552" y="80" class="b">活動度／測力計</text><text x="552" y="112" class="b">疼痛／恐懼／品質</text><path d="M740 72h48" class="a"/><rect x="795" width="295" height="145" rx="14" class="box"/><text x="850" y="42" class="h">4 功能與暴露</text><text x="825" y="80" class="b">閉鎖鏈 → 高角度 → 高速</text><text x="830" y="112" class="b">運動專項＋心理準備度</text></g><g transform="translate(120 335)"><rect width="960" height="205" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="335" y="43" class="h">每一階段都重測三件事</text><text x="75" y="95" class="b">① 當下：疼痛、不穩感、神經症狀與動作品質</text><text x="75" y="135" class="b">② 隔日：是否回到可接受基線，而非只看訓練當下</text><text x="75" y="175" class="b">③ 任務：力量、耐力、速度及真實運動需求是否匹配</text></g><rect x="80" y="610" width="1040" height="55" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="175" y="644" class="b">任何階段出現變形、缺血、進行性神經缺損或快速惡化：停止並轉介。</text></svg>
