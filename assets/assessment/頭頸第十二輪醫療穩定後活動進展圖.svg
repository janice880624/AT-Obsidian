<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><rect width="1200" height="700" fill="#f8fafc"/><text x="60" y="65" font-family="sans-serif" font-size="34">醫療穩定後的頭頸活動進展</text><g font-family="sans-serif" font-size="22" text-anchor="middle"><g fill="#e0f2fe" stroke="#0369a1" stroke-width="4"><rect x="70" y="160" width="190" height="120" rx="18"/><rect x="290" y="160" width="190" height="120" rx="18"/><rect x="510" y="160" width="190" height="120" rx="18"/><rect x="730" y="160" width="190" height="120" rx="18"/><rect x="950" y="160" width="190" height="120" rx="18"/></g><text x="165" y="210">紅旗解除</text><text x="165" y="245">感染／結構穩定</text><text x="385" y="210">小幅度活動</text><text x="385" y="245">呼吸不中斷</text><text x="605" y="210">低強度等長</text><text x="605" y="245">姿勢耐力</text><text x="825" y="210">步行與視線</text><text x="825" y="245">日常任務</text><text x="1045" y="210">專項回場</text><text x="1045" y="245">專科允許</text><path d="M260 220 H290 M480 220 H510 M700 220 H730 M920 220 H950" stroke="#334155" stroke-width="5"/><rect x="170" y="380" width="860" height="170" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="600" y="430">每階都要監測</text><text x="600" y="475">發燒／吞嚥呼吸 ｜ 眩暈複視 ｜ 麻弱步態 ｜ 夜痛與隔日反應</text><text x="600" y="520">任何紅旗 → 停止、回退並重新醫療評估</text></g><text x="60" y="655" font-family="sans-serif" font-size="19" fill="#475569">原創示意圖｜不取代感染、血管或固定醫囑｜CC BY 4.0</text></svg>