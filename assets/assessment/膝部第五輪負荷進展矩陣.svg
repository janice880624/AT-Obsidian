<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:3}</style><text x="40" y="55" class="t">膝部第五輪負荷：軟組織漸進與骨病灶分流</text><g transform="translate(45 115)"><rect width="250" height="195" rx="14" class="x"/><text x="55" y="42" class="h">1 安全與基線</text><text x="25" y="90" class="b">負重、積液、紅旗</text><text x="25" y="130" class="b">可耐受屈伸角度</text><text x="25" y="170" class="b">坐站與步行</text><rect x="275" width="250" height="195" rx="14" class="x"/><text x="335" y="42" class="h">2 慢速力量</text><text x="300" y="90" class="b">伸膝、屈膝、髖肌</text><text x="300" y="130" class="b">蹲與低階踏步</text><text x="300" y="170" class="b">監測隔日反應</text><rect x="550" width="250" height="195" rx="14" class="x"/><text x="610" y="42" class="h">3 功能負荷</text><text x="575" y="90" class="b">樓梯、單腳控制</text><text x="575" y="130" class="b">跑走與方向改變</text><text x="575" y="170" class="b">一次主改一項</text><rect x="825" width="250" height="195" rx="14" class="x"/><text x="890" y="42" class="h">4 專項回場</text><text x="850" y="90" class="b">速度、跑跳、接觸</text><text x="850" y="130" class="b">連續訓練</text><text x="850" y="170" class="b">共享決策</text></g><rect x="130" y="420" width="940" height="130" rx="16" class="warn"/><text x="365" y="465" class="h">SIFK／骨病灶走另一條安全線</text><text x="205" y="510" class="b">先依醫療端負重與影像條件；疼痛下降不代表骨已癒合，不自行以跳測驗證。</text><text x="215" y="625" class="b">共同監測：熟悉症狀｜腫脹與活動度｜力量與功能｜24–48 小時回復</text><text x="260" y="670" class="b">新紅旗、負重惡化或隔日未回基線：退階並重新評估。</text></svg>
