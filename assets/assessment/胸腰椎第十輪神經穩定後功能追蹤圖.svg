<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><rect width="1200" height="700" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.s{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.a{stroke:#334155;stroke-width:5;fill:none}</style><text x="55" y="55" class="t">脊髓病灶處置後：功能追蹤與活動進展</text><rect x="75" y="150" width="250" height="160" rx="18" class="s"/><text x="130" y="205" class="h">神經與安全基線</text><text x="105" y="250" class="b">肌力、感覺、反射、括約肌</text><rect x="475" y="150" width="250" height="160" rx="18" class="s"/><text x="530" y="205" class="h">功能等級與步態</text><text x="500" y="250" class="b">Modified McCormick＋輔具</text><rect x="875" y="150" width="250" height="160" rx="18" class="s"/><text x="930" y="205" class="h">單一變項進展</text><text x="910" y="250" class="b">時間、距離、地面或專項</text><path d="M325 230H475M725 230H875" class="a"/><rect x="260" y="430" width="680" height="120" rx="18" fill="#ecfdf5" stroke="#047857" stroke-width="3"/><text x="350" y="475" class="h">每次比較：步態、疲勞、麻弱、平衡與隔日反應</text><text x="350" y="520" class="b">任何新神經或括約肌變化：停止、退階並轉介</text><text x="250" y="640" class="h">功能量表用於追蹤，不是診斷工具或單一回場門檻</text></svg>
