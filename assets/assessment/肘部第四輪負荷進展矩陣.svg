<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="45" y="55" class="t">肘部負荷進展：安全、容量、功能與投擲</text><g transform="translate(55 115)"><rect width="250" height="175" rx="15" class="x"/><text x="58" y="42" class="h">1 醫療安全</text><text x="25" y="88" class="b">骨折／不穩／神經已評估</text><text x="25" y="125" class="b">無鎖住與進行性紅旗</text><text x="25" y="158" class="b">活動弧與症狀基線</text><rect x="275" width="250" height="175" rx="15" class="x"/><text x="335" y="42" class="h">2 局部容量</text><text x="300" y="88" class="b">屈伸、旋前旋後、握力</text><text x="300" y="125" class="b">向心／離心與角度控制</text><text x="300" y="158" class="b">隔日反應穩定</text><rect x="550" width="250" height="175" rx="15" class="x"/><text x="610" y="42" class="h">3 功能耐力</text><text x="575" y="88" class="b">推拉、承重、FIT-HaNSA</text><text x="575" y="125" class="b">肩胛、軀幹、下肢整合</text><text x="575" y="158" class="b">速度與疲勞控制</text><rect x="825" width="250" height="175" rx="15" class="x"/><text x="875" y="42" class="h">4 專項回場</text><text x="850" y="88" class="b">距離、強度、球數分級</text><text x="850" y="125" class="b">完整訓練與連續暴露</text><text x="850" y="158" class="b">共享決策與負荷監測</text></g><rect x="150" y="395" width="900" height="175" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="470" y="438" class="h">共同通關條件</text><text x="190" y="486" class="b">症狀可控｜動作品質穩定｜負荷後隔日回基線｜測試方法固定</text><text x="190" y="530" class="b">整合個人基線、組織癒合、功能需求與心理準備</text><rect x="165" y="625" width="870" height="50" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="255" y="657" class="b">單次特殊檢查、左右對稱或無痛活動度，都不足以獨立決定回場。</text></svg>
