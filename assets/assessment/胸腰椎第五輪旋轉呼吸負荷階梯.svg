<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="45" y="55" class="t">胸壁與側腹負荷：由呼吸到專項旋轉</text><g transform="translate(50 115)"><rect width="250" height="180" rx="15" class="x"/><text x="65" y="42" class="h">1 安全基線</text><text x="25" y="88" class="b">生命徵象與心肺紅旗</text><text x="25" y="128" class="b">日常與安靜呼吸</text><rect x="275" width="250" height="180" rx="15" class="x"/><text x="345" y="42" class="h">2 低負荷</text><text x="300" y="88" class="b">深呼吸、旋轉、抗旋轉</text><text x="300" y="128" class="b">肩帶推拉與等長</text><rect x="550" width="250" height="180" rx="15" class="x"/><text x="615" y="42" class="h">3 動態容量</text><text x="575" y="88" class="b">慢速旋轉、離心回位</text><text x="575" y="128" class="b">分段划船或投擲</text><rect x="825" width="250" height="180" rx="15" class="x"/><text x="885" y="42" class="h">4 專項回場</text><text x="850" y="88" class="b">速度、力量、時長</text><text x="850" y="128" class="b">連續日與競賽情境</text></g><rect x="150" y="405" width="900" height="170" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="470" y="447" class="h">每一階段都記錄</text><text x="210" y="495" class="b">疼痛｜熟悉症狀｜呼吸困難｜RPE｜完成量｜品質｜隔日反應</text><text x="250" y="535" class="b">一次主要增加一個變項；聲音存在不等於組織仍未癒合</text><rect x="165" y="625" width="870" height="50" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="220" y="657" class="b">胸部壓迫感、暈厥、低血氧、咳血或重大創傷線索時立即停止。</text></svg>
