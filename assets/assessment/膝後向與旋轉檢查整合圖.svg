<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.box{fill:#fff;stroke:#52677f;stroke-width:3}.c{fill:#eef6ff;stroke:#1769aa;stroke-width:3}.w{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.a{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><text x="50" y="55" class="t">後向與旋轉檢查：整合而非單測試確診</text><rect x="70" y="110" width="300" height="130" rx="14" class="c"/><text x="115" y="155" class="h">Posterior Sag</text><text x="105" y="195" class="b">先看起始位置與後沉</text><rect x="450" y="110" width="300" height="130" rx="14" class="c"/><text x="492" y="155" class="h">Posterior Drawer</text><text x="487" y="195" class="b">位移＋終末感＋比較</text><rect x="830" y="110" width="300" height="130" rx="14" class="c"/><text x="940" y="155" class="h">Dial</text><text x="874" y="195" class="b">30°／90°外旋與終末感</text><path d="M370 175h75" class="a"/><path d="M750 175h75" class="a"/><rect x="230" y="315" width="740" height="115" rx="14" class="box"/><text x="335" y="360" class="h">整合：機轉、積液、步態、內外翻與神經血管</text><text x="320" y="397" class="b">急性防衛、擺位與合併傷會改變所有測試</text><path d="M600 430v60" class="a"/><rect x="250" y="490" width="700" height="120" rx="14" class="w"/><text x="340" y="535" class="h">高能量／明顯不穩／神經血管異常</text><text x="362" y="575" class="b">停止反覆測試，保護、減重並儘速轉介</text><text x="50" y="675" class="b">沒有任何一項特殊檢查可單獨排除多韌帶或膝脫位相關傷害。</text></svg>
