<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="45" y="55" class="t">顏面外傷：先救器官，再分骨折</text><rect x="120" y="90" width="960" height="120" rx="16" class="r"/><text x="210" y="135" class="h">氣道／頸椎、視力／瞳孔、眼球完整性、意識與持續出血</text><text x="370" y="178" class="b">任一異常：保護並立即轉介</text><rect x="120" y="260" width="290" height="210" rx="14" class="x"/><text x="210" y="300" class="h">眼眶</text><text x="150" y="345" class="b">每眼視力、瞳孔、眼位</text><text x="150" y="383" class="b">眼球運動、複視、噁心心搏</text><text x="150" y="421" class="b">不壓迫疑似破裂眼球</text><rect x="455" y="260" width="290" height="210" rx="14" class="x"/><text x="555" y="300" class="h">鼻部</text><text x="485" y="345" class="b">止血後檢查兩側鼻中隔</text><text x="485" y="383" class="b">柔軟膨隆＝急迫 ENT</text><text x="485" y="421" class="b">避免擤鼻與自行引流</text><rect x="790" y="260" width="290" height="210" rx="14" class="x"/><text x="885" y="300" class="h">口腔</text><text x="820" y="345" class="b">咬合、牙齒、口底、感覺</text><text x="820" y="383" class="b">缺牙確認吸入／保存</text><text x="820" y="421" class="b">單一舌板測試不能確診</text><rect x="190" y="535" width="820" height="115" rx="16" class="g"/><text x="390" y="578" class="h">安全後才進入影像、專科與回場流程</text><text x="250" y="620" class="b">持續重複視力、瞳孔、意識、神經、出血與氣道狀態</text><text x="120" y="715" class="b">本圖不取代急救、眼科、顏面外科、牙科或影像判斷。</text></svg>
