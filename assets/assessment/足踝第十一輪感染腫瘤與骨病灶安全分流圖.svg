<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><text x="60" y="65" font-size="34" font-family="sans-serif" fill="#111827">慢性足踝痛腫：先安全分流，再決定檢查</text><g font-family="sans-serif" font-size="23" text-anchor="middle"><rect x="410" y="105" width="380" height="80" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/><text x="600" y="154">痛、腫、卡住、腫塊或負荷痛</text><path d="M600 185 V235" stroke="#334155" stroke-width="5"/><rect x="410" y="235" width="380" height="95" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/><text x="600" y="275">發燒／傷口／快速惡化／神經血管異常</text><text x="600" y="307">有 → 停止運動，急速醫療轉介</text><path d="M600 330 V385" stroke="#334155" stroke-width="5"/><path d="M600 385 H205 V430 M600 385 V430 M600 385 H995 V430" fill="none" stroke="#334155" stroke-width="5"/><rect x="60" y="430" width="290" height="160" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="205" y="475">感染線索</text><text x="205" y="515">慢性單關節、竇道</text><text x="205" y="550">TB 風險、全身症狀</text><rect x="455" y="430" width="290" height="160" rx="18" fill="#f3e8ff" stroke="#9333ea" stroke-width="4"/><text x="600" y="475">滑膜／腫瘤線索</text><text x="600" y="515">反覆積液、腫塊</text><text x="600" y="550">卡住、骨侵蝕</text><rect x="850" y="430" width="290" height="160" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="995" y="475">骨病灶線索</text><text x="995" y="515">創傷後深踝痛</text><text x="995" y="550">負荷增加＋局部骨痛</text><path d="M205 590 V645 M600 590 V645 M995 590 V645" stroke="#334155" stroke-width="5"/><text x="205" y="690">採樣／NAAT／培養病理</text><text x="600" y="690">先影像定位，再規劃病理</text><text x="995" y="690">X 光＋適應症下 MRI／CT</text></g><text x="60" y="735" font-family="sans-serif" font-size="19" fill="#475569">單一特殊檢查不能確診；依紅旗與專科路徑處理｜原創示意圖｜CC BY 4.0</text></svg>