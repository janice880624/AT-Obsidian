<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.o{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="55" y="55" class="t">急性熱腫膝：先排感染的安全分流</text><rect x="110" y="100" width="980" height="110" rx="18" class="r"/><text x="230" y="145" class="h">病容、生命徵象異常、無法負重或快速進展？</text><text x="430" y="185" class="b">停止測試，立即急診</text><rect x="80" y="285" width="500" height="245" rx="18" class="o"/><text x="175" y="335" class="h">感染風險或首次非典型發作</text><text x="125" y="395" class="b">同日醫療評估；關節液培養、細胞、晶體</text><text x="125" y="445" class="b">晶體存在仍不能排除感染</text><rect x="630" y="285" width="490" height="245" rx="18" class="g"/><text x="770" y="335" class="h">已知 OA 或晶體史</text><text x="680" y="395" class="b">仍依熱紅、全身狀態與風險重新分流</text><text x="680" y="445" class="b">不以止痛反應或無發燒排除感染</text><rect x="180" y="615" width="840" height="80" rx="18" class="g"/><text x="315" y="665" class="h">場邊檢查不取代抽液、培養與醫療診斷</text></svg>
