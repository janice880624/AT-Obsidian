<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><rect width="1200" height="700" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.s{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.a{stroke:#334155;stroke-width:5}</style><text x="55" y="55" class="t">骨盆深部病灶處置後：醫療穩定再逐級負重</text><rect x="65" y="145" width="250" height="165" rx="18" class="s"/><text x="110" y="200" class="h">醫療與骨性穩定</text><text x="95" y="245" class="b">感染、傷口、影像與限制</text><rect x="475" y="145" width="250" height="165" rx="18" class="s"/><text x="525" y="200" class="h">轉位與步行</text><text x="505" y="245" class="b">輔具、距離、步態反應</text><rect x="885" y="145" width="250" height="165" rx="18" class="s"/><text x="925" y="200" class="h">力量與專項</text><text x="915" y="245" class="b">一次只增加一個變項</text><line x1="315" y1="225" x2="475" y2="225" class="a"/><line x1="725" y1="225" x2="885" y2="225" class="a"/><rect x="235" y="430" width="730" height="130" rx="18" fill="#ecfdf5" stroke="#047857" stroke-width="3"/><text x="320" y="480" class="h">每次記錄：疼痛、發燒、步態、傷口與隔日反應</text><text x="315" y="525" class="b">新全身症狀、無法負重或夜間進展痛：停止並回報醫療團隊</text><text x="250" y="650" class="h">復健用於恢復功能，不可取代抗菌、影像、骨癒合或腫瘤追蹤</text></svg>
