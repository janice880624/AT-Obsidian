<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="45" y="55" class="t">膝脫臼／高能量膝傷：神經血管不能只檢查一次</text><rect x="160" y="90" width="880" height="105" rx="16" class="r"/><text x="235" y="132" class="h">變形或曾自行復位＋無脈／冷白／血腫／足下垂／腔室警訊？</text><text x="395" y="170" class="b">立即創傷、血管與骨科流程</text><rect x="170" y="245" width="360" height="165" rx="14" class="x"/><text x="260" y="287" class="h">初次與序列檢查</text><text x="205" y="330" class="b">雙側脈搏、灌流、溫色</text><text x="205" y="365" class="b">深／淺腓與脛神經</text><text x="205" y="398" class="b">固定／復位前後標記時間</text><rect x="670" y="245" width="360" height="165" rx="14" class="x"/><text x="775" y="287" class="h">醫療端決策</text><text x="705" y="330" class="b">ABI、CTA／血管影像與觀察</text><text x="705" y="365" class="b">一次正常脈搏不排除內膜傷</text><text x="705" y="398" class="b">不要先做運動／韌帶挑釁</text><rect x="210" y="485" width="780" height="115" rx="16" class="g"/><text x="355" y="528" class="h">安全固定＋快速轉運＋反覆記錄</text><text x="298" y="570" class="b">灌流或腔室惡化屬時間敏感的肢體威脅</text><text x="155" y="690" class="b">本圖不取代急救權限、院方創傷流程、血管影像或外科決策。</text></svg>
