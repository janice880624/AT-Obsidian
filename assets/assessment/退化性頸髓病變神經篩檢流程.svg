<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.box{fill:#fff;stroke:#52677f;stroke-width:3}.warn{fill:#fff1f2;stroke:#be123c;stroke-width:4}.go{fill:#ecfdf5;stroke:#047857;stroke-width:3}.a{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><text x="45" y="55" class="t">退化性頸髓病變：神經篩檢與分流</text><rect x="260" y="90" width="680" height="100" rx="14" class="box"/><text x="340" y="132" class="h">手部笨拙／多肢症狀／步態或跌倒改變</text><text x="400" y="168" class="b">先問進展速度與括約肌／創傷警訊</text><path d="M600 190v50" class="a"/><rect x="250" y="240" width="700" height="130" rx="14" class="box"/><text x="330" y="282" class="h">組合神經檢查，不只做 Hoffmann</text><text x="300" y="320" class="b">肌節＋感覺＋反射＋病理反射＋手部靈巧＋步態</text><path d="M600 370v50" class="a"/><rect x="250" y="420" width="700" height="115" rx="14" class="warn"/><text x="355" y="462" class="h">快速進展／不能走／新發括約肌改變</text><text x="415" y="500" class="b">停止運動並依急症流程轉介</text><path d="M600 535v50" class="a"/><rect x="275" y="585" width="650" height="105" rx="14" class="go"/><text x="375" y="628" class="h">疑漸進 DCM：快速醫療評估</text><text x="365" y="665" class="b">MRI 與診斷由醫療端整合；避免頸椎推力</text><text x="55" y="735" class="b">單一測試陰性不能排除；影像退化也不能單獨等同臨床 DCM。</text></svg>
