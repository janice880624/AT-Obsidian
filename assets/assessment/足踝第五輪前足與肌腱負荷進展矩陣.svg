<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:29px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.x{fill:#fff;stroke:#52677f;stroke-width:3}.a{fill:#eff6ff;stroke:#2563eb;stroke-width:3}.p{fill:#fff1f2;stroke:#e11d48;stroke-width:3}</style><text x="45" y="52" class="t">足踝第五輪負荷矩陣：先降低壓縮，再恢復專項</text><rect x="80" y="100" width="500" height="220" rx="16" class="a"/><text x="190" y="145" class="h">插入型跟腱</text><text x="115" y="190" class="b">早期：平地踮足、跟墊、限制深背屈</text><text x="115" y="230" class="b">中期：增加重量與單腳比例</text><text x="115" y="270" class="b">後期：能量儲存、跑跳、逐步恢復角度</text><rect x="620" y="100" width="500" height="220" rx="16" class="p"/><text x="750" y="145" class="h">第二蹠趾蹠板</text><text x="655" y="190" class="b">早期：硬底鞋、墊片／貼紮、控制趾位</text><text x="655" y="230" class="b">中期：足內在肌、雙腳至單腳踮足</text><text x="655" y="270" class="b">後期：推蹬、低幅跳、跑跳與鞋具專項</text><g transform="translate(85 405)"><rect width="240" height="120" rx="14" class="x"/><text x="55" y="42" class="h">1 日常穩定</text><text x="28" y="82" class="b">步行與隔日回復</text><rect x="265" width="240" height="120" rx="14" class="x"/><text x="320" y="42" class="h">2 慢速力量</text><text x="292" y="82" class="b">角度與負荷分開加</text><rect x="530" width="240" height="120" rx="14" class="x"/><text x="590" y="42" class="h">3 速度／彈性</text><text x="555" y="82" class="b">低幅至專項速度</text><rect x="795" width="240" height="120" rx="14" class="x"/><text x="850" y="42" class="h">4 連續訓練</text><text x="825" y="82" class="b">密度與回場決策</text></g><text x="205" y="625" class="b">一次主要增加一項：角度｜重量｜速度｜跑量｜鞋具；監測當下與 24–48 小時。</text><text x="275" y="675" class="b">骨壓力傷、明顯脫位或新紅旗不走此進展線。</text></svg>
