<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:Noto Sans CJK TC,sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.x{fill:#fff;stroke:#52677f;stroke-width:4}.a{fill:#dbeafe;stroke:#2563eb;stroke-width:4}.g{fill:#dcfce7;stroke:#16a34a;stroke-width:4}.o{fill:#ffedd5;stroke:#ea580c;stroke-width:4}</style><text x="55" y="55" class="t">影像與專科確認穩定後：功能恢復順序</text><rect x="80" y="120" width="300" height="410" rx="20" class="a"/><text x="155" y="175" class="h">第一階段</text><text x="120" y="245" class="b">呼吸與神經基線</text><text x="120" y="295" class="b">肩帶與四肢活動</text><text x="120" y="345" class="b">短時步行</text><rect x="450" y="120" width="300" height="410" rx="20" class="g"/><text x="525" y="175" class="h">第二階段</text><text x="490" y="245" class="b">允許範圍內控制</text><text x="490" y="295" class="b">低負荷力量與耐力</text><text x="490" y="345" class="b">NDI 與客觀功能趨勢</text><rect x="820" y="120" width="300" height="410" rx="20" class="o"/><text x="895" y="175" class="h">第三階段</text><text x="860" y="245" class="b">速度與專項暴露</text><text x="860" y="295" class="b">非接觸到接觸</text><text x="860" y="345" class="b">接觸需專科許可</text><text x="185" y="635" class="h">新神經、吞嚥聲音、呼吸或高位頸痛：停止並重新評估</text></svg>
