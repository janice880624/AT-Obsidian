<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650"><rect width="1200" height="650" fill="#f8fafc"/><text x="55" y="65" font-family="sans-serif" font-size="34">醫療穩定後人工髖功能恢復</text><g font-family="sans-serif" font-size="22" text-anchor="middle"><rect x="60" y="170" width="220" height="120" rx="18" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/><rect x="330" y="170" width="220" height="120" rx="18" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/><rect x="600" y="170" width="220" height="120" rx="18" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/><rect x="870" y="170" width="260" height="120" rx="18" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/><text x="170" y="220">傷口／組件／骨</text><text x="170" y="255">感染均穩定</text><text x="440" y="220">步態與坐站</text><text x="440" y="255">低負荷肌力</text><text x="710" y="220">階梯與耐力</text><text x="710" y="255">平衡控制</text><text x="1000" y="220">跑騎游或工作</text><text x="1000" y="255">個別化回場</text><path d="M280 230 H330 M550 230 H600 M820 230 H870" stroke="#334155" stroke-width="5"/><rect x="180" y="390" width="840" height="130" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="600" y="440">監測：發燒滲液｜新發變形不穩｜麻弱｜夜間痛｜隔日負重反應</text><text x="600" y="485">任何紅旗 → 停止並回置換專科</text></g></svg>