<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">手腕與手回場測試矩陣</title>
  <desc id="desc">以組織癒合、症狀、握捏力、承重與項目任務整合回場決策。</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="60" y="58" font-family="sans-serif" font-size="34" font-weight="700" fill="#0f172a">手腕與手回場：五層證據矩陣</text>
  <g font-family="sans-serif" font-size="23">
    <rect x="90" y="110" width="1020" height="85" rx="20" fill="#fee2e2"/><text x="125" y="145" font-weight="700">1 組織與安全</text><text x="390" y="145">骨折／韌帶／肌腱癒合、影像與醫療限制</text><text x="390" y="177">紅旗或進行性神經血管症狀 → 停止</text>
    <rect x="90" y="215" width="1020" height="85" rx="20" fill="#ffedd5"/><text x="125" y="250" font-weight="700">2 症狀與活動</text><text x="390" y="250">疼痛、腫脹、活動度、主動腱功能</text><text x="390" y="282">觀察當下及隔日反應</text>
    <rect x="90" y="320" width="1020" height="85" rx="20" fill="#fef9c3"/><text x="125" y="355" font-weight="700">3 力量</text><text x="390" y="355">標準化握力、key／tip／three-jaw pinch</text><text x="390" y="387">個人基準優先；對側只作參考</text>
    <rect x="90" y="425" width="1020" height="85" rx="20" fill="#dcfce7"/><text x="125" y="460" font-weight="700">4 承重與耐受</text><text x="390" y="460">桌面 → 四足 → 平板 → 動態重心轉移</text><text x="390" y="492">保持手位與程序一致</text>
    <rect x="90" y="530" width="1020" height="85" rx="20" fill="#dbeafe"/><text x="125" y="565" font-weight="700">5 項目任務</text><text x="390" y="565">抓、接、揮擊、對抗、撐地、跌倒保護</text><text x="390" y="597">逐增速度、體積、不可預測性與接觸</text>
  </g>
  <rect x="250" y="650" width="700" height="70" rx="28" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>
  <text x="600" y="693" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#312e81">整合醫療、運動需求與共享決策；無單一通關值</text>
</svg>

