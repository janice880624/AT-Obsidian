<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="105" y="55" class="t">慢性手麻與手部腫塊：安全分流</text><rect x="105" y="100" width="990" height="125" rx="18" class="r"/><text x="205" y="150" class="h">快速腫大／發燒紅腫／進展麻弱／手冷色變／病理性骨折？</text><text x="400" y="195" class="b">任一項：停止負荷並同日或加速轉介</text><rect x="80" y="300" width="315" height="240" rx="18" class="x"/><text x="155" y="345" class="h">神經模式</text><text x="115" y="400" class="b">分布、夜間、魚際、CTS-6</text><rect x="445" y="300" width="315" height="240" rx="18" class="x"/><text x="510" y="345" class="h">軟組織腫塊</text><text x="480" y="400" class="b">位置、尺寸、皮膚、滑動</text><rect x="810" y="300" width="315" height="240" rx="18" class="x"/><text x="890" y="345" class="h">骨性病灶</text><text x="845" y="400" class="b">X 光、骨皮質與骨折風險</text><text x="315" y="665" class="h">診斷未明前：不穿刺、不按摩、不以疼痛證明</text></svg>
