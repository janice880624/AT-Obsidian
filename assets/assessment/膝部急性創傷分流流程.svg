<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" rx="32" fill="#f8fafc"/><text x="60" y="64" font-size="34" font-family="sans-serif" font-weight="700" fill="#17324d">急性膝部創傷：先分流，再檢查</text>
<g font-family="sans-serif" text-anchor="middle"><rect x="390" y="95" width="420" height="82" rx="20" fill="#dceef8" stroke="#3b6d8c" stroke-width="4"/><text x="600" y="145" font-size="28" fill="#17324d">機轉＋外觀＋生命徵象</text>
<path d="M600 177V220" stroke="#3b6d8c" stroke-width="5"/><rect x="270" y="220" width="660" height="120" rx="20" fill="#ffe2df" stroke="#c54b46" stroke-width="4"/><text x="600" y="265" font-size="25" fill="#7b2521">變形／開放傷／疑似脫臼／無脈</text><text x="600" y="300" font-size="25" fill="#7b2521">進行性神經症狀／腔室症候群／感染</text>
<path d="M270 280H120V405" stroke="#c54b46" stroke-width="5" fill="none"/><text x="190" y="267" font-size="22" fill="#7b2521">有</text><rect x="35" y="405" width="310" height="115" rx="20" fill="#c54b46"/><text x="190" y="450" font-size="25" fill="white">停止一般測試</text><text x="190" y="487" font-size="25" fill="white">固定／急救／緊急轉介</text>
<path d="M930 280H1060V405" stroke="#3b6d8c" stroke-width="5" fill="none"/><text x="1000" y="267" font-size="22" fill="#17324d">無</text><rect x="855" y="405" width="310" height="115" rx="20" fill="#dceef8" stroke="#3b6d8c" stroke-width="4"/><text x="1010" y="450" font-size="25" fill="#17324d">骨性壓痛＋負重</text><text x="1010" y="487" font-size="25" fill="#17324d">Ottawa Knee Rule</text>
<path d="M1010 520V575H700" stroke="#3b6d8c" stroke-width="5" fill="none"/><rect x="510" y="575" width="380" height="95" rx="20" fill="#e7f4e4" stroke="#4f8b4a" stroke-width="4"/><text x="700" y="615" font-size="25" fill="#245c26">完整系統性檢查</text><text x="700" y="650" font-size="22" fill="#245c26">病史＋活動度＋積液＋假設導向測試</text>
<path d="M700 670V720" stroke="#4f8b4a" stroke-width="5"/><text x="600" y="770" font-size="22" fill="#17324d">X 光陰性不排除 ACL、半月板、肌腱、軟骨或血管神經損傷</text></g></svg>