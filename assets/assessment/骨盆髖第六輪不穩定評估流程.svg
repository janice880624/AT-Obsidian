<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="42" y="55" class="t">前髖痛與不穩感：分層評估，不靠單一測試</text><rect x="100" y="90" width="1000" height="110" rx="16" class="r"/><text x="205" y="135" class="h">無法負重、發燒、夜間進展痛、急性脫臼／骨傷或神經血管異常？</text><text x="345" y="172" class="b">有：停止挑釁，按急迫度轉介</text><rect x="80" y="260" width="300" height="205" rx="14" class="x"/><text x="145" y="305" class="h">病史與風險</text><text x="110" y="350" class="b">giving-way、末端角度</text><text x="110" y="390" class="b">發育不良、過度活動</text><text x="110" y="430" class="b">創傷／手術與負荷</text><rect x="450" y="260" width="300" height="205" rx="14" class="x"/><text x="510" y="305" class="h">檢查與相反假設</text><text x="480" y="350" class="b">ROM、力量、神經與腰椎</text><text x="480" y="390" class="b">AB-HEER／HEER／俯臥</text><text x="480" y="430" class="b">FAI、盂唇、肌腱與骨傷</text><rect x="820" y="260" width="300" height="205" rx="14" class="x"/><text x="900" y="305" class="h">影像與追蹤</text><text x="850" y="350" class="b">正確擺位 X 光</text><text x="850" y="390" class="b">多參數，不單看角度</text><text x="850" y="430" class="b">複評症狀與功能反應</text><rect x="175" y="550" width="850" height="105" rx="16" class="g"/><text x="335" y="592" class="h">低風險：教育＋動態穩定＋分級專項</text><text x="265" y="632" class="b">多項線索一致才提高機率；保守照護失敗或結構風險高再轉髖保存專科</text><text x="220" y="720" class="b">任何測試只調整機率，不替代臨床－影像整合與安全網。</text></svg>
