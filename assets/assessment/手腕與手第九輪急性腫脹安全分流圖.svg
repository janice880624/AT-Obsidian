<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="90" y="55" class="t">手部急性腫脹：筋膜室症候群安全分流</text><rect x="110" y="105" width="980" height="125" rx="18" class="r"/><text x="220" y="155" class="h">疼痛失衡／快速緊繃腫脹／被動伸展劇痛／麻弱惡化？</text><text x="325" y="200" class="b">高度懷疑就是時間依賴急症；脈搏存在不能排除</text><rect x="95" y="300" width="440" height="240" rx="18" class="x"/><text x="195" y="345" class="h">立即做</text><text x="140" y="400" class="b">移除戒指與束縛、保持安全中立</text><text x="140" y="445" class="b">記錄感覺、運動、顏色、溫度與回填</text><text x="140" y="490" class="b">快速急診／手外科轉送與趨勢交接</text><rect x="665" y="300" width="440" height="240" rx="18" class="x"/><text x="775" y="345" class="h">不要做</text><text x="710" y="400" class="b">反覆深壓、拉伸或負荷測試</text><text x="710" y="445" class="b">因 X 光正常或脈搏存在而等待</text><text x="710" y="490" class="b">用單一壓力數值取代臨床判斷</text><rect x="215" y="615" width="770" height="80" rx="16" class="g"/><text x="315" y="665" class="h">壓力測量是輔助；臨床高度懷疑不能延誤轉介</text></svg>
