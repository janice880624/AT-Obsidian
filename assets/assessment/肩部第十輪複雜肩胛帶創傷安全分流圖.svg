<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:Noto Sans CJK TC,sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.o{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="55" y="55" class="t">複雜肩胛帶創傷：先生命與肢體安全，再判讀環狀穩定</text><rect x="110" y="95" width="980" height="125" rx="18" class="r"/><text x="205" y="143" class="h">呼吸／胸痛、開放傷、灌流下降、進展麻弱或皮膚受威脅</text><text x="370" y="188" class="b">停止運動、中立支托、創傷中心轉送</text><rect x="80" y="290" width="500" height="245" rx="18" class="o"/><text x="175" y="340" class="h">最小安全檢查</text><text x="120" y="400" class="b">肩帶外觀、胸壁、腋神經、C5–T1</text><text x="120" y="450" class="b">脈搏、回填、顏色與溫度；序列記錄</text><rect x="630" y="290" width="490" height="245" rx="18" class="g"/><text x="750" y="340" class="h">影像與整體型態</text><text x="680" y="400" class="b">X 光起始；CT／三維描述關節面與各中斷</text><text x="680" y="450" class="b">尋找 SSSC 第二處損傷與胸腔合併傷</text><rect x="180" y="620" width="840" height="80" rx="18" class="g"/><text x="260" y="670" class="h">疼痛位置、正常脈搏或單一位移數值都不能單獨清除</text></svg>
