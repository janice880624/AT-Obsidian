<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#172033}.t{font-size:25px;font-weight:700}.h{font-size:18px;font-weight:700}.b{font-size:14px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="55" y="55" class="t">HEEL PAIN / NUMBNESS / MASS — SAFE TRIAGE</text><rect x="110" y="90" width="980" height="115" rx="18" class="r"/><text x="240" y="135" class="h">RED FLAGS: unable to bear weight, progressive weakness, fever, rapid mass</text><text x="455" y="180" class="b">PROTECT — URGENT REFERRAL</text><rect x="65" y="275" width="330" height="245" rx="18" class="x"/><text x="145" y="325" class="h">DEEP BONE PAIN</text><text x="100" y="380" class="b">Protect load; radiograph first</text><text x="100" y="420" class="b">MRI if suspicion persists</text><rect x="435" y="275" width="330" height="245" rx="18" class="x"/><text x="515" y="325" class="h">BURNING / NUMBNESS</text><text x="475" y="380" class="b">Map nerve and possible mass</text><text x="475" y="420" class="b">One Tinel test is insufficient</text><rect x="805" y="275" width="330" height="245" rx="18" class="x"/><text x="875" y="325" class="h">PLANTAR NODULE</text><text x="840" y="380" class="b">Ultrasound / MRI by question</text><text x="840" y="420" class="b">Do not massage unknown mass</text><rect x="180" y="610" width="840" height="85" rx="18" class="g"/><text x="290" y="662" class="h">History + full examination + selected imaging define the next step</text></svg>
