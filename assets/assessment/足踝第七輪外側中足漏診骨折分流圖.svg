<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="40" y="55" class="t">外踝前下與外側中足痛：漏診骨折安全分流</text><rect x="110" y="95" width="980" height="115" rx="16" class="r"/><text x="245" y="140" class="h">變形、不能負重、足底瘀青或神經血管異常？</text><text x="390" y="180" class="b">保護、停止測試並急迫轉介</text><rect x="65" y="275" width="330" height="220" rx="15" class="x"/><text x="120" y="320" class="h">外踝前下定位</text><text x="95" y="365" class="b">跟骨前突、距骨外側突</text><text x="95" y="405" class="b">不可只按外側韌帶處理</text><rect x="435" y="275" width="330" height="220" rx="15" class="x"/><text x="520" y="320" class="h">中足穩定</text><text x="470" y="365" class="b">跟骰、距舟與 Chopart 區</text><text x="470" y="405" class="b">記錄腫脹、瘀青與負重</text><rect x="805" y="275" width="330" height="220" rx="15" class="g"/><text x="870" y="320" class="h">影像決策</text><text x="835" y="365" class="b">足部 AP、側位、斜位 X 光</text><text x="835" y="405" class="b">高疑或關節傷 → CT／MRI</text><rect x="170" y="580" width="860" height="90" rx="16" class="r"/><text x="245" y="635" class="h">疼痛改善或初始 X 光陰性，都不能單獨排除關節面骨折</text></svg>
