<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="45" y="55" class="t">肩部回場：從醫療安全到專項負荷</text><g transform="translate(55 115)"><rect width="250" height="175" rx="15" class="x"/><text x="55" y="42" class="h">1 醫療安全</text><text x="25" y="88" class="b">骨骺／斷裂／神經已評估</text><text x="25" y="125" class="b">無進行性紅旗</text><text x="25" y="158" class="b">活動與症狀基線</text><rect x="275" width="250" height="175" rx="15" class="x"/><text x="335" y="42" class="h">2 基礎容量</text><text x="300" y="88" class="b">旋轉活動與等長力量</text><text x="300" y="125" class="b">肩胛與軀幹控制</text><text x="300" y="158" class="b">推拉與隔日反應</text><rect x="550" width="250" height="175" rx="15" class="x"/><text x="610" y="42" class="h">3 功能負荷</text><text x="575" y="88" class="b">ASH 與多角度力量</text><text x="575" y="125" class="b">速度、疲勞、開閉鏈</text><text x="575" y="158" class="b">全量非接觸訓練</text><rect x="825" width="250" height="175" rx="15" class="x"/><text x="875" y="42" class="h">4 專項回場</text><text x="850" y="88" class="b">投擲／推舉／接觸分級</text><text x="850" y="125" class="b">距離、強度、量逐步增加</text><text x="850" y="158" class="b">連續訓練與共享決策</text></g><rect x="150" y="395" width="900" height="175" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="470" y="438" class="h">共同通關條件</text><text x="190" y="486" class="b">症狀可控｜動作品質穩定｜負荷後隔日回基線｜方法固定可重測</text><text x="190" y="530" class="b">整合個人基準、組織癒合、運動需求與心理準備</text><rect x="165" y="625" width="870" height="50" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="265" y="657" class="b">單次 ASH、左右對稱或無痛活動度，都不足以獨立決定回場。</text></svg>
