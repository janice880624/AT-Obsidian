<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">膝滑膜病灶處置後負荷階梯</title><desc id="d">教育示意圖</desc><rect width="1200" height="675" fill="#fff"/><text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="700" fill="#132238">膝滑膜病灶處置後負荷階梯</text><line x1="60" y1="95" x2="1140" y2="95" stroke="#d7dee8" stroke-width="3"/><g font-family="sans-serif"><rect x="80" y="450" width="230" height="100" rx="18" fill="#dceaf7"/><text x="115" y="495" font-size="22" font-weight="700">1 積液與伸直</text><rect x="330" y="360" width="230" height="190" rx="18" fill="#cfe5da"/><text x="365" y="410" font-size="22" font-weight="700">2 步態與坐站</text><rect x="580" y="270" width="230" height="280" rx="18" fill="#f5e3b8"/><text x="615" y="320" font-size="22" font-weight="700">3 單腳與階梯</text><rect x="830" y="180" width="280" height="370" rx="18" fill="#f3c8bc"/><text x="865" y="230" font-size="22" font-weight="700">4 跑跳與專項</text><path d="M190 420 L1000 140" stroke="#315b7d" stroke-width="6"/><polygon points="990,128 1025,130 1004,154" fill="#315b7d"/><text x="90" y="125" font-size="21" fill="#8b2424">每階段監測：疼痛、積液、出血、傷口與 24 小時反應</text></g><text x="60" y="640" font-family="sans-serif" font-size="18" fill="#526477">教育示意圖｜不取代影像、診斷、病理或專科評估</text></svg>
