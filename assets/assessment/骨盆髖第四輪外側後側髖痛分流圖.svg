<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="42" y="55" class="t">外側／後側髖痛：先安全分流，再做組織假設</text><rect x="120" y="90" width="960" height="115" rx="16" class="r"/><text x="215" y="135" class="h">無法負重、發燒、重大創傷、骨健康高風險或進行性神經症狀？</text><text x="365" y="175" class="b">有：停止挑釁，依急迫度轉送或影像／專科評估</text><rect x="70" y="265" width="330" height="205" rx="14" class="x"/><text x="130" y="310" class="h">外側髖／側躺痛</text><text x="105" y="355" class="b">大轉子與臀肌腱假設</text><text x="105" y="395" class="b">階梯、單腳與壓縮行為</text><text x="105" y="435" class="b">仍排除髖關節與腰椎</text><rect x="435" y="265" width="330" height="205" rx="14" class="x"/><text x="495" y="310" class="h">坐骨端／跑速痛</text><text x="470" y="355" class="b">近端腿後肌與撕裂鑑別</text><text x="470" y="395" class="b">久坐、深髖屈與高速負荷</text><text x="470" y="435" class="b">骨骺與薦骨也要考慮</text><rect x="800" y="265" width="330" height="205" rx="14" class="x"/><text x="865" y="310" class="h">深臀／放射症狀</text><text x="835" y="355" class="b">腰椎神經先完整檢查</text><text x="835" y="395" class="b">深臀測試組僅調整機率</text><text x="835" y="435" class="b">快速無力或足下垂轉介</text><rect x="165" y="545" width="870" height="105" rx="16" class="g"/><text x="335" y="588" class="h">低風險：設定功能基線與 24 小時負荷反應</text><text x="245" y="628" class="b">症狀換區、功能下降或未依預期改善時，回到最上層重新分流</text><text x="225" y="715" class="b">任何單一測試或影像異常都不等於獨立確診或回場許可。</text></svg>
