<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="50" y="55" class="t">重大病因處理後：由安全轉位到專項負荷</text><g transform="translate(45 120)"><rect width="250" height="175" rx="15" class="x"/><text x="70" y="42" class="h">1 醫療許可</text><text x="28" y="88" class="b">感染／腫瘤／血管已處理</text><text x="28" y="128" class="b">神經與生命徵象穩定</text><rect x="275" width="250" height="175" rx="15" class="x"/><text x="345" y="42" class="h">2 日常活動</text><text x="305" y="88" class="b">轉位、短走、舒適活動</text><text x="305" y="128" class="b">記當下與隔日反應</text><rect x="550" width="250" height="175" rx="15" class="x"/><text x="620" y="42" class="h">3 容量建立</text><text x="580" y="88" class="b">步行時間、軀幹與髖力量</text><text x="580" y="128" class="b">一次增加一個變項</text><rect x="825" width="250" height="175" rx="15" class="x"/><text x="890" y="42" class="h">4 專項回場</text><text x="855" y="88" class="b">速度、負重、複雜度</text><text x="855" y="128" class="b">連續訓練與競賽情境</text></g><rect x="145" y="405" width="910" height="170" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="470" y="448" class="h">每階段均須重篩</text><text x="205" y="493" class="b">發燒｜夜間進展痛｜突發劇烈痛｜步態｜無力麻木｜膀胱腸道</text><text x="245" y="535" class="b">症狀改善不等於病因穩定；專科限制與影像情境優先。</text><rect x="160" y="625" width="880" height="50" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="270" y="657" class="b">任何時間敏感警訊：停止活動、記錄基線、立即重新轉介。</text></svg>
