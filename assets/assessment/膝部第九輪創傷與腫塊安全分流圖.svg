<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#172033}.t{font-size:25px;font-weight:700}.h{font-size:18px;font-weight:700}.b{font-size:14px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="55" y="55" class="t">KNEE TRAUMA / MASS / RECURRENT HEMARTHROSIS TRIAGE</text><rect x="110" y="90" width="980" height="115" rx="18" class="r"/><text x="230" y="135" class="h">RED FLAGS: neurovascular loss, fever, rapid growth, unable to bear weight</text><text x="455" y="180" class="b">PROTECT — URGENT REFERRAL</text><rect x="65" y="275" width="330" height="245" rx="18" class="x"/><text x="145" y="325" class="h">TRAUMA / OCCULT BONE</text><text x="100" y="380" class="b">Radiograph first when indicated</text><text x="100" y="420" class="b">CT or MRI if suspicion persists</text><rect x="435" y="275" width="330" height="245" rx="18" class="x"/><text x="525" y="325" class="h">LATERAL MASS / NERVE</text><text x="475" y="380" class="b">Meniscal or PTFJ cyst</text><text x="475" y="420" class="b">Map fibular nerve function</text><rect x="805" y="275" width="330" height="245" rx="18" class="x"/><text x="880" y="325" class="h">RECURRENT HEMARTHROSIS</text><text x="840" y="380" class="b">Infection, bleeding, TGCT, mimics</text><text x="840" y="420" class="b">MRI / aspiration / specialist</text><rect x="180" y="610" width="840" height="85" rx="18" class="g"/><text x="280" y="662" class="h">A single test cannot identify fracture, cyst cause or synovial tumour</text></svg>
