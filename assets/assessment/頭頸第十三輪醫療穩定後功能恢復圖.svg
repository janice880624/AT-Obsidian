<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650"><rect width="1200" height="650" fill="#f8fafc"/><text x="55" y="65" font-family="sans-serif" font-size="34">頸椎術後醫療穩定後功能恢復</text><g font-family="sans-serif" font-size="22" text-anchor="middle"><rect x="55" y="170" width="245" height="120" rx="18" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/><rect x="340" y="170" width="245" height="120" rx="18" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/><rect x="625" y="170" width="245" height="120" rx="18" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/><rect x="910" y="170" width="245" height="120" rx="18" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/><text x="177" y="220">傷口、氣道</text><text x="177" y="255">神經與構造穩定</text><text x="462" y="220">安全活動</text><text x="462" y="255">C5 肩肘控制</text><text x="747" y="220">頸肩耐力</text><text x="747" y="255">手步功能</text><text x="1032" y="220">工作／運動</text><text x="1032" y="255">個別化回場</text><path d="M300 230 H340 M585 230 H625 M870 230 H910" stroke="#334155" stroke-width="5"/><rect x="170" y="390" width="860" height="130" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="600" y="440">監測：頸腫、吞嚥／呼吸、發燒滲液、新發麻弱、步態與隔日反應</text><text x="600" y="485">任何紅旗 → 停止並聯絡手術團隊</text></g></svg>