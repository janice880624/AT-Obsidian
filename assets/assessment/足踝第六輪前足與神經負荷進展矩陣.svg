<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:29px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.x{fill:#fff;stroke:#52677f;stroke-width:3}.a{fill:#eff6ff;stroke:#2563eb;stroke-width:3}.p{fill:#fff7ed;stroke:#ea580c;stroke-width:3}</style><text x="45" y="52" class="t">足踝第六輪負荷矩陣：前足骨關節與足背神經</text><rect x="75" y="105" width="500" height="220" rx="16" class="a"/><text x="210" y="150" class="h">Freiberg／Iselin</text><text x="110" y="195" class="b">早期：鞋具、卸載、停止疼痛性衝擊</text><text x="110" y="235" class="b">中期：步行、力量、雙腳至單腳踮足</text><text x="110" y="275" class="b">後期：跑走、跳躍、變向與專項</text><rect x="625" y="105" width="500" height="220" rx="16" class="p"/><text x="775" y="150" class="h">前跗管症候群</text><text x="660" y="195" class="b">早期：移除鞋帶／護具壓迫</text><text x="660" y="235" class="b">中期：活動、低劑量神經滑動與力量</text><text x="660" y="275" class="b">後期：鞋具內跑跳與連續訓練</text><g transform="translate(85 405)"><rect width="240" height="120" rx="14" class="x"/><text x="52" y="42" class="h">1 日常穩定</text><text x="30" y="82" class="b">症狀與隔日回復</text><rect x="265" width="240" height="120" rx="14" class="x"/><text x="318" y="42" class="h">2 慢速力量</text><text x="297" y="82" class="b">組織與神經耐受</text><rect x="530" width="240" height="120" rx="14" class="x"/><text x="585" y="42" class="h">3 速度／彈性</text><text x="560" y="82" class="b">低幅至專項速度</text><rect x="795" width="240" height="120" rx="14" class="x"/><text x="850" y="42" class="h">4 連續訓練</text><text x="825" y="82" class="b">密度與回場決策</text></g><text x="230" y="625" class="b">一次主要增加一項：角度｜重量｜速度｜跑量｜鞋具；監測 24–48 小時。</text><text x="215" y="675" class="b">骨折未癒合、進行性無力、足下垂或新紅旗不走此進展線。</text></svg>
