<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="45" y="55" class="t">拇指與手指握捏負荷：由滑動控制到專項任務</text><g transform="translate(55 115)"><rect width="250" height="180" rx="15" class="x"/><text x="62" y="42" class="h">1 安全基線</text><text x="25" y="88" class="b">感染、骨傷與固定鎖住已處理</text><text x="25" y="128" class="b">神經血管與傷口穩定</text><rect x="275" width="250" height="180" rx="15" class="x"/><text x="338" y="42" class="h">2 滑動控制</text><text x="300" y="88" class="b">對掌、腱滑動、低力等長</text><text x="300" y="128" class="b">腕中立與拇指弓形</text><rect x="550" width="250" height="180" rx="15" class="x"/><text x="615" y="42" class="h">3 多種握型</text><text x="575" y="88" class="b">側捏、三點捏、柱狀握</text><text x="575" y="128" class="b">握徑、持續時間與旋轉</text><rect x="825" width="250" height="180" rx="15" class="x"/><text x="875" y="42" class="h">4 專項容量</text><text x="850" y="88" class="b">工具、開罐、球拍與速度</text><text x="850" y="128" class="b">時長與連續訓練進展</text></g><rect x="150" y="405" width="900" height="170" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="475" y="447" class="h">每一階段都記錄</text><text x="210" y="495" class="b">負荷｜次數或時間｜卡彈｜熟悉疼痛｜動作品質｜隔日反應</text><text x="250" y="535" class="b">一次主要增加一個變項，輔具與較大握徑也是有效策略</text><rect x="165" y="625" width="870" height="50" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="235" y="657" class="b">紅熱腫脹、被動伸直劇痛、固定鎖住或神經血管變化時停止訓練。</text></svg>
