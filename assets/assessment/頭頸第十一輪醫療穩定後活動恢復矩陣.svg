<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:17px}.a{fill:#dbeafe;stroke:#2563eb;stroke-width:4}.g{fill:#dcfce7;stroke:#16a34a;stroke-width:4}.o{fill:#ffedd5;stroke:#ea580c;stroke-width:4}</style><text x="55" y="55" class="t">Return to Activity After Medical Stabilization</text><rect x="70" y="120" width="320" height="400" rx="20" class="a"/><text x="145" y="175" class="h">STAGE 1: BASELINE</text><text x="110" y="245" class="b">Medical clearance</text><text x="110" y="295" class="b">Neuro / vital signs</text><text x="110" y="345" class="b">Short easy walking</text><rect x="440" y="120" width="320" height="400" rx="20" class="g"/><text x="530" y="175" class="h">STAGE 2: BUILD</text><text x="480" y="245" class="b">Time before intensity</text><text x="480" y="295" class="b">Low-load strength</text><text x="480" y="345" class="b">24-hour response</text><rect x="810" y="120" width="320" height="400" rx="20" class="o"/><text x="885" y="175" class="h">STAGE 3: SPORT</text><text x="850" y="245" class="b">Non-contact skills</text><text x="850" y="295" class="b">Speed / load later</text><text x="850" y="345" class="b">Contact by specialist</text><text x="150" y="635" class="h">New neurologic, fever, severe pain, Horner or torticollis: STOP and reassess.</text></svg>
