<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#fff"/><text x="60" y="65" font-family="sans-serif" font-size="34">肘腫脹、積血與青少年機械症狀：安全分流</text><g font-family="sans-serif" font-size="22" text-anchor="middle"><rect x="360" y="105" width="480" height="85" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/><text x="600" y="145">敗血／快速出血／進展麻弱／硬性鎖住？</text><text x="600" y="175">是 → 停止測試、保護並急診或加速專科</text><path d="M600 190 V280 M600 280 H200 V340 M600 280 V340 M600 280 H1000 V340" fill="none" stroke="#334155" stroke-width="5"/><rect x="55" y="340" width="290" height="200" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/><text x="200" y="390">紅熱鷹嘴</text><text x="200" y="430">感染可與痛風並存</text><text x="200" y="470">醫療抽液／培養／晶體</text><text x="200" y="510">不可自行穿刺</text><rect x="455" y="340" width="290" height="200" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="600" y="390">反覆非創傷積血</text><text x="600" y="430">凝血＋MRI／都卜勒</text><text x="600" y="470">血管／腫瘤團隊</text><text x="600" y="510">避免按摩針刺</text><rect x="855" y="340" width="290" height="200" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="1000" y="390">青少年後肘／鎖住</text><text x="1000" y="430">骨齡＋雙側 X 光</text><text x="1000" y="470">必要時 MRI／CT</text><text x="1000" y="510">先停止投擲</text><text x="600" y="640">活動仍可、體溫正常或單一特殊檢查，都不能排除感染或深部病灶</text></g><text x="60" y="730" font-family="sans-serif" font-size="19" fill="#475569">原創示意圖｜CC BY 4.0</text></svg>