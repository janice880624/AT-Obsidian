<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:29px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:15px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="40" y="55" class="t">高能量肩帶創傷：神經血管優先分流</text><rect x="90" y="95" width="1020" height="120" rx="16" class="r"/><text x="195" y="140" class="h">ABCDE、頸椎與出血控制優先；高能量機轉即保持高度警覺</text><text x="250" y="180" class="b">肩帶外移、休克、灌流差或廣泛神經缺失：立即創傷中心</text><rect x="70" y="285" width="320" height="220" rx="14" class="x"/><text x="145" y="330" class="h">灌流</text><text x="105" y="380" class="b">脈搏、回填、溫度、顏色</text><text x="105" y="425" class="b">有脈搏不排除血管傷</text><rect x="440" y="285" width="320" height="220" rx="14" class="x"/><text x="520" y="330" class="h">神經</text><text x="475" y="380" class="b">C5–T1 感覺與遠端運動</text><text x="475" y="425" class="b">廣泛缺失提示近端臂叢傷</text><rect x="810" y="285" width="320" height="220" rx="14" class="x"/><text x="885" y="330" class="h">肩帶／胸廓</text><text x="845" y="380" class="b">外移、巨大腫脹、呼吸困難</text><text x="845" y="425" class="b">禁牽引、禁反覆整復</text><rect x="145" y="575" width="910" height="95" rx="16" class="g"/><text x="265" y="615" class="h">原位支托、連續再評估、快速 EMS；影像不可延誤復甦</text><text x="375" y="652" class="b">教育流程圖，不取代當地創傷流程。</text></svg>
