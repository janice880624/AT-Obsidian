<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="42" y="55" class="t">前骨盆／核心肌肉負荷：由日常到跑踢變向</text><g transform="translate(55 115)"><rect width="250" height="190" rx="15" class="x"/><text x="55" y="42" class="h">1 安全與低力</text><text x="25" y="90" class="b">排急腹、疝、感染與骨傷</text><text x="25" y="130" class="b">呼吸、腹壁與內收等長</text><text x="25" y="170" class="b">維持可耐受體能</text><rect x="275" width="250" height="190" rx="15" class="x"/><text x="330" y="42" class="h">2 慢速力量</text><text x="300" y="90" class="b">橋式、分腿、側向支撐</text><text x="300" y="130" class="b">髖內收與抗旋轉</text><text x="300" y="170" class="b">記錄隔日反應</text><rect x="550" width="250" height="190" rx="15" class="x"/><text x="605" y="42" class="h">3 跑步與切入</text><text x="575" y="90" class="b">跑走、加速、煞停</text><text x="575" y="130" class="b">增加方向與角度</text><text x="575" y="170" class="b">一次主改一項</text><rect x="825" width="250" height="190" rx="15" class="x"/><text x="885" y="42" class="h">4 踢擊與回場</text><text x="850" y="90" class="b">踢球強度與次數</text><text x="850" y="130" class="b">連續訓練與比賽模擬</text><text x="850" y="170" class="b">共享決策</text></g><rect x="150" y="440" width="900" height="145" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="435" y="482" class="h">共同監測：四個維度</text><text x="205" y="530" class="b">熟悉症狀與位置｜力量與動作品質｜當下功能｜24–48 小時回復</text><text x="220" y="565" class="b">骨壓力傷回跑另須依醫療端、負重與骨健康條件</text><rect x="170" y="625" width="860" height="50" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="225" y="657" class="b">新腫塊、急腹、走路骨痛、發燒或神經無力：停止並重新分流。</text></svg>
