<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="45" y="55" class="t">手腕與手第六輪：先分流缺血、骨性與腫塊紅旗</text><rect x="135" y="90" width="930" height="110" rx="16" class="r"/><text x="250" y="132" class="h">手冷變色、灌流差、指端傷口或進行性神經症狀？</text><text x="390" y="170" class="b">停止負荷與反覆測試，急迫轉介</text><rect x="80" y="250" width="320" height="220" rx="14" class="x"/><text x="140" y="292" class="h">骨骼未成熟＋承重痛</text><text x="112" y="340" class="b">遠端橈骨壓痛／休息痛</text><text x="112" y="380" class="b">停止疼痛性承重</text><text x="112" y="420" class="b">醫療評估與影像追蹤</text><rect x="440" y="250" width="320" height="220" rx="14" class="x"/><text x="530" y="292" class="h">腕背硬固定腫塊</text><text x="475" y="340" class="b">考慮 carpal boss</text><text x="475" y="380" class="b">與囊腫／腱滑動鑑別</text><text x="475" y="420" class="b">影像需與症狀一致</text><rect x="800" y="250" width="320" height="220" rx="14" class="x"/><text x="885" y="292" class="h">柔軟或隱匿腫塊</text><text x="835" y="340" class="b">考慮腕背囊腫</text><text x="835" y="380" class="b">快速增大／非典型需轉介</text><text x="835" y="420" class="b">禁止自行重擊或穿刺</text><rect x="180" y="545" width="840" height="95" rx="16" class="g"/><text x="350" y="586" class="h">低風險才進入分級承重與追蹤</text><text x="300" y="622" class="b">單一 Allen、觸診或正常平片都不能獨立排除病變</text><text x="170" y="710" class="b">此圖用於教育與現場分流，不取代急診、影像、血管或手外科診斷。</text></svg>
