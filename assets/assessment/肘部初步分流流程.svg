<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" font-size="36" font-family="sans-serif" fill="#17324d">肘部初步分流流程</text><g font-family="sans-serif" text-anchor="middle"><rect x="400" y="90" width="400" height="80" rx="16" fill="#dbeafe"/><text x="600" y="140" font-size="25">肘痛／肘部創傷</text><rect x="365" y="225" width="470" height="110" rx="16" fill="#fee2e2"/><text x="600" y="270" font-size="23">畸形、骨折／脫臼、開放傷、</text><text x="600" y="305" font-size="23">神經血管、感染或機械性卡住？</text><rect x="70" y="430" width="410" height="115" rx="16" fill="#fecaca"/><text x="275" y="478" font-size="24">是：停止一般測試</text><text x="275" y="514" font-size="24">固定／急救／緊急轉介</text><rect x="720" y="430" width="410" height="115" rx="16" fill="#dcfce7"/><text x="925" y="478" font-size="24">否：系統性檢查</text><text x="925" y="514" font-size="24">活動、力量、神經、功能</text><rect x="720" y="640" width="410" height="105" rx="16" fill="#fef3c7"/><text x="925" y="684" font-size="24">依假設選擇少量測試</text><text x="925" y="718" font-size="24">重測或適當轉介</text></g><g stroke="#64748b" stroke-width="5" fill="none"><line x1="600" y1="170" x2="600" y2="225"/><path d="M365 280 H275 V430"/><path d="M835 280 H925 V430"/><line x1="925" y1="545" x2="925" y2="640"/></g><text x="275" y="400" font-size="22" font-family="sans-serif" fill="#991b1b">有</text><text x="925" y="400" font-size="22" font-family="sans-serif" fill="#166534">無</text><text x="600" y="790" text-anchor="middle" font-size="19" font-family="sans-serif" fill="#475569">教學流程，不取代機構緊急處置 SOP</text></svg>
