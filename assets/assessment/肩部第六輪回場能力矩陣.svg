<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}</style><text x="45" y="55" class="t">肩不穩定回場：四個能力面向</text><g transform="translate(60 120)"><rect width="245" height="200" rx="15" class="x"/><text x="55" y="45" class="h">症狀與信心</text><text x="28" y="95" class="b">無滑脫、恐懼可控</text><text x="28" y="135" class="b">睡眠與隔日穩定</text><text x="28" y="175" class="b">能說明自我監測</text><rect x="270" width="245" height="200" rx="15" class="x"/><text x="325" y="45" class="h">臨床能力</text><text x="298" y="95" class="b">活動度與方向性力量</text><text x="298" y="135" class="b">本體覺與肩胛控制</text><text x="298" y="175" class="b">神經血管穩定</text><rect x="540" width="245" height="200" rx="15" class="x"/><text x="595" y="45" class="h">功能表現</text><text x="568" y="95" class="b">PSET＋推拉／閉鏈</text><text x="568" y="135" class="b">速度、疲勞與動作品質</text><text x="568" y="175" class="b">不只看側別對稱</text><rect x="810" width="245" height="200" rx="15" class="x"/><text x="865" y="45" class="h">運動暴露</text><text x="838" y="95" class="b">投擲、接觸、重量訓練</text><text x="838" y="135" class="b">完整訓練與連續日</text><text x="838" y="175" class="b">共享決策</text></g><rect x="170" y="430" width="860" height="140" rx="16" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="370" y="475" class="h">進展：一次改一個主要負荷變因</text><text x="235" y="520" class="b">角度 → 阻力 → 速度 → 次數 → 不確定性；每階段檢查當下與隔日反應。</text><text x="180" y="650" class="b">回場不是單次測驗；疑骨缺損、HAGL 或反覆失穩時須納入肩專科計畫。</text></svg>
