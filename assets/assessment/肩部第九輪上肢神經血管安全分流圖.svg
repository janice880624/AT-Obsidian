<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.o{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="55" y="55" class="t">過頭運動後單側手臂症狀：先排血管急症</text><rect x="110" y="95" width="980" height="115" rx="18" class="r"/><text x="220" y="142" class="h">整臂急腫發紺、蒼白冰冷、指端缺血或胸痛呼吸困難</text><text x="430" y="182" class="b">停止運動、不按摩、不壓迫，立即急診</text><rect x="80" y="285" width="500" height="250" rx="18" class="o"/><text x="180" y="335" class="h">靜脈型線索</text><text x="120" y="395" class="b">腫脹、沉重、發紺、表淺側枝</text><text x="120" y="445" class="b">脈搏存在仍不能排除血栓</text><rect x="630" y="285" width="490" height="250" rx="18" class="g"/><text x="750" y="335" class="h">動脈／神經型線索</text><text x="680" y="395" class="b">蒼白冰冷、回填慢／疼麻無力與疲勞</text><text x="680" y="445" class="b">以完整神經血管與鑑別診斷整合</text><rect x="180" y="615" width="840" height="80" rx="18" class="g"/><text x="290" y="665" class="h">EAST、Adson 或單一脈搏變化不能決定診斷或轉介</text></svg>
