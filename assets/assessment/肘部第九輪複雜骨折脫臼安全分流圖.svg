<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.r{fill:#fff1f2;stroke:#be123c;stroke-width:4}.x{fill:#fff;stroke:#52677f;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="65" y="56" class="t">急性複雜肘骨折脫臼：先安全，再分類</text><rect x="130" y="95" width="940" height="120" rx="20" class="r"/><text x="235" y="140" class="h">開放傷／皮膚張力／手冷蒼白／回填延長／進展麻弱？</text><text x="390" y="182" class="b">原位支托、連續神經血管監測、立即急診骨科</text><rect x="80" y="285" width="460" height="250" rx="18" class="x"/><text x="185" y="330" class="h">現場可安全完成</text><text x="130" y="385" class="b">觀察＋全上肢輕觸</text><text x="130" y="430" class="b">橈／正中／尺神經＋灌流</text><text x="130" y="475" class="b">支托前後重複並記錄時間</text><rect x="660" y="285" width="460" height="250" rx="18" class="x"/><text x="790" y="330" class="h">不應執行</text><text x="710" y="385" class="b">自行復位、牽拉、內外翻測試</text><text x="710" y="430" class="b">承重、握力或反覆活動</text><text x="710" y="475" class="b">以正常脈搏宣告低風險</text><rect x="205" y="610" width="790" height="85" rx="18" class="g"/><text x="310" y="662" class="h">X 光先行；CT 用於骨片、關節相合與手術規劃</text></svg>
