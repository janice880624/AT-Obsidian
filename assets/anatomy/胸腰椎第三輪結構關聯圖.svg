<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.v{fill:#eadfcb;stroke:#6c6252;stroke-width:3}.n{stroke:#eab308;stroke-width:8;fill:none}.l{stroke:#dc2626;stroke-width:7}</style><text x="45" y="55" class="t">胸腰椎第三輪：結構、神經與成長期線索</text><g transform="translate(95 105)"><rect x="250" y="0" width="135" height="85" rx="20" class="v"/><rect x="240" y="110" width="155" height="90" rx="20" class="v"/><rect x="225" y="230" width="185" height="100" rx="20" class="v"/><rect x="210" y="365" width="210" height="110" rx="20" class="v"/><path d="M320 15V455" class="n"/><path d="M215 95L405 95M205 215L420 215M190 350L440 350" class="l"/><path d="M235 150Q105 145 55 235M400 150Q530 145 580 235" fill="none" stroke="#2563eb" stroke-width="8"/><text x="35" y="540" class="h">藍：肋椎關節　黃：胸髓　紅：棘上／棘間韌帶</text></g><g transform="translate(730 125)"><rect width="390" height="90" rx="14" fill="#fff1f2" stroke="#be123c" stroke-width="3"/><text x="55" y="38" class="h">雙腿僵硬／感覺平面</text><text x="78" y="70" class="b">先排除胸髓與長傳導徑</text><rect y="130" width="390" height="90" rx="14" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="60" y="168" class="h">成長期局部伸展痛</text><text x="70" y="200" class="b">骨應力／滑脫需分流</text><rect y="260" width="390" height="90" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="3"/><text x="62" y="298" class="h">固定胸椎後凸外觀</text><text x="80" y="330" class="b">區分姿勢性與結構性</text><rect y="390" width="390" height="90" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="62" y="428" class="h">呼吸或環帶狀胸背痛</text><text x="82" y="460" class="b">肋廓、神經與內臟鑑別</text></g><text x="115" y="690" class="b">非比例解剖圖；疼痛位置與外觀不能取代神經學、影像適應症與完整分流。</text></svg>
