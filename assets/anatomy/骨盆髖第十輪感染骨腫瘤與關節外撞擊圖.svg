<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.bone{fill:#fef3c7;stroke:#b45309;stroke-width:4}.inf{fill:#fee2e2;stroke:#be123c;stroke-width:4}.tum{fill:#dbeafe;stroke:#1d4ed8;stroke-width:4}.imp{fill:#ecfdf5;stroke:#047857;stroke-width:4}</style><text x="55" y="55" class="t">骨盆與髖：深部感染、近端股骨病灶與關節外撞擊</text><path d="M270 165Q170 300 260 570L430 610Q500 470 455 250Z" class="bone"/><rect x="145" y="265" width="165" height="150" rx="70" class="inf"/><text x="75" y="450" class="h">髂腰肌筋膜間隙</text><text x="75" y="485" class="b">膿瘍可表現為深部腹股溝痛</text><circle cx="720" cy="335" r="150" class="bone"/><circle cx="720" cy="335" r="48" class="tum"/><text x="600" y="550" class="h">近端股骨骨骺病灶</text><text x="585" y="585" class="b">影像與病理決定腫瘤類型</text><path d="M950 170L1050 310L940 350L850 235Z" class="imp"/><text x="835" y="410" class="h">髂前下棘下空間</text><text x="810" y="445" class="b">深屈髖接觸需整合症狀與影像</text><text x="210" y="705" class="h">非比例教學示意；表面壓痛或單一誘發動作不能確認深部病因</text></svg>
