<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">肩帶骨性創傷關聯圖</title>
  <desc id="desc">以非比例方式顯示胸骨、鎖骨、肩胛骨與肱骨近端，標示常見創傷區與胸鎖關節後方的重要結構風險。</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#0f172a">肩帶骨性創傷：先看結構，再看生命／肢體風險</text>
  <rect x="70" y="145" width="170" height="390" rx="30" fill="#e2e8f0" stroke="#475569" stroke-width="5"/>
  <text x="155" y="350" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#334155">胸骨</text>
  <path d="M230 220 C390 120 610 145 790 230" fill="none" stroke="#eab308" stroke-width="34" stroke-linecap="round"/>
  <circle cx="250" cy="211" r="35" fill="#fee2e2" stroke="#dc2626" stroke-width="6"/>
  <text x="260" y="125" font-family="sans-serif" font-size="25" fill="#991b1b">胸鎖關節</text>
  <text x="338" y="196" font-family="sans-serif" font-size="25" fill="#854d0e">鎖骨</text>
  <path d="M760 235 Q920 135 1050 280 Q985 525 750 555 Q830 410 760 235 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="6"/>
  <circle cx="796" cy="262" r="54" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="6"/>
  <path d="M820 295 L890 590" stroke="#fb923c" stroke-width="58" stroke-linecap="round"/>
  <text x="916" y="520" font-family="sans-serif" font-size="25" fill="#9a3412">肱骨近端</text>
  <text x="928" y="305" font-family="sans-serif" font-size="25" fill="#1e40af">肩胛骨</text>
  <path d="M145 570 H1050" stroke="#94a3b8" stroke-width="2"/>
  <g font-family="sans-serif" font-size="22" fill="#0f172a">
    <text x="95" y="620">紅旗：呼吸／吞嚥困難、聲音改變、脈搏差異、進行性神經缺損</text>
    <text x="95" y="660">本圖為臨床關聯示意，非比例解剖圖，也不取代影像。</text>
  </g>
</svg>

