<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:29px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:15px}.bone{fill:#fef3c7;stroke:#92400e;stroke-width:5}.art{fill:none;stroke:#dc2626;stroke-width:9}.bad{fill:#7f1d1d;opacity:.78}.box{fill:#fff;stroke:#64748b;stroke-width:3}</style><text x="42" y="56" class="t">肱骨頭血供與骨壞死進展：概念示意</text><circle cx="325" cy="350" r="185" class="bone"/><path d="M325 535 L325 700" stroke="#92400e" stroke-width="90"/><path d="M90 590 Q130 260 220 235" class="art"/><path d="M555 590 Q520 260 430 235" class="art"/><circle cx="335" cy="305" r="74" class="bad"/><text x="255" y="310" class="h" fill="#fff">缺血區</text><rect x="650" y="140" width="470" height="420" rx="16" class="box"/><text x="700" y="195" class="h">進展概念</text><text x="700" y="250" class="b">早期：疼痛，X 光可能正常</text><text x="700" y="310" class="b">中期：軟骨下骨折／新月徵</text><text x="700" y="370" class="b">晚期：關節面塌陷與退化</text><text x="700" y="450" class="b">MRI 可較早顯示病灶</text><text x="700" y="510" class="b">分期需整合症狀、病因與病灶大小</text><text x="270" y="735" class="b">原創非比例教學圖；不取代影像診斷。</text></svg>
