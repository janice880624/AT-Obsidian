<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:29px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.bone{fill:#eadfcb;stroke:#675f52;stroke-width:4}.tendon{fill:none;stroke:#2563eb;stroke-width:12}.plate{fill:#e11d48;stroke:#881337;stroke-width:3}.coal{fill:#f59e0b;stroke:#92400e;stroke-width:4}</style><text x="40" y="52" class="t">足踝第五輪：腓骨肌腱、蹠板與跗骨聯合</text><rect x="100" y="130" width="100" height="330" rx="40" class="bone"/><path d="M155 120 Q75 275 160 515" class="tendon"/><path d="M185 120 Q115 280 205 520" class="tendon"/><text x="55" y="570" class="h">外踝後方</text><text x="35" y="610" class="b">支持帶限制肌腱前移</text><ellipse cx="585" cy="220" rx="110" ry="70" class="bone"/><rect x="535" y="285" width="100" height="210" rx="35" class="bone"/><path d="M500 278 Q585 325 670 278 L655 335 Q585 370 515 335Z" class="plate"/><text x="475" y="550" class="h">第二蹠趾蹠板</text><text x="445" y="590" class="b">限制近節趾骨背移與過度背屈</text><path d="M900 170 Q1035 165 1055 310 Q1040 455 885 500 Q810 380 835 245Z" class="bone"/><path d="M900 260 Q950 315 995 270" class="coal"/><path d="M870 365 Q925 415 980 365" class="coal"/><text x="835" y="565" class="h">常見聯合區</text><text x="795" y="605" class="b">跟舟與距跟；可為纖維、軟骨或骨性</text><text x="270" y="700" class="b">示意圖非比例；症狀與影像必須整合，解剖變異不等於疾病。</text></svg>
