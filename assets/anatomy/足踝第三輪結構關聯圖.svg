<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.bone{fill:#eadfcb;stroke:#6c6252;stroke-width:4}.tendon{stroke:#dc2626;stroke-width:10;fill:none}.lig{stroke:#2563eb;stroke-width:8;fill:none}.nerve{stroke:#eab308;stroke-width:7;fill:none}</style><text x="45" y="55" class="t">足踝第三輪：內側穩定、後脛肌腱與前足推蹬</text><path class="bone" d="M355 95L480 95L520 315L390 350Z"/><path class="bone" d="M420 350Q540 295 670 370L620 505Q500 520 385 450Z"/><path class="bone" d="M630 420L935 500L900 590L610 510Z"/><ellipse cx="935" cy="535" rx="58" ry="72" class="bone"/><path class="tendon" d="M330 100Q310 360 520 505Q660 560 820 545"/><path class="lig" d="M410 300L520 440M410 300L600 390"/><path class="nerve" d="M365 115Q340 320 430 430Q520 500 680 580"/><text x="720" y="145" class="h">紅：後脛肌腱</text><text x="720" y="180" class="b">內踝後方轉向舟骨</text><text x="720" y="235" class="h">藍：三角韌帶</text><text x="720" y="270" class="b">內踝至距／跟／舟骨</text><text x="720" y="325" class="h">黃：脛神經</text><text x="720" y="360" class="b">通過足根管至足底分支</text><text x="405" y="675" class="b">前足第一蹠趾與籽骨負責推蹬；本圖為非比例教學示意。</text></svg>
