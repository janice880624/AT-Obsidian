<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.bone{fill:#eadfcb;stroke:#6c6252;stroke-width:4}.lig{stroke:#2563eb;stroke-width:12;fill:none}.mus{fill:#fca5a5;stroke:#be123c;stroke-width:4}.nerve{stroke:#eab308;stroke-width:8;fill:none}</style><text x="45" y="55" class="t">肘部第四輪：近端橈尺關節、環狀韌帶與旋前結構</text><path class="bone" d="M320 120Q250 210 300 310L260 630H360L390 315Q450 210 380 120Z"/><path class="bone" d="M520 170Q465 230 505 305L515 630H610L595 295Q630 220 580 170Z"/><ellipse cx="550" cy="240" rx="75" ry="58" class="bone"/><ellipse cx="550" cy="240" rx="90" ry="75" class="lig"/><path class="mus" d="M315 255Q520 335 595 500Q520 535 440 455Q375 370 290 325Z"/><path class="nerve" d="M390 100Q410 245 425 340Q450 500 470 650"/><text x="720" y="145" class="h">藍：橈骨環狀韌帶</text><text x="720" y="180" class="b">穩定橈骨頭並允許旋前旋後</text><text x="720" y="245" class="h">紅：旋前圓肌</text><text x="720" y="280" class="b">反覆旋前負荷與正中神經通道相鄰</text><text x="720" y="345" class="h">黃：正中神經路徑示意</text><text x="720" y="380" class="b">症狀需與腕隧道、AIN 與頸部鑑別</text><text x="235" y="690" class="b">非比例教學圖；表面觸診不能定位神經壓迫或韌帶損傷。</text></svg>
