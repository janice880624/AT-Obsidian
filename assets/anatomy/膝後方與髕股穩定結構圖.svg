<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"><rect width="1100" height="700" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:32px;font-weight:700}.h{font-size:24px;font-weight:700}.b{font-size:20px}.bone{fill:#e7e0cf;stroke:#6b6255;stroke-width:5}.lig{stroke:#147d92;stroke-width:18;stroke-linecap:round}.plc{stroke:#d97706;stroke-width:13;stroke-linecap:round}.pat{fill:#f2c3c7;stroke:#9f3545;stroke-width:5}</style><text x="50" y="55" class="t">膝後方與髕股穩定結構（概念圖）</text><g transform="translate(90 110)"><path class="bone" d="M150 0h260l-25 165-85 45-95-42z"/><path class="bone" d="M185 320l35-120h160l40 120v250H185z"/><line class="lig" x1="310" y1="145" x2="260" y2="350"/><line class="plc" x1="400" y1="120" x2="430" y2="365"/><line class="plc" x1="365" y1="165" x2="470" y2="420"/><text x="0" y="620" class="b">青：PCL（限制脛骨後移）　橘：PLC 主要穩定結構（簡化）</text></g><g transform="translate(650 130)"><path class="bone" d="M70 0h280l-25 160-230 0z"/><path class="pat" d="M145 110q65-75 130 0v145q-65 65-130 0z"/><line class="lig" x1="145" y1="180" x2="70" y2="210"/><text x="30" y="330" class="h">髕股關節</text><text x="0" y="375" class="b">早期屈曲：軟組織限制外移</text><text x="0" y="410" class="b">屈曲增加：滑車骨性限制增加</text></g><rect x="55" y="630" width="990" height="42" rx="10" fill="#e8eef7"/><text x="72" y="658" class="b">非比例解剖圖；用於連結臨床概念，不用來判定病灶或手術位置。</text></svg>
