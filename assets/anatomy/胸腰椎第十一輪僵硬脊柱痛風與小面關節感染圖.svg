<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#fff"/><style>text{font-family:sans-serif;fill:#172033}.h{font-size:38px;font-weight:700}.t{font-size:24px}.s{font-size:19px}.b{fill:#eef4ff;stroke:#2356a8;stroke-width:3}.r{fill:#fff0ee;stroke:#b63a2b;stroke-width:3}.g{fill:#eff9f0;stroke:#2f7d45;stroke-width:3}</style><text x="60" y="65" class="h">胸腰椎第十一輪：三條臨床路徑</text><rect x="60" y="115" rx="20" width="330" height="470" class="b"/><text x="90" y="165" class="t">DISH／僵硬脊柱</text><text x="90" y="215" class="s">前外側骨橋</text><text x="90" y="255" class="s">長槓桿效應</text><text x="90" y="295" class="s">低能量也可不穩定骨折</text><path d="M150 360 Q225 330 300 360 M150 410 Q225 380 300 410 M150 460 Q225 430 300 460" fill="none" stroke="#2356a8" stroke-width="14"/><rect x="435" y="115" rx="20" width="330" height="470" class="g"/><text x="465" y="165" class="t">軸性脊椎痛風</text><text x="465" y="215" class="s">小面關節／韌帶沉積</text><text x="465" y="255" class="s">可模仿感染或腫瘤</text><text x="465" y="295" class="s">正常血尿酸不能排除</text><circle cx="600" cy="415" r="72" fill="#c8ebcf" stroke="#2f7d45" stroke-width="12"/><circle cx="625" cy="390" r="18" fill="#f3cd57"/><circle cx="575" cy="440" r="14" fill="#f3cd57"/><rect x="810" y="115" rx="20" width="330" height="470" class="r"/><text x="840" y="165" class="t">小面關節感染</text><text x="840" y="215" class="s">菌血症與滑膜關節</text><text x="840" y="255" class="s">可延伸旁脊肌／硬膜外</text><text x="840" y="295" class="s">無發燒仍不能排除</text><circle cx="975" cy="415" r="72" fill="#ffd5cf" stroke="#b63a2b" stroke-width="12"/><path d="M930 415h90M975 370v90" stroke="#b63a2b" stroke-width="16"/><text x="60" y="650" class="s">原創教學圖｜非比例｜CC BY 4.0｜不能取代影像、培養、病理或專科評估</text></svg>
