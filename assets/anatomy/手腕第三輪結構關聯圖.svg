<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.bone{fill:#eadfcb;stroke:#6c6252;stroke-width:3}.lig{stroke:#dc2626;stroke-width:9}.ten{stroke:#2563eb;stroke-width:8;fill:none}.nerve{stroke:#eab308;stroke-width:8;fill:none}</style><text x="45" y="55" class="t">手腕與手第三輪：結構與症狀線索</text><g transform="translate(90 105)"><rect class="bone" x="190" y="0" width="95" height="270" rx="38"/><rect class="bone" x="315" y="0" width="82" height="270" rx="34"/><circle class="bone" cx="240" cy="315" r="58"/><circle class="bone" cx="350" cy="315" r="58"/><path class="lig" d="M275 305L315 305"/><path class="ten" d="M250 25Q245 205 305 430Q350 520 430 575"/><path class="nerve" d="M455 30Q405 180 450 305Q510 385 575 430"/><text x="20" y="635" class="h">紅：舟月韌帶　藍：伸拇長肌腱　黃：橈神經淺支</text></g><g transform="translate(720 120)"><rect width="390" height="95" rx="14" fill="#fff1f2" stroke="#be123c" stroke-width="3"/><text x="42" y="40" class="h">背橈側深層痛／喀響</text><text x="55" y="75" class="b">舟月穩定與隱匿骨折鑑別</text><rect y="135" width="390" height="95" rx="14" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="48" y="175" class="h">拇指 IP 主動伸展喪失</text><text x="60" y="210" class="b">EPL 連續性與後骨間神經</text><rect y="270" width="390" height="95" rx="14" fill="#fffbeb" stroke="#a16207" stroke-width="3"/><text x="45" y="310" class="h">背橈側麻刺／觸碰過敏</text><text x="58" y="345" class="b">橈神經淺支與外部壓迫</text><rect y="405" width="390" height="95" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="3"/><text x="62" y="445" class="h">掌側手指局部痛／爆裂</text><text x="70" y="480" class="b">屈肌滑車與屈肌腱完整性</text></g><text x="115" y="690" class="b">非比例解剖圖；症狀位置只形成假設，不能替代完整檢查與影像。</text></svg>
