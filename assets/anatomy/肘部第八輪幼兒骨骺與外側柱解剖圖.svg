<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.bone{fill:#f4e7cf;stroke:#675d4d;stroke-width:4}.cart{fill:#dbeafe;stroke:#2563eb;stroke-width:4}.risk{fill:#fff1f2;stroke:#be123c;stroke-width:3}</style><text x="42" y="55" class="t">肘部第八輪：幼兒遠端骨骺與兒童外側柱</text><path class="bone" d="M145 115Q90 250 160 405L135 520Q230 575 330 520L305 405Q375 250 315 115Z"/><ellipse class="cart" cx="235" cy="430" rx="105" ry="70"/><text x="105" y="620" class="h">幼兒遠端肱骨骨骺</text><text x="115" y="655" class="b">多為軟骨，X 光可能低估</text><path class="bone" d="M500 110Q445 260 500 390L475 610H590L575 390Q640 260 585 110Z"/><path class="cart" d="M515 395Q565 350 610 410L595 505Q550 550 505 500Z"/><text x="445" y="655" class="h">外側髁與關節面</text><text x="435" y="690" class="b">移位與延遲不癒合需追蹤</text><rect x="755" y="150" width="360" height="360" rx="20" class="risk"/><text x="815" y="205" class="h">判讀三件事</text><text x="800" y="265" class="b">1. 年齡與骨化中心</text><text x="800" y="315" class="b">2. 橈肱對位與骨片位移</text><text x="800" y="365" class="b">3. 神經血管與軟組織</text><text x="795" y="440" class="b">正常外觀或能活動</text><text x="800" y="475" class="b">都不能排除關節內骨折</text></svg>
