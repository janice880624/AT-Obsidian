<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.o{fill:#dbeafe;stroke:#1d4ed8;stroke-width:4}.i{fill:#fee2e2;stroke:#be123c;stroke-width:4}.v{fill:#fef3c7;stroke:#b45309;stroke-width:4}.d{fill:none;stroke:#334155;stroke-width:7}</style><text x="55" y="55" class="t">椎體、硬膜內髓外與髓內病灶層級</text><rect x="450" y="110" width="300" height="500" rx="140" class="o"/><ellipse cx="600" cy="355" rx="105" ry="205" fill="#fff" stroke="#64748b" stroke-width="4"/><ellipse cx="600" cy="355" rx="55" ry="155" fill="#cbd5e1" stroke="#334155" stroke-width="4"/><circle cx="535" cy="270" r="35" class="i"/><circle cx="600" cy="400" r="27" class="i"/><rect x="455" y="620" width="290" height="70" rx="18" class="v"/><text x="60" y="205" class="h">硬膜內髓外</text><text x="60" y="245" class="b">腦膜瘤、許旺細胞瘤常見層級</text><line x1="330" y1="235" x2="500" y2="270" class="d"/><text x="820" y="345" class="h">髓內</text><text x="820" y="385" class="b">室管膜瘤與其他髓內病灶</text><line x1="790" y1="370" x2="630" y2="400" class="d"/><text x="820" y="640" class="h">椎體／硬膜外延伸</text><text x="820" y="680" class="b">侵襲性血管瘤可壓迫神經</text><line x1="790" y1="650" x2="745" y2="650" class="d"/><text x="165" y="730" class="h">非比例示意；病灶層級需 MRI、專科與病理整合</text></svg>
