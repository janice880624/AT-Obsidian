<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.bone{fill:#eadfcb;stroke:#6c6252;stroke-width:4}.lig{stroke:#2563eb;stroke-width:10;fill:none}.nerve{stroke:#eab308;stroke-width:8;fill:none}.cord{fill:#fda4af;stroke:#be123c;stroke-width:4}</style><text x="45" y="55" class="t">頭頸第四輪：齒突、上頸椎穩定與枕神經</text><ellipse cx="485" cy="220" rx="210" ry="90" class="bone"/><path class="bone" d="M360 300Q485 245 610 300L635 470Q485 520 335 470Z"/><path class="bone" d="M445 460L525 460L545 635H425Z"/><path class="cord" d="M460 120Q485 95 510 120L530 610Q485 650 440 610Z"/><path class="lig" d="M350 315Q485 390 620 315"/><path class="nerve" d="M430 470Q300 500 250 620M520 470Q680 490 790 600"/><text x="750" y="145" class="h">齒突（C2）</text><text x="750" y="180" class="b">寰椎旋轉的骨性軸</text><text x="750" y="235" class="h">藍：寰椎橫韌帶</text><text x="750" y="270" class="b">限制寰椎相對前移</text><text x="750" y="325" class="h">紅：上頸髓</text><text x="750" y="360" class="b">不穩與位移可危及神經</text><text x="750" y="415" class="h">黃：枕神經</text><text x="750" y="450" class="b">後頭皮感覺路徑示意</text><text x="315" y="690" class="b">非比例教學圖；創傷疑慮不做旋轉或深觸挑釁。</text></svg>
