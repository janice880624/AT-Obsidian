<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.bone{fill:#eadfcb;stroke:#665f52;stroke-width:4}.cart{fill:#8dd3c7;stroke:#147d73;stroke-width:3}.tendon{fill:#f59e0b;stroke:#92400e;stroke-width:4}.lig{fill:none;stroke:#7c3aed;stroke-width:10}.nerve{fill:none;stroke:#eab308;stroke-width:12}.line{stroke:#2563eb;stroke-width:4}</style><text x="40" y="55" class="t">膝部第六輪：兒童髕骨下極與近端脛腓關節</text><g transform="translate(60 100)"><ellipse cx="250" cy="150" rx="105" ry="135" class="bone"/><path d="M155 205 Q250 310 345 205 L340 265 Q250 350 160 265Z" class="cart"/><path d="M225 290 L185 535 L315 535 L275 290Z" class="tendon"/><text x="40" y="600" class="h">軟骨套袖可大、X 光骨片可小</text><text x="70" y="640" class="b">急性伸膝失能＝同日骨科評估</text></g><g transform="translate(620 115)"><rect x="20" y="20" width="210" height="500" rx="70" class="bone"/><rect x="290" y="80" width="125" height="440" rx="55" class="bone"/><line x1="225" y1="105" x2="305" y2="150" class="lig"/><line x1="225" y1="205" x2="305" y2="210" class="lig"/><path d="M405 60 Q490 135 420 300 Q390 390 465 505" class="nerve"/><text x="40" y="575" class="h">紫：近端脛腓關節囊韌帶</text><text x="40" y="615" class="b">黃：腓總神經繞過腓骨頸</text><line x1="345" y1="220" x2="520" y2="220" class="line"/><text x="525" y="225" class="b">足下垂／麻木需定位</text></g></svg>
