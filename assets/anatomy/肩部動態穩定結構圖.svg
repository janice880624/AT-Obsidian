<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:18px}.bone{fill:#eadfcb;stroke:#6c6252;stroke-width:4}.mus{stroke:#0f766e;stroke-width:20;fill:none}.lig{stroke:#dc2626;stroke-width:9;fill:none}.nerve{stroke:#eab308;stroke-width:8;fill:none}</style><text x="45" y="55" class="t">肩部動態穩定：骨性、韌帶、肌腱與神經關聯（概念圖）</text><g transform="translate(60 105)"><path class="bone" d="M80 70 Q250 20 385 135 L330 370 Q210 430 90 330 Z"/><circle class="bone" cx="485" cy="235" r="95"/><path class="lig" d="M365 150 Q425 115 460 160 M345 250 Q420 285 465 260 M335 330 Q410 365 470 305"/><path class="mus" d="M145 110 Q300 125 455 205 M155 360 Q310 330 455 280"/><path class="nerve" d="M70 60 Q200 5 330 100 Q380 145 400 220"/><text x="65" y="485" class="h">靜態＋動態穩定</text><text x="65" y="525" class="b">紅：關節囊韌帶　綠：旋轉肌袖</text><text x="65" y="560" class="b">黃：肩胛上神經（路徑簡化）</text></g><g transform="translate(700 115)"><rect x="0" y="0" width="405" height="95" rx="14" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="55" y="38" class="h">肩胛胸廓：定位盂窩</text><text x="50" y="73" class="b">上旋、後傾、外旋隨任務改變</text><rect x="0" y="135" width="405" height="95" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="3"/><text x="45" y="175" class="h">旋轉肌袖：壓縮與置中</text><text x="35" y="210" class="b">力量、耐力與時序共同參與</text><rect x="0" y="270" width="405" height="95" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="60" y="310" class="h">關節囊：方向特定限制</text><text x="45" y="345" class="b">鬆弛不必然等於有症狀不穩定</text><rect x="0" y="405" width="405" height="95" rx="14" fill="#fefce8" stroke="#a16207" stroke-width="3"/><text x="55" y="445" class="h">神經：輸出與肌肉容量</text><text x="38" y="480" class="b">漸進萎縮／無痛無力需轉介</text></g><rect x="55" y="650" width="1090" height="45" rx="10" fill="#e8eef7"/><text x="105" y="679" class="b">非比例解剖圖；不能由單一姿勢、觸診或影像外觀推定病因。</text></svg>
