<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:32px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.bone{fill:#eadfcb;stroke:#6c6252;stroke-width:4}.syn{stroke:#147d92;stroke-width:14;stroke-linecap:round}.joint{stroke:#c2410c;stroke-width:10;stroke-dasharray:12 8}.tendon{stroke:#6d28d9;stroke-width:10;fill:none}</style><text x="45" y="55" class="t">足踝中後足穩定結構（概念圖）</text><g transform="translate(70 100)"><path class="bone" d="M170 20h100v250h-100z"/><path class="bone" d="M330 20h75v250h-75z"/><line class="syn" x1="275" y1="90" x2="325" y2="90"/><line class="syn" x1="275" y1="160" x2="325" y2="160"/><text x="100" y="315" class="h">遠端脛腓聯合</text><text x="80" y="350" class="b">維持踝穴；背屈／外旋增加負荷</text></g><g transform="translate(610 105)"><ellipse class="bone" cx="210" cy="120" rx="120" ry="70"/><ellipse class="bone" cx="220" cy="240" rx="145" ry="75"/><path class="bone" d="M340 180h180l40 90-235 35z"/><line class="joint" x1="115" y1="185" x2="315" y2="185"/><line class="joint" x1="335" y1="175" x2="330" y2="310"/><path class="tendon" d="M490 40q-120 110-20 270"/><text x="80" y="385" class="h">距下＋橫跗關節</text><text x="60" y="420" class="b">共同參與後足與中足三平面運動</text><text x="60" y="455" class="b">紫：腓骨肌腱路徑（簡化）</text></g><rect x="55" y="630" width="1090" height="48" rx="10" fill="#e8eef7"/><text x="75" y="661" class="b">非比例解剖圖；不可由表面示意判定錯位、撕裂或手術位置。</text></svg>
