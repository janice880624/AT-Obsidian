<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.bone{fill:#f4e7cf;stroke:#675d4d;stroke-width:4}.hi{fill:#fee2e2;stroke:#be123c;stroke-width:5}.ten{fill:none;stroke:#2563eb;stroke-width:12}.lig{fill:none;stroke:#16a34a;stroke-width:10}</style><text x="40" y="55" class="t">足踝第七輪：內踝、跟骨前突與內側足弓功能單元</text><g transform="translate(55 115)"><rect x="130" y="20" width="140" height="360" rx="65" class="bone"/><path d="M130 280 L70 410 L210 410 Z" class="hi"/><text x="45" y="470" class="h">內踝壓力傷區</text><text x="15" y="510" class="b">局限骨痛需低門檻影像</text></g><g transform="translate(420 130)"><path d="M40 230 Q160 70 320 170 L370 260 Q200 360 60 330Z" class="bone"/><path d="M320 170 L405 215 L350 275Z" class="hi"/><text x="65" y="430" class="h">跟骨前突與跟骰關節</text><text x="50" y="470" class="b">常模仿外側踝扭傷</text></g><g transform="translate(820 120)"><path d="M50 420 Q220 270 340 410" class="bone"/><path d="M80 80 Q155 225 115 410" class="ten"/><path d="M115 410 Q220 330 310 380" class="lig"/><text x="50" y="500" class="h">藍：脛後肌腱　綠：彈簧韌帶</text><text x="65" y="540" class="b">PCFD 為多結構三維變形</text></g><text x="280" y="715" class="b">原創非比例示意；臨床定位須結合症狀、負重檢查及適切影像。</text></svg>
