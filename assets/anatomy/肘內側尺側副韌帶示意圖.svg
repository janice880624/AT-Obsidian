<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#fffaf5"/><text x="600" y="60" text-anchor="middle" font-size="36" font-family="sans-serif" fill="#4a2c2a">肘內側尺側副韌帶（MUCL）</text><line x1="420" y1="145" x2="420" y2="560" stroke="#64748b" stroke-width="38" stroke-linecap="round"/><line x1="780" y1="310" x2="780" y2="590" stroke="#64748b" stroke-width="38" stroke-linecap="round"/><circle cx="420" cy="270" r="75" fill="#e2e8f0" stroke="#475569" stroke-width="5"/><circle cx="780" cy="390" r="70" fill="#e2e8f0" stroke="#475569" stroke-width="5"/><path d="M465 290 C560 270 655 320 735 385" fill="none" stroke="#dc2626" stroke-width="24" stroke-linecap="round"/><g font-family="sans-serif" font-size="24"><text x="210" y="265">肱骨內上髁</text><text x="855" y="395">尺骨近端</text><text x="575" y="250" fill="#b91c1c">前束</text><text x="600" y="630" text-anchor="middle" fill="#475569">抵抗外翻負荷；投擲者評估須同時考慮屈肌－旋前肌與尺神經</text></g></svg>
