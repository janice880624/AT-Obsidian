<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:18px}.bone{fill:#eadfcb;stroke:#6c6252;stroke-width:4}.lig{stroke:#dc2626;stroke-width:10}.nerve{stroke:#eab308;stroke-width:9;fill:none}.force{stroke:#2563eb;stroke-width:8;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><text x="45" y="55" class="t">投擲肘外翻負荷：內側牽拉、外側壓縮與後內側撞擊</text><g transform="translate(75 100)"><rect class="bone" x="220" y="0" width="150" height="245" rx="55"/><circle class="bone" cx="395" cy="240" r="70"/><rect class="bone" x="160" y="245" width="135" height="300" rx="55"/><rect class="bone" x="385" y="300" width="105" height="250" rx="48"/><path class="lig" d="M230 185L180 360"/><path class="nerve" d="M200 145Q140 245 170 390"/><path class="force" d="M510 220Q570 300 500 365"/><text x="75" y="600" class="h">紅：內側 UCL／骨骺牽拉</text><text x="75" y="635" class="b">黃：尺神經路徑（簡化）</text></g><g transform="translate(700 125)"><rect width="410" height="95" rx="14" fill="#fff1f2" stroke="#be123c" stroke-width="3"/><text x="55" y="40" class="h">內側：牽拉</text><text x="40" y="75" class="b">骨骺、UCL、屈肌旋前肌、尺神經</text><rect y="135" width="410" height="95" rx="14" fill="#eef6ff" stroke="#1769aa" stroke-width="3"/><text x="55" y="175" class="h">外側：壓縮</text><text x="45" y="210" class="b">肱骨小頭、橈骨頭與骨軟骨單位</text><rect y="270" width="410" height="95" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="45" y="310" class="h">後內側：終末伸展撞擊</text><text x="45" y="345" class="b">鷹嘴、骨贅、軟骨與游離體</text><rect y="405" width="410" height="95" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="3"/><text x="70" y="445" class="h">判讀需看年齡與投擲期相</text><text x="48" y="480" class="b">同一運動員可能同時有多個結構受累</text></g><rect x="55" y="660" width="1090" height="38" rx="10" fill="#e8eef7"/><text x="125" y="686" class="b">非比例解剖圖；疼痛位置或單一測試不能獨立確定病灶。</text></svg>
