<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.bone{fill:#eadfcb;stroke:#675f52;stroke-width:4}.cart{fill:#8dd3c7;stroke:#237a70;stroke-width:3}.fat{fill:#facc15;stroke:#a16207;stroke-width:3}.syn{fill:none;stroke:#e11d48;stroke-width:10}.line{stroke:#2563eb;stroke-width:5;stroke-dasharray:10 8}</style><text x="40" y="55" class="t">膝部第五輪：軟骨下骨、脂肪墊與滑膜皺襞</text><rect x="130" y="120" width="360" height="150" rx="70" class="bone"/><path d="M150 255 Q310 325 470 255 L470 310 Q310 380 150 310Z" class="cart"/><rect x="135" y="310" width="350" height="250" rx="35" class="bone"/><line x1="150" y1="342" x2="470" y2="342" class="line"/><text x="160" y="410" class="h">藍虛線：軟骨下骨板</text><text x="160" y="450" class="b">早期不足性骨折 X 光可正常</text><path d="M730 195 Q880 225 860 520 Q740 510 680 400 Q650 290 730 195Z" class="bone"/><path d="M625 235 Q690 285 700 470 Q650 535 590 440 Q560 330 625 235Z" class="fat"/><path d="M710 250 Q640 315 705 390" class="syn"/><text x="770" y="280" class="h">髕骨／髕腱後方</text><text x="770" y="330" class="b">黃：髕下脂肪墊</text><text x="770" y="375" class="b">紅：內側滑膜皺襞</text><text x="770" y="420" class="b">存在或影像訊號 ≠ 痛源</text><text x="145" y="650" class="b">骨、軟骨、半月板與負荷須整合</text><text x="660" y="650" class="b">前膝症狀須與髕股、髕腱、半月板鑑別</text></svg>
