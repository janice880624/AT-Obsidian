<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><text x="60" y="70" font-size="34" font-family="sans-serif" fill="#0f172a">距骨血供、踝滑膜與遠端腓骨負荷</text><g font-family="sans-serif" font-size="24"><rect x="70" y="130" width="300" height="470" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="105" y="180">距骨</text><path d="M150 330 C210 220 310 250 320 370 C290 500 170 490 130 410 Z" fill="#fbbf24" stroke="#92400e" stroke-width="5"/><path d="M90 480 C160 420 200 370 250 275" fill="none" stroke="#dc2626" stroke-width="12"/><text x="105" y="550">血管進入少、關節軟骨覆蓋多</text><text x="105" y="585">骨折脫臼後需長期追蹤</text><rect x="450" y="130" width="300" height="470" rx="24" fill="#ecfccb" stroke="#65a30d" stroke-width="4"/><text x="485" y="180">踝滑膜</text><ellipse cx="600" cy="350" rx="105" ry="160" fill="#fff" stroke="#16a34a" stroke-width="18"/><circle cx="560" cy="330" r="25" fill="#a855f7"/><circle cx="635" cy="405" r="20" fill="#a855f7"/><text x="485" y="550">增生與游離體可位於隱窩</text><text x="485" y="585">卡住不等於單一診斷</text><rect x="830" y="130" width="300" height="470" rx="24" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/><text x="865" y="180">遠端腓骨</text><path d="M980 230 L940 500 Q980 570 1020 500 L1000 230 Z" fill="#e5e7eb" stroke="#475569" stroke-width="6"/><path d="M875 260 C900 330 900 410 925 480" fill="none" stroke="#ef4444" stroke-width="12" stroke-dasharray="18 12"/><text x="865" y="550">重複跑跳可累積骨應力</text><text x="865" y="585">早期 X 光可能正常</text></g><text x="60" y="680" font-family="sans-serif" font-size="20" fill="#475569">原創示意圖｜非診斷影像｜CC BY 4.0</text></svg>