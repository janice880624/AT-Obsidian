<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:29px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.bone{fill:#eadfcb;stroke:#675f52;stroke-width:4}.dura{fill:none;stroke:#be123c;stroke-width:10}.brain{fill:#dbeafe;stroke:#2563eb;stroke-width:4}.nerve{stroke:#f59e0b;stroke-width:12}.air{fill:none;stroke:#059669;stroke-width:14}</style><text x="40" y="52" class="t">頭頸第六輪：顱內膜層、視神經與喉氣道</text><ellipse cx="245" cy="330" rx="165" ry="220" class="bone"/><ellipse cx="245" cy="330" rx="135" ry="190" class="dura"/><ellipse cx="245" cy="330" rx="105" ry="160" class="brain"/><text x="120" y="610" class="h">顱骨－硬腦膜－腦表</text><text x="85" y="650" class="b">出血位置不同；場邊症狀不能分型</text><circle cx="610" cy="270" r="95" fill="#fff" stroke="#52677f" stroke-width="5"/><line x1="700" y1="270" x2="825" y2="270" class="nerve"/><text x="535" y="430" class="h">眼球與視神經</text><text x="490" y="470" class="b">視力下降或 RAPD → 緊急轉介</text><path d="M995 165 C920 250 940 420 1000 555" class="air"/><path d="M995 280 L925 320 M995 280 L1065 320" fill="none" stroke="#6b7280" stroke-width="9"/><text x="875" y="610" class="h">喉軟骨與氣道</text><text x="835" y="650" class="b">沙啞、喘鳴、皮下氣腫可延遲惡化</text><text x="330" y="720" class="b">原創非比例示意圖；用於關聯概念，不取代影像、眼科或耳鼻喉檢查。</text></svg>
