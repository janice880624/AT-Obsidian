<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.x{fill:#fff;stroke:#52677f;stroke-width:3}.bone{fill:#f4e7cf;stroke:#675d4d;stroke-width:4}.n{stroke:#7c3aed;stroke-width:8;fill:none}</style><text x="40" y="55" class="t">肩部第七輪：三個容易混淆的結構層次</text><rect x="55" y="105" width="340" height="500" rx="18" class="x"/><text x="125" y="150" class="h">盂肱關節</text><ellipse cx="195" cy="330" rx="75" ry="135" class="bone"/><circle cx="310" cy="330" r="105" class="bone"/><text x="95" y="500" class="b">軟骨、軟骨下骨、骨贅</text><text x="95" y="540" class="b">影像 ≠ 疼痛程度</text><rect x="430" y="105" width="340" height="500" rx="18" class="x"/><text x="485" y="150" class="h">遠端鎖骨骨骺</text><path d="M480 300 L710 300" stroke="#675d4d" stroke-width="35"/><path d="M645 270 L645 330" stroke="#dc2626" stroke-width="8"/><text x="475" y="390" class="b">兒少骨骺未完全骨化</text><text x="475" y="430" class="b">外觀可似 AC 脫臼</text><text x="475" y="470" class="b">先查皮膚與神經血管</text><rect x="805" y="105" width="340" height="500" rx="18" class="x"/><text x="865" y="150" class="h">副神經－斜方肌</text><path d="M920 205 Q875 320 930 475 Q985 540 1060 500" class="n"/><path d="M930 255 Q1030 310 1080 450" stroke="#0f766e" stroke-width="55" fill="none" opacity=".55"/><text x="845" y="540" class="b">頸後三角表淺走行</text><text x="845" y="575" class="b">損傷可致肩下垂與外側翼狀</text><text x="120" y="680" class="b">非比例解剖示意；結構線索必須與病史、主被動活動、神經學與影像／實驗室適應症整合。</text></svg>
