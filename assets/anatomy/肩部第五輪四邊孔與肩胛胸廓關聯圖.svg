<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.bone{fill:#f4e7cf;stroke:#675d4d;stroke-width:4}.nerve{stroke:#eab308;stroke-width:9;fill:none}.art{stroke:#be123c;stroke-width:10;fill:none}</style><text x="45" y="55" class="t">肩部第五輪：肩胛胸廓與四邊孔關聯</text><path d="M230 135Q410 90 500 250Q430 430 235 555Q185 355 230 135Z" class="bone"/><path d="M520 230Q690 200 800 270L760 360Q620 370 500 315Z" class="bone"/><path d="M505 300Q570 395 670 480" class="nerve"/><path d="M515 325Q590 410 720 470" class="art"/><rect x="770" y="145" width="355" height="330" rx="18" fill="#fff" stroke="#52677f" stroke-width="3"/><text x="820" y="190" class="h">四邊孔邊界</text><text x="805" y="235" class="b">上：小圓肌</text><text x="805" y="275" class="b">下：大圓肌</text><text x="805" y="315" class="b">內：肱三頭肌長頭</text><text x="805" y="355" class="b">外：肱骨外科頸</text><text x="805" y="410" class="h">通過</text><text x="805" y="450" class="b">腋神經＋後旋肱動脈</text><text x="110" y="650" class="b">非比例教學圖；疼痛或位置性症狀不能單獨確認卡壓，血管徵象需急迫轉介。</text></svg>
