<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.bone{fill:#eadfcb;stroke:#6c6252;stroke-width:4}.tendon1{stroke:#be123c;stroke-width:13;fill:none}.tendon2{stroke:#2563eb;stroke-width:13;fill:none}.sheath{fill:#fef3c7;stroke:#b45309;stroke-width:4}.lunate{fill:#c4b5fd;stroke:#6d28d9;stroke-width:4}</style><text x="42" y="55" class="t">手腕與手第五輪：月骨、背側交叉區與屈肌腱鞘</text><g transform="translate(80 105)"><path class="bone" d="M175 30h105l20 300-30 190H150l-25-190z"/><path class="bone" d="M330 35h100l-5 290 45 195H350l-50-195z"/><ellipse cx="300" cy="430" rx="60" ry="45" class="lunate"/><path class="tendon1" d="M105 35Q190 170 320 270"/><path class="tendon2" d="M255 25Q230 160 340 300"/><rect x="500" y="290" width="95" height="245" rx="35" class="sheath"/><path class="tendon1" d="M548 180V560"/></g><text x="690" y="150" class="h">紫：月骨承重節段</text><text x="690" y="187" class="b">持續背中央痛需考慮影像與分期</text><text x="690" y="275" class="h">紅／藍：第一與第二背側腱室</text><text x="690" y="312" class="b">疼痛位置比單一挑釁測試更有幫助</text><text x="690" y="400" class="h">黃：屈肌腱鞘與 A1 滑車</text><text x="690" y="437" class="b">卡彈與感染可能共享腫痛但急迫度不同</text><text x="185" y="680" class="b">非比例教學圖；不可依疼痛點、聲音或單一徵象確診。</text></svg>
