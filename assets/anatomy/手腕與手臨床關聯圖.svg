<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">手腕與手臨床關聯圖</title>
  <desc id="desc">非比例教學示意圖，呈現橈尺骨、兩排腕骨、掌骨與常見臨床區域。</desc>
  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#0f172a">手腕與手臨床關聯圖（掌側示意）</text>
  <text x="600" y="82" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475569">位置與比例為教學簡化，不作影像或手術定位</text>
  <rect x="120" y="110" width="150" height="250" rx="55" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <rect x="310" y="110" width="110" height="250" rx="45" fill="#e0e7ff" stroke="#4f46e5" stroke-width="4"/>
  <text x="195" y="235" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#1e3a8a">橈骨</text>
  <text x="365" y="235" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#312e81">尺骨</text>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0f172a" stroke="#334155" stroke-width="2">
    <rect x="105" y="395" width="110" height="78" rx="18" fill="#fde68a"/><text x="160" y="440" stroke="none">舟狀骨</text>
    <rect x="225" y="395" width="110" height="78" rx="18" fill="#fde68a"/><text x="280" y="440" stroke="none">月狀骨</text>
    <rect x="345" y="395" width="110" height="78" rx="18" fill="#fde68a"/><text x="400" y="440" stroke="none">三角骨</text>
    <circle cx="438" cy="492" r="34" fill="#fbbf24"/><text x="438" y="499" stroke="none" font-size="16">豆狀骨</text>
    <rect x="85" y="500" width="95" height="76" rx="16" fill="#fed7aa"/><text x="132" y="544" stroke="none" font-size="16">大多角骨</text>
    <rect x="190" y="500" width="95" height="76" rx="16" fill="#fed7aa"/><text x="237" y="544" stroke="none" font-size="16">小多角骨</text>
    <rect x="295" y="500" width="95" height="76" rx="16" fill="#fed7aa"/><text x="342" y="544" stroke="none" font-size="16">頭狀骨</text>
    <rect x="400" y="500" width="95" height="76" rx="16" fill="#fed7aa"/><text x="447" y="544" stroke="none" font-size="16">鉤狀骨</text>
  </g>
  <g stroke="#64748b" stroke-width="16" stroke-linecap="round">
    <line x1="128" y1="595" x2="90" y2="735"/><line x1="220" y1="595" x2="205" y2="735"/><line x1="310" y1="595" x2="320" y2="735"/><line x1="400" y1="595" x2="435" y2="735"/><line x1="472" y1="590" x2="550" y2="708"/>
  </g>
  <g font-family="sans-serif" fill="#0f172a">
    <rect x="670" y="135" width="430" height="110" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="695" y="175" font-size="24" font-weight="700">橈側警戒</text><text x="695" y="210" font-size="20">鼻煙窩壓痛 → 排除舟狀骨骨折</text>
    <rect x="670" y="280" width="430" height="110" rx="20" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/>
    <text x="695" y="320" font-size="24" font-weight="700">尺側疼痛</text><text x="695" y="355" font-size="20">TFCC、DRUJ、ECU 與尺腕負荷</text>
    <rect x="670" y="425" width="430" height="110" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="695" y="465" font-size="24" font-weight="700">掌側麻木</text><text x="695" y="500" font-size="20">正中神經症狀需合併 CTS-6 評估</text>
    <rect x="670" y="570" width="430" height="110" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <text x="695" y="610" font-size="24" font-weight="700">外傷後先做</text><text x="695" y="645" font-size="20">畸形、傷口、神經血管與肌腱功能</text>
  </g>
</svg>

