<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.bone{fill:#eadfcb;stroke:#665b4b;stroke-width:4}.men{fill:none;stroke:#2563eb;stroke-width:20}.acl{fill:none;stroke:#e11d48;stroke-width:13}</style><text x="42" y="55" class="t">膝部第四輪：半月板根部與髁間隆起</text><ellipse cx="430" cy="245" rx="250" ry="95" class="bone"/><ellipse cx="430" cy="480" rx="260" ry="115" class="bone"/><path d="M235 460 Q300 365 410 440" class="men"/><path d="M625 460 Q555 365 450 440" class="men"/><path d="M400 450 Q430 380 455 270" class="acl"/><circle cx="405" cy="435" r="22" fill="#f59e0b"/><circle cx="455" cy="435" r="22" fill="#f59e0b"/><text x="760" y="190" class="h">紅：ACL 至脛骨附著</text><text x="760" y="230" class="b">骨骼未成熟者可出現髁間隆起撕脫</text><text x="760" y="330" class="h">藍：內外側半月板</text><text x="760" y="370" class="b">根部維持環向張力與負荷分配</text><text x="760" y="470" class="h">橘：前後根附近附著區</text><text x="760" y="510" class="b">關節線壓痛無法直接定位根部</text><text x="205" y="675" class="b">非比例教學圖；病史、積液、活動、神經血管與影像需整合判讀。</text></svg>
