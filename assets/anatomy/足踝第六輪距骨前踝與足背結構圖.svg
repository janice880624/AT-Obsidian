<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:29px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.bone{fill:#eadfcb;stroke:#675f52;stroke-width:4}.n{fill:none;stroke:#f59e0b;stroke-width:10}.p{fill:#dc2626;stroke:#7f1d1d;stroke-width:4}.r{fill:none;stroke:#2563eb;stroke-width:7}</style><text x="42" y="50" class="t">足踝第六輪：距骨外側突、前踝與足背神經</text><path d="M90 190 Q210 110 330 205 L300 410 Q175 500 75 405Z" class="bone"/><path d="M300 245 L385 310 L305 365Z" class="p"/><text x="65" y="560" class="h">距骨外側突</text><text x="55" y="600" class="b">參與距腓與後距下關節面</text><rect x="470" y="160" width="210" height="300" rx="55" class="bone"/><path d="M450 230 Q575 285 700 230" class="r"/><path d="M455 345 Q575 400 695 345" class="r"/><text x="465" y="560" class="h">前踝夾擠區</text><text x="435" y="600" class="b">背屈時前方骨性／軟組織受刺激</text><path d="M810 150 Q870 245 860 360 Q900 450 1040 540" class="n"/><path d="M1040 540 L1110 505" class="n"/><path d="M1040 540 L1110 575" class="n"/><text x="830" y="630" class="h">腓深神經</text><text x="785" y="670" class="b">伸肌支持帶下方；第一趾蹼為典型感覺區</text><text x="340" y="725" class="b">原創示意，非比例；臨床定位須結合病史、神經檢查與影像。</text></svg>
