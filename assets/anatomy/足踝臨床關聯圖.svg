<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">足踝臨床關聯圖</title>
  <desc id="desc">簡化顯示脛腓骨、距骨、跟骨、外側韌帶、跟腱及常見臨床區域</desc>
  <rect width="960" height="540" fill="#f7fafc"/>
  <text x="40" y="55" font-family="sans-serif" font-size="30" font-weight="700" fill="#17324d">足踝複合體：結構與臨床線索</text>
  <g transform="translate(355 80)" stroke="#34495e" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M145 15 L130 230 L170 285"/>
    <path d="M215 20 L205 225 L170 285"/>
    <path d="M125 230 L205 225 L230 310 L145 320 Z" fill="#d8e9f3"/>
    <path d="M145 320 Q195 390 305 390 L335 425 L120 425 Q85 390 105 350 Z" fill="#f2dfc7"/>
    <path d="M210 55 Q280 180 245 345" stroke="#e67e22" stroke-width="12"/>
    <path d="M205 225 L245 300 M205 225 L285 335" stroke="#c0392b" stroke-width="8"/>
  </g>
  <g font-family="sans-serif" font-size="22" fill="#17324d">
    <rect x="55" y="115" width="245" height="75" rx="12" fill="#e8f2f8" stroke="#5b8aa6"/>
    <text x="75" y="146">外踝前下：ATFL／CFL</text><text x="75" y="176">內翻傷後需先排骨折</text>
    <line x1="300" y1="152" x2="520" y2="280" stroke="#5b8aa6" stroke-width="3"/>
    <rect x="55" y="235" width="245" height="75" rx="12" fill="#fff1e6" stroke="#e67e22"/>
    <text x="75" y="266">後踝：跟腱</text><text x="75" y="296">啪聲＋推蹬喪失需轉介</text>
    <line x1="300" y1="272" x2="595" y2="250" stroke="#e67e22" stroke-width="3"/>
    <rect x="655" y="115" width="250" height="75" rx="12" fill="#f9e8e8" stroke="#c0392b"/>
    <text x="675" y="146">踝穴上方：脛腓聯合</text><text x="675" y="176">外旋機轉／高位疼痛</text>
    <line x1="655" y1="152" x2="565" y2="275" stroke="#c0392b" stroke-width="3"/>
    <rect x="655" y="235" width="250" height="75" rx="12" fill="#edf7ed" stroke="#4b8f58"/>
    <text x="675" y="266">足中部：舟狀骨／第5蹠骨</text><text x="675" y="296">Ottawa 足部條件</text>
    <line x1="655" y1="272" x2="610" y2="430" stroke="#4b8f58" stroke-width="3"/>
  </g>
  <text x="40" y="505" font-family="sans-serif" font-size="18" fill="#5d6d7e">原創教學示意，非比例解剖圖；症狀位置不能單獨確診。</text>
</svg>
