<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">月骨周圍創傷與正中神經關聯圖</title>
  <desc id="desc">非比例示意月骨、頭狀骨、橈骨與正中神經，對比正常、月骨周圍脫位與月骨脫位。</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="60" y="60" font-size="34" font-family="sans-serif" font-weight="700" fill="#0f172a">月骨周圍創傷：排列與神經風險（非比例）</text>
  <g font-family="sans-serif" font-size="24" fill="#0f172a">
    <text x="120" y="125">正常排列</text><text x="500" y="125">月骨周圍脫位</text><text x="875" y="125">月骨脫位</text>
  </g>
  <g stroke="#334155" stroke-width="5">
    <rect x="115" y="545" width="190" height="70" rx="22" fill="#cbd5e1"/><ellipse cx="210" cy="460" rx="75" ry="50" fill="#fbbf24"/><ellipse cx="210" cy="335" rx="78" ry="55" fill="#60a5fa"/>
    <rect x="495" y="545" width="190" height="70" rx="22" fill="#cbd5e1"/><ellipse cx="590" cy="460" rx="75" ry="50" fill="#fbbf24"/><ellipse cx="670" cy="315" rx="78" ry="55" fill="#60a5fa"/>
    <rect x="875" y="545" width="190" height="70" rx="22" fill="#cbd5e1"/><ellipse cx="985" cy="390" rx="75" ry="50" transform="rotate(55 985 390)" fill="#fbbf24"/><ellipse cx="970" cy="275" rx="78" ry="55" fill="#60a5fa"/>
  </g>
  <g fill="none" stroke="#ef4444" stroke-width="16" stroke-linecap="round">
    <path d="M330 585 C350 500 330 360 350 220"/><path d="M710 585 C730 500 710 360 730 220"/><path d="M1090 585 C1110 500 1060 430 1040 220"/>
  </g>
  <g font-family="sans-serif" font-size="21" fill="#334155">
    <text x="125" y="655">橈骨 → 月骨 → 頭狀骨大致共線</text>
    <text x="470" y="655">頭狀骨相對月骨背移；月骨仍對準橈骨</text>
    <text x="835" y="655">月骨掌側旋移，可壓迫正中神經</text>
  </g>
  <g font-family="sans-serif" font-size="19"><circle cx="85" cy="690" r="10" fill="#fbbf24"/><text x="105" y="697">月骨</text><circle cx="195" cy="690" r="10" fill="#60a5fa"/><text x="215" y="697">頭狀骨</text><line x1="340" y1="690" x2="390" y2="690" stroke="#ef4444" stroke-width="10"/><text x="405" y="697">正中神經概念路徑</text></g>
</svg>

