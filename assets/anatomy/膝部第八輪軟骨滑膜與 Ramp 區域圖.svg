<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.bone{fill:#f5e6c8;stroke:#735f3d;stroke-width:5}.cart{fill:none;stroke:#0ea5e9;stroke-width:20}.syn{fill:none;stroke:#7c3aed;stroke-width:8;stroke-dasharray:18 12}.men{fill:#f59e0b;stroke:#92400e;stroke-width:4}.ramp{stroke:#dc2626;stroke-width:10}</style><text x="55" y="55" class="t">膝關節：軟骨、滑膜與內側半月板 Ramp 區</text><ellipse cx="500" cy="210" rx="240" ry="100" class="bone"/><rect x="270" y="480" width="460" height="110" rx="50" class="bone"/><path d="M280 330Q500 430 720 330" class="cart"/><path d="M310 430Q500 500 690 430Q500 360 310 430" class="men"/><path d="M315 430L265 455" class="ramp"/><path d="M230 300Q160 430 250 600" class="syn"/><text x="800" y="200" class="h">關節軟骨</text><text x="800" y="250" class="b">不能由體表觸診</text><text x="800" y="390" class="h">滑膜</text><text x="800" y="440" class="b">感染、晶體與 OA 都可發炎</text><text x="75" y="420" class="h">Ramp 區</text><text x="60" y="470" class="b">後角周邊連接可能分離</text><text x="265" y="700" class="h">非比例教學示意；病灶需臨床、抽液／影像或專科整合</text></svg>
