<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.bone{fill:#eadfcb;stroke:#6c6252;stroke-width:4}.lab{fill:none;stroke:#2563eb;stroke-width:18}.cap{fill:none;stroke:#0f766e;stroke-width:9;stroke-dasharray:15 10}.lt{stroke:#e11d48;stroke-width:11}</style><text x="40" y="55" class="t">骨盆髖第六輪：髖穩定是多層系統</text><path class="bone" d="M180 150q220-90 360 60l-70 180-160 90-140-100z"/><circle cx="540" cy="360" r="125" class="bone"/><path class="lab" d="M430 260q-95 100-5 220"/><path class="cap" d="M385 205q245-85 335 145q-50 235-275 190"/><line x1="435" y1="360" x2="535" y2="360" class="lt"/><text x="760" y="180" class="h">骨性覆蓋</text><text x="760" y="220" class="b">三維形態，不靠單一角度</text><text x="760" y="300" class="h">盂唇與負壓封閉</text><text x="760" y="340" class="b">增加接觸與密封</text><text x="760" y="420" class="h">關節囊、圓韌帶與肌群</text><text x="760" y="460" class="b">共同限制異常平移</text><text x="190" y="660" class="b">結構形態可無症狀；臨床診斷需整合病史、檢查、多參數影像與追蹤。</text></svg>
