<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.bone{fill:#eadfcb;stroke:#6c6252;stroke-width:4}.canal{fill:#dbeafe;stroke:#1d4ed8;stroke-width:4}.lig{fill:#fde68a;stroke:#ca8a04;stroke-width:4}.nerve{stroke:#e11d48;stroke-width:10;fill:none}</style><text x="40" y="55" class="t">胸腰椎第四輪：腰椎管、小面關節與椎間孔</text><path class="bone" d="M250 120h430v95H250zM280 385h390v95H280z"/><ellipse class="canal" cx="470" cy="300" rx="145" ry="70"/><path class="lig" d="M315 250Q470 205 625 250L600 290Q470 255 340 290z"/><path class="nerve" d="M545 300Q730 310 835 410"/><circle class="bone" cx="280" cy="315" r="52"/><circle class="bone" cx="660" cy="315" r="52"/><text x="760" y="150" class="h">藍：中央管／側隱窩</text><text x="760" y="190" class="b">骨、椎間盤、關節與韌帶共同形成邊界</text><text x="760" y="280" class="h">黃：黃韌帶</text><text x="760" y="320" class="b">增厚可與其他退化改變共同縮小空間</text><text x="760" y="410" class="h">紅：離開椎間孔的神經</text><text x="760" y="450" class="b">影像狹窄須與症狀及功能一致</text><text x="220" y="675" class="b">非比例教學圖；局部壓痛、姿勢或影像發現均不能獨立確診。</text></svg>
