<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:18px}.bone{fill:#eadfcb;stroke:#6c6252;stroke-width:4}.lig{stroke:#dc2626;stroke-width:11;fill:none}.cord{stroke:#2563eb;stroke-width:28;fill:none}.root{stroke:#7c3aed;stroke-width:8;fill:none}</style><text x="45" y="55" class="t">上頸椎穩定與頸髓路徑（概念圖）</text><g transform="translate(70 100)"><ellipse class="bone" cx="230" cy="90" rx="155" ry="52"/><ellipse class="bone" cx="230" cy="215" rx="145" ry="58"/><rect class="bone" x="180" y="285" width="100" height="110" rx="18"/><path class="lig" d="M112 205h236"/><path class="lig" d="M185 205L125 80M275 205L335 80"/><text x="60" y="450" class="h">C1–C2 被動穩定</text><text x="55" y="490" class="b">紅：橫韌帶與翼狀韌帶（簡化）</text><text x="55" y="525" class="b">疑不穩時不以挑釁測試取代影像</text></g><g transform="translate(625 95)"><path class="bone" d="M120 20h250v470H120z"/><path class="cord" d="M245 50v410"/><path class="root" d="M245 145q85 0 135 45M245 245q85 0 135 45M245 345q85 0 135 45"/><text x="95" y="545" class="h">頸髓與神經根</text><text x="45" y="583" class="b">脊髓病變可影響手部、步態與多肢</text></g><rect x="55" y="640" width="1090" height="48" rx="10" fill="#e8eef7"/><text x="85" y="671" class="b">非比例解剖圖；表面觸診或單一反射無法確定韌帶斷裂或脊髓壓迫。</text></svg>
