<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.bone{fill:#f4e7cf;stroke:#675d4d;stroke-width:4}.nerve{stroke:#eab308;stroke-width:8;fill:none}</style><text x="45" y="55" class="t">頭頸第五輪：顏面骨、咬合與三叉神經</text><ellipse cx="420" cy="240" rx="215" ry="155" class="bone"/><path d="M270 345Q420 520 570 345L540 565Q420 660 300 565Z" class="bone"/><circle cx="340" cy="225" r="55" fill="#dbeafe" stroke="#1769aa" stroke-width="4"/><circle cx="500" cy="225" r="55" fill="#dbeafe" stroke="#1769aa" stroke-width="4"/><path d="M420 265L375 340H465Z" fill="#fde68a" stroke="#92400e" stroke-width="3"/><path d="M610 120Q760 190 910 165M610 245Q770 285 930 270M610 375Q770 420 925 430" class="nerve"/><text x="790" y="120" class="h">V1：額與眼眶上區</text><text x="790" y="245" class="h">V2：中臉與眶下區</text><text x="790" y="375" class="h">V3：下顎感覺與咀嚼運動</text><text x="735" y="520" class="b">眼眶骨折 → 眶下神經感覺</text><text x="735" y="560" class="b">下顎骨折 → 下齒槽／頦神經感覺</text><text x="250" y="690" class="b">非比例教學圖；正常感覺不能排除骨折，任何視覺紅旗均須急迫轉介。</text></svg>
