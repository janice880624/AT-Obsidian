<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.bone{fill:#f4e7cf;stroke:#675d4d;stroke-width:4}.hi{fill:#fee2e2;stroke:#be123c;stroke-width:5}.syn{fill:#bfdbfe;stroke:#1d4ed8;stroke-width:4}.nerve{fill:none;stroke:#eab308;stroke-width:11}.art{fill:none;stroke:#dc2626;stroke-width:15}</style><text x="40" y="55" class="t">膝部第七輪：髕骨、滑膜游離體與內外側神經血管</text><g transform="translate(60 120)"><ellipse cx="200" cy="210" rx="120" ry="150" class="bone"/><circle cx="105" cy="105" r="38" class="hi"/><line x1="110" y1="305" x2="290" y2="305" class="hi"/><text x="30" y="430" class="h">二分髕骨常在上外側</text><text x="30" y="470" class="b">壓力骨折線需影像與臨床整合</text></g><g transform="translate(450 120)"><rect x="30" y="30" width="270" height="420" rx="120" class="syn"/><circle cx="115" cy="170" r="28" class="hi"/><circle cx="210" cy="270" r="34" class="hi"/><circle cx="145" cy="355" r="22" class="hi"/><text x="25" y="510" class="h">滑膜結節／關節內游離體</text><text x="45" y="550" class="b">反覆積液、卡住需專科評估</text></g><g transform="translate(820 100)"><path d="M95 30 Q40 220 105 610" class="nerve"/><path d="M230 20 Q280 220 225 610" class="art"/><text x="5" y="650" class="h">黃：隱神經　紅：膕動脈</text></g></svg>
