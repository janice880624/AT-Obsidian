<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:17px}.bone{fill:#eadfcb;stroke:#6c6252;stroke-width:4}.tendon{fill:none;stroke:#2563eb;stroke-width:18}.nerve{fill:none;stroke:#e11d48;stroke-width:12}.lig{fill:none;stroke:#ca8a04;stroke-width:11}</style><text x="42" y="55" class="t">骨盆與髖第四輪：外側與後側結構關聯</text><path class="bone" d="M270 130q230-70 390 55l-80 120-105-55-110 85-115-55z"/><path class="bone" d="M520 300q120-20 175 90l-45 250H535l35-245z"/><circle cx="560" cy="325" r="78" class="bone"/><path class="tendon" d="M330 150Q460 210 545 320"/><path class="nerve" d="M405 295Q470 380 500 650"/><path class="lig" d="M365 290Q420 420 560 520"/><text x="760" y="160" class="h">藍：臀肌腱至大轉子</text><text x="760" y="200" class="b">外側髖壓縮與拉力需分層管理</text><text x="760" y="300" class="h">紅：深臀區坐骨神經</text><text x="760" y="340" class="b">後臀症狀須先整合腰椎與神經檢查</text><text x="760" y="440" class="h">黃：薦結節／薦棘韌帶區</text><text x="760" y="480" class="b">界定通道，但不能由壓痛單獨確診</text><text x="210" y="685" class="b">非比例教學圖；位置、壓痛與影像均需放回完整臨床脈絡。</text></svg>
