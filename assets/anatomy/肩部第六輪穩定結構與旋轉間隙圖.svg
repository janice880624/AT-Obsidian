<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.bone{fill:#f4e7cf;stroke:#675d4d;stroke-width:4}.lig{stroke:#7c3aed;stroke-width:9;fill:none}.ten{stroke:#0f766e;stroke-width:12;fill:none}</style><text x="40" y="55" class="t">肩部第六輪：後向穩定與旋轉間隙</text><ellipse cx="395" cy="345" rx="115" ry="210" class="bone"/><circle cx="590" cy="345" r="155" class="bone"/><path d="M420 190 Q520 120 650 210" class="lig"/><path d="M420 500 Q520 575 665 485" class="lig"/><path d="M500 225 Q610 175 720 265" class="ten"/><rect x="790" y="125" width="355" height="390" rx="18" fill="#fff" stroke="#52677f" stroke-width="3"/><text x="835" y="170" class="h">臨床整合</text><text x="825" y="220" class="b">後方：盂唇＋囊韌帶</text><text x="825" y="265" class="b">前上：旋轉間隙＋滑車</text><text x="825" y="310" class="b">動態：旋轉肌袖＋肩胛</text><text x="825" y="375" class="h">不要只看一個結構</text><text x="825" y="420" class="b">方向、機轉、負荷、影像</text><text x="825" y="460" class="b">與症狀時間序列須一致</text><text x="95" y="650" class="b">非比例解剖圖；深部壓痛或單一特殊檢查不能定位盂唇、HAGL 或滑車病灶。</text></svg>
