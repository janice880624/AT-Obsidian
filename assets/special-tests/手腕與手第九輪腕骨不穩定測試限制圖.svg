<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.a{fill:#eff6ff;stroke:#2563eb;stroke-width:3}.o{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.r{fill:#fff1f2;stroke:#be123c;stroke-width:3}</style><text x="90" y="55" class="t">腕骨不穩定檢查：陽性只會調整機率</text><rect x="80" y="120" width="480" height="250" rx="18" class="a"/><text x="165" y="170" class="h">月三角 Ballottement</text><text x="125" y="225" class="b">低力比較熟悉痛、位移與終末感</text><text x="125" y="275" class="b">敏感度／特異度有限；陰性不能排除</text><text x="125" y="325" class="b">急性骨性壓痛或腫脹時不做</text><rect x="640" y="120" width="480" height="250" rx="18" class="o"/><text x="760" y="170" class="h">Midcarpal Shift</text><text x="695" y="225" class="b">觀察疼痛 catch-up clunk 與可控制性</text><text x="695" y="275" class="b">無痛鬆弛不等於症狀性不穩定</text><text x="695" y="325" class="b">少次、低力，不反覆製造卡響</text><rect x="175" y="470" width="850" height="155" rx="18" class="r"/><text x="325" y="520" class="h">整合病史＋神經血管＋影像／專科</text><text x="260" y="570" class="b">床邊特殊檢查不能單獨確診，也不能取代骨折與急症分流</text></svg>
