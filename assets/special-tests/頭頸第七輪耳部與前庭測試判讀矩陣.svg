<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:29px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:15px}.x{fill:#fff;stroke:#52677f;stroke-width:3}.y{fill:#fffbeb;stroke:#d97706;stroke-width:3}</style><text x="42" y="55" class="t">耳部與前庭測試：每項只回答一小部分問題</text><rect x="80" y="105" width="300" height="410" rx="16" class="x"/><text x="170" y="150" class="h">Rinne</text><text x="110" y="200" class="b">同耳：氣導 vs 骨導</text><text x="110" y="245" class="b">骨導較響 → 傳導線索</text><text x="110" y="290" class="b">氣導較響 ≠ 排除感音聽損</text><rect x="450" y="105" width="300" height="410" rx="16" class="x"/><text x="545" y="150" class="h">Weber</text><text x="480" y="200" class="b">中線骨導：是否側化</text><text x="480" y="245" class="b">側化需搭配 Rinne</text><text x="480" y="290" class="b">不側化 ≠ 聽力正常</text><rect x="820" y="105" width="300" height="410" rx="16" class="x"/><text x="885" y="150" class="h">Dix-Hallpike</text><text x="850" y="200" class="b">短暫位置觸發＋眼震模式</text><text x="850" y="245" class="b">典型模式支持後管 BPPV</text><text x="850" y="290" class="b">陰性 ≠ 排除其他管別／中樞</text><rect x="120" y="575" width="960" height="100" rx="16" class="y"/><text x="235" y="615" class="h">三者都不是確診終點：整合耳鏡、正式聽力、神經／眼震／步態與追蹤</text><text x="315" y="655" class="b">新聽損或神經紅旗優先轉介；不要為完成測試而延誤急救。</text><text x="395" y="725" class="b">原創教學矩陣；數值與適用性以原始研究及指南為準。</text></svg>
