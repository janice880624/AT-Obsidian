<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.x{fill:#fff;stroke:#52677f;stroke-width:4}.a{fill:none;stroke:#0ea5e9;stroke-width:10}.p{fill:none;stroke:#d97706;stroke-width:10}</style><text x="55" y="55" class="t">髖內旋與 30 秒椅子站立：標準化量測</text><rect x="70" y="110" width="500" height="500" rx="22" class="x"/><text x="180" y="165" class="h">髖關節內旋活動度</text><path d="M250 260L390 260L450 450" class="p"/><path d="M390 260Q520 360 450 450" class="a"/><text x="145" y="520" class="b">固定骨盆、量角、記錄熟悉痛</text><rect x="630" y="110" width="500" height="500" rx="22" class="x"/><text x="760" y="165" class="h">30 秒椅子站立</text><path d="M760 480L1000 480M800 480L800 560M960 480L960 560" class="p"/><circle cx="880" cy="260" r="45" class="a"/><path d="M880 305L880 430M880 335L800 380M880 335L960 380M880 430L825 500M880 430L935 500" class="a"/><text x="720" y="575" class="b">同椅高與手位；記錄次數與症狀</text><text x="240" y="680" class="h">兩項測試皆不能單獨診斷病灶；高骨性或感染疑慮先停止</text></svg>
