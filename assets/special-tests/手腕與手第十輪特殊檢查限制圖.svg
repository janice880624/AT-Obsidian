<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.a{fill:#eff6ff;stroke:#2563eb;stroke-width:3}.o{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.r{fill:#fff1f2;stroke:#be123c;stroke-width:3}</style><text x="105" y="55" class="t">手部特殊檢查：結果只調整機率</text><rect x="80" y="120" width="480" height="260" rx="18" class="a"/><text x="220" y="170" class="h">Durkan 壓迫測試</text><text x="125" y="225" class="b">重現正中神經分布熟悉麻刺</text><text x="125" y="275" class="b">敏感度中位約 0.67；不能單獨診斷</text><rect x="640" y="120" width="480" height="260" rx="18" class="o"/><text x="760" y="170" class="h">甲下點壓與冷敏感</text><text x="695" y="225" class="b">一次、低力、鈍端，記錄熟悉劇痛</text><text x="695" y="275" class="b">仍需影像定位與病理確認</text><rect x="175" y="485" width="850" height="150" rx="18" class="r"/><text x="330" y="535" class="h">不要用反覆疼痛刺激換取陽性</text><text x="270" y="585" class="b">整合病史、神經血管、功能、影像與專科；單一測試不是診斷</text></svg>
