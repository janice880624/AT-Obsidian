<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.x{fill:#fff;stroke:#52677f;stroke-width:4}.p{fill:none;stroke:#7c3aed;stroke-width:12}.a{fill:none;stroke:#0ea5e9;stroke-width:8}.r{stroke:#dc2626;stroke-width:6}</style><text x="55" y="55" class="t">標準化 EAST 與 QuickDASH：誘發與功能分開記錄</text><rect x="70" y="110" width="500" height="500" rx="22" class="x"/><text x="205" y="165" class="h">EAST 最長 3 分鐘</text><circle cx="320" cy="260" r="45" class="p"/><path d="M320 305L320 465M320 350L185 315M320 350L455 315M185 315L150 390M455 315L490 390" class="p"/><text x="120" y="535" class="b">記熟悉症狀與停止時間，不只看脈搏或痠</text><rect x="630" y="110" width="500" height="500" rx="22" class="x"/><text x="800" y="165" class="h">QuickDASH 0–100</text><path d="M730 500L730 225M730 500L1035 500" class="a"/><path d="M760 450L835 385L915 410L1010 280" class="p"/><line x1="1010" y1="280" x2="1010" y2="500" class="r"/><text x="700" y="555" class="b">跨次追蹤功能；高分＝較大障礙，不作確診</text><text x="270" y="680" class="h">任何血管紅旗先急診，不進行誘發或功能負荷測試</text></svg>
