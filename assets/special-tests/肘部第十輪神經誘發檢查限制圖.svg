<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.x{fill:#fff;stroke:#52677f;stroke-width:3}.r{fill:#fff1f2;stroke:#be123c;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="70" y="58" class="t">少見神經通道：動態檢查只提供定位線索</text><rect x="80" y="120" width="480" height="330" rx="20" class="x"/><text x="160" y="170" class="h">髁上突通道</text><text x="125" y="230" class="b">小幅伸肘＋旋前</text><text x="125" y="280" class="b">同步看正中神經與手部灌流</text><text x="125" y="330" class="b">任何色變、手冷立即停止</text><rect x="640" y="120" width="480" height="330" rx="20" class="x"/><text x="745" y="170" class="h">副肘肌與肘隧道</text><text x="690" y="230" class="b">緩慢屈伸、輕觸不壓神經</text><text x="690" y="280" class="b">看肌肉鼓起、滑動與熟悉症狀</text><text x="690" y="330" class="b">解剖變異本身不是陽性</text><rect x="170" y="545" width="860" height="120" rx="20" class="r"/><text x="280" y="595" class="h">禁做：急性骨折、進展無力、持續感覺缺損或灌流異常</text><text x="350" y="635" class="b">整合動態超音波、電生理、影像與完整神經定位</text></svg>
