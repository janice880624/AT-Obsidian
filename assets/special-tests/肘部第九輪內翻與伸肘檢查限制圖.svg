<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.x{fill:#fff;stroke:#52677f;stroke-width:3}.r{fill:#fff1f2;stroke:#be123c;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="70" y="58" class="t">肘部特殊檢查：線索，不是確診工具</text><rect x="85" y="125" width="475" height="330" rx="20" class="x"/><text x="190" y="175" class="h">內翻應力測試</text><text x="135" y="235" class="b">排除急性骨折後才做低力比較</text><text x="135" y="285" class="b">記錄疼痛、終末感、鬆弛與恐懼</text><text x="135" y="335" class="b">陰性不能排除 VPMRI</text><rect x="640" y="125" width="475" height="330" rx="20" class="x"/><text x="735" y="175" class="h">主動伸肘＋缺損</text><text x="690" y="235" class="b">先觀察活動、輪廓與瘀青</text><text x="690" y="285" class="b">急性疑撕裂不加最大阻力</text><text x="690" y="335" class="b">能伸肘不能排除部分撕裂</text><rect x="170" y="545" width="860" height="120" rx="20" class="r"/><text x="275" y="595" class="h">禁做：疑骨折脫臼、皮膚危機、劇痛或神經血管異常</text><text x="355" y="635" class="b">整合病史、影像、神經血管與專科評估</text></svg>
