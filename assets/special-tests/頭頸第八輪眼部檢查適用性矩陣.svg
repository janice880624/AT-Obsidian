<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:29px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:15px}.x{fill:#fff;stroke:#52677f;stroke-width:3}.y{fill:#fffbeb;stroke:#d97706;stroke-width:3}</style><text x="40" y="55" class="t">眼部檢查：每一項只回答一小部分問題</text><rect x="80" y="110" width="300" height="390" rx="16" class="x"/><text x="165" y="155" class="h">逐眼視力</text><text x="110" y="205" class="b">功能基線與惡化趨勢</text><text x="110" y="250" class="b">正常 ≠ 排除裂孔／破裂</text><rect x="450" y="110" width="300" height="390" rx="16" class="x"/><text x="515" y="155" class="h">螢光／Seidel</text><text x="480" y="205" class="b">上皮缺損與房水滲漏</text><text x="480" y="250" class="b">陰性 ≠ 排除自封閉傷口</text><rect x="820" y="110" width="300" height="390" rx="16" class="x"/><text x="885" y="155" class="h">九方位運動</text><text x="850" y="205" class="b">複視、卡壓、顱神經線索</text><text x="850" y="250" class="b">正常 ≠ 視網膜與前房安全</text><rect x="135" y="565" width="930" height="105" rx="16" class="y"/><text x="255" y="610" class="h">任何紅旗先保護與轉介；不要為「做完測試」延誤眼科急症</text><text x="270" y="650" class="b">所有結果需整合機轉、瞳孔、視野症狀、裂隙燈／眼底與追蹤。</text><text x="410" y="725" class="b">原創教學矩陣；不取代專業資格與當地流程。</text></svg>
