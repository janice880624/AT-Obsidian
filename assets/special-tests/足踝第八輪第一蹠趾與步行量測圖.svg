<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.x{fill:#fff;stroke:#52677f;stroke-width:4}.a{fill:none;stroke:#0ea5e9;stroke-width:10}.p{fill:none;stroke:#d97706;stroke-width:10}.m{stroke:#dc2626;stroke-width:5}</style><text x="55" y="55" class="t">第一蹠趾關節與六分鐘步行：標準化量測</text><rect x="70" y="110" width="500" height="500" rx="22" class="x"/><text x="165" y="165" class="h">第一蹠趾被動背屈</text><path d="M150 400L420 400L500 315" class="p"/><path d="M420 400Q475 400 500 315" class="a"/><line x1="420" y1="400" x2="500" y2="400" class="m"/><text x="130" y="545" class="b">固定第一蹠骨、量角、記錄終點與熟悉痛</text><rect x="630" y="110" width="500" height="500" rx="22" class="x"/><text x="780" y="165" class="h">六分鐘步行</text><path d="M700 390L1050 390" class="p"/><circle cx="770" cy="290" r="35" class="a"/><path d="M770 325L770 440M770 350L710 390M770 350L830 390M770 440L730 520M770 440L825 520" class="a"/><text x="680" y="555" class="b">固定走道與提示；記錄距離、休息、輔具與症狀</text><text x="235" y="680" class="h">量測症狀與功能，不以單一結果確診或決定回場</text></svg>
