<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.x{fill:#fff;stroke:#52677f;stroke-width:4}.jaw{fill:none;stroke:#d97706;stroke-width:14}.m{stroke:#0ea5e9;stroke-width:6}.r{stroke:#dc2626;stroke-width:5}</style><text x="55" y="55" class="t">咬合快速檢查與最大張口量測：適用性分開</text><rect x="70" y="110" width="500" height="500" rx="22" class="x"/><text x="180" y="165" class="h">急性中顏面外傷</text><path d="M160 330Q320 240 480 330M160 390Q320 480 480 390" class="jaw"/><line x1="240" y1="350" x2="400" y2="350" class="r"/><text x="120" y="525" class="b">只低力觀察咬合；高能量不反覆搖上顎</text><rect x="630" y="110" width="500" height="500" rx="22" class="x"/><text x="760" y="165" class="h">危險排除後追蹤</text><path d="M740 300Q880 220 1020 300M740 470Q880 550 1020 470" class="jaw"/><line x1="880" y1="310" x2="880" y2="460" class="m"/><text x="700" y="555" class="b">毫米記錄張口、前突、側移與症狀</text><text x="215" y="680" class="h">量測功能，不用單一結果確診骨折、脫臼或決定回場</text></svg>
