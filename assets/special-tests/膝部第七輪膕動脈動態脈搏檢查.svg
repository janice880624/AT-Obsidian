<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.leg{fill:#e8dcc6;stroke:#675d4d;stroke-width:4}.art{fill:none;stroke:#dc2626;stroke-width:13}.a{fill:none;stroke:#2563eb;stroke-width:7}</style><text x="40" y="55" class="t">膕動脈動態脈搏誘發：初步線索，不是確診工具</text><g transform="translate(150 120)"><rect x="130" y="20" width="150" height="420" rx="70" class="leg"/><path d="M205 20 L205 440" class="art"/><path d="M120 500 Q205 430 290 500" class="a"/><text x="60" y="575" class="h">基線：膝伸直、足部放鬆</text><text x="65" y="615" class="b">記錄雙側足背與脛後脈搏</text></g><g transform="translate(650 120)"><rect x="130" y="20" width="150" height="420" rx="70" class="leg"/><path d="M205 20 Q250 220 205 440" class="art"/><path d="M95 520 Q205 400 315 520" class="a"/><text x="35" y="575" class="h">動態：短時間蹠屈／背屈</text><text x="35" y="615" class="b">立即比較脈搏、症狀與恢復時間</text></g><text x="205" y="690" class="b">疑似者需運動前後 ABI、動態都卜勒及血管專科評估；急性缺血時不做挑釁。</text></svg>
