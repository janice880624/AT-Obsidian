<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.x{fill:#fff;stroke:#52677f;stroke-width:3}.r{fill:#fff1f2;stroke:#be123c;stroke-width:3}.g{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><text x="65" y="55" class="t">肘部機械症狀與神經血管：不要用單一測試定案</text><rect x="90" y="120" width="470" height="235" rx="18" class="x"/><text x="200" y="165" class="h">喀響／僵硬但可活動</text><text x="140" y="220" class="b">比較活動弧、終末感、腫脹與負荷反應</text><text x="140" y="265" class="b">退化、游離體、滑膜病變皆可能</text><text x="140" y="310" class="b">持續或進展 → 影像／專科</text><rect x="640" y="120" width="470" height="235" rx="18" class="r"/><text x="770" y="165" class="h">固定鎖住或灌流異常</text><text x="690" y="220" class="b">停止挑釁，不強推穿越阻擋</text><text x="690" y="265" class="b">手冷、回填差、脈弱或麻弱需急迫轉介</text><text x="690" y="310" class="b">粉紅無脈仍需連續神經血管監測</text><rect x="215" y="470" width="770" height="150" rx="18" class="g"/><text x="320" y="520" class="h">外翻壓力與 Pucker Sign 都只是情境線索</text><text x="285" y="570" class="b">整合病史、對側比較、神經血管、影像與時間趨勢；不可單獨確診或排除</text></svg>
