<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:29px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:15px}.x{fill:#fff;stroke:#52677f;stroke-width:3}.y{fill:#fffbeb;stroke:#d97706;stroke-width:3}</style><text x="40" y="55" class="t">急性無力肩：檢查組合而非單一確診</text><rect x="70" y="115" width="320" height="360" rx="16" class="x"/><text x="135" y="160" class="h">Drop Arm</text><text x="105" y="215" class="b">較大肌袖撕裂輔助線索</text><text x="105" y="260" class="b">高特異、低敏感的典型模式</text><text x="105" y="305" class="b">陰性不能排除</text><rect x="440" y="115" width="320" height="360" rx="16" class="x"/><text x="500" y="160" class="h">Hornblower</text><text x="475" y="215" class="b">小圓肌／後上方肌袖線索</text><text x="475" y="260" class="b">先區分腋神經與疼痛</text><text x="475" y="305" class="b">研究族群限制外推</text><rect x="810" y="115" width="320" height="360" rx="16" class="x"/><text x="875" y="160" class="h">主動－被動差</text><text x="845" y="215" class="b">描述假性麻痺模式</text><text x="845" y="260" class="b">先排骨折、脫臼、神經</text><text x="845" y="305" class="b">角度界值不是確診</text><rect x="145" y="560" width="910" height="105" rx="16" class="y"/><text x="245" y="605" class="h">整合機轉、影像、神經血管與多項檢查；不要反覆測到疲勞</text><text x="370" y="645" class="b">原創教學矩陣，不取代影像或專科判斷。</text></svg>
