<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px}.a{fill:#eff6ff;stroke:#2563eb;stroke-width:3}.v{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.s{fill:#ecfdf5;stroke:#047857;stroke-width:3}.m{fill:#f5f3ff;stroke:#7c3aed;stroke-width:3}.r{fill:#fff1f2;stroke:#be123c;stroke-width:3}</style><text x="85" y="55" class="t">持續手部疼痛：四類徵象＋排除其他診斷</text><rect x="80" y="115" width="480" height="170" rx="18" class="a"/><text x="220" y="160" class="h">感覺</text><text x="135" y="210" class="b">痛覺過敏、觸覺異常、區域性疼痛</text><rect x="640" y="115" width="480" height="170" rx="18" class="v"/><text x="790" y="160" class="h">血管運動</text><text x="710" y="210" class="b">溫度與顏色不對稱；同環境雙側比較</text><rect x="80" y="335" width="480" height="170" rx="18" class="s"/><text x="190" y="380" class="h">出汗／水腫</text><text x="135" y="430" class="b">水腫、出汗改變或不對稱</text><rect x="640" y="335" width="480" height="170" rx="18" class="m"/><text x="760" y="380" class="h">運動／營養</text><text x="695" y="430" class="b">活動、力量、顫抖、肌張力、皮膚毛甲</text><rect x="185" y="585" width="830" height="100" rx="18" class="r"/><text x="300" y="627" class="h">先排除感染、缺血、神經卡壓與未癒合骨折</text><text x="260" y="662" class="b">Budapest Criteria 是整合框架；單一溫差、痛覺或水腫不能確診</text></svg>
