<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:17px}.foot{fill:#eadfcb;stroke:#675d4d;stroke-width:4}.ten{fill:none;stroke:#2563eb;stroke-width:12}.a{fill:none;stroke:#dc2626;stroke-width:7}</style><text x="40" y="55" class="t">FHL 伸展與主動拇趾蹠屈誘發：定位線索，不是確診</text><g transform="translate(100 125)"><path d="M170 30 L170 340 Q250 390 420 360 L480 430 Q250 470 110 410 L90 80Z" class="foot"/><path d="M135 40 Q210 230 185 370 Q310 390 445 420" class="ten"/><path d="M430 330 Q500 375 440 450" class="a"/><text x="80" y="540" class="h">比較踝背屈時的拇趾被動伸展</text></g><g transform="translate(700 125)"><path d="M70 70 Q230 30 360 160 L420 255 Q250 300 80 245Z" class="foot"/><path d="M50 120 Q200 175 390 245" class="ten"/><path d="M350 170 Q430 230 350 290" class="a"/><text x="40" y="410" class="h">再做低力主動拇趾蹠屈</text><text x="20" y="455" class="b">記錄後內踝／足弓熟悉痛、卡響與雙側差異</text></g><text x="210" y="675" class="b">避免強拉與反覆觸發；須鑑別踝後夾擠、脛後肌腱、足根管與第一蹠趾關節。</text></svg>
